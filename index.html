<style>
/* Layout: una columna tipo app móvil; cabecera monte + tarjeta de pregunta + barra de acción fija abajo */
:root {
  --bg: #eef0e6;          /* papel salvia */
  --surface: #fbfcf6;
  --ink: #1f2619;
  --muted: #5d6652;
  --line: #d3d8c4;
  --forest: #2f3b2a;      /* verde monte */
  --forest-ink: #f1f3e8;
  --blaze: #e8590c;       /* naranja de seguridad (chaleco de batida) */
  --blaze-soft: #fde3d3;
  --ok: #2b7a3d;
  --ok-soft: #dcefd9;
  --bad: #b3261e;
  --bad-soft: #f8dcd8;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a12; --surface: #1d2519; --ink: #e8ecdc; --muted: #9ea791; --line: #333e2d;
    --forest: #0f140d; --forest-ink: #e8ecdc; --blaze: #ff7a2e; --blaze-soft: #3b2215;
    --ok: #6cc47f; --ok-soft: #1c3321; --bad: #ff8a80; --bad-soft: #3d1f1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a12; --surface: #1d2519; --ink: #e8ecdc; --muted: #9ea791; --line: #333e2d;
  --forest: #0f140d; --forest-ink: #e8ecdc; --blaze: #ff7a2e; --blaze-soft: #3b2215;
  --ok: #6cc47f; --ok-soft: #1c3321; --bad: #ff8a80; --bad-soft: #3d1f1c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--forest); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabecera */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--forest); color: var(--forest-ink); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand svg { flex: none; }
.brand b { font-family: var(--display); font-size: 1.45rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; font-size: .78rem; opacity: .75; letter-spacing: .04em; }
.iconbtn { background: transparent; border: 1px solid color-mix(in srgb, var(--forest-ink) 30%, transparent); color: var(--forest-ink); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: .9rem; }

/* Selector de comunidad */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 6px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--forest); color: var(--forest-ink); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--blaze); color: #1a0d05; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--blaze); color: #1a0d05; } }

main { padding-block: 18px 120px; display: grid; gap: 18px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.eyebrow { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Panel resumen */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat .v { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .8rem; color: var(--muted); margin-top: 4px; }

/* Botón principal de simulacro */
.hero-btn { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: var(--blaze); color: #1a0d05; border: 0; border-radius: 18px; padding: 18px 20px; }
.hero-btn b { font-family: var(--display); font-size: 1.7rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1; display: block; }
.hero-btn span { font-size: .92rem; font-weight: 500; }
.hero-btn .arrow { font-family: var(--display); font-size: 2.2rem; font-weight: 700; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: left; display: grid; gap: 2px; }
.act b { font-weight: 700; }
.act span { font-size: .85rem; color: var(--muted); }
.act:disabled { opacity: .5; cursor: default; }

/* Lista de temas */
.temas { display: grid; gap: 8px; }
.tema { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; display: grid; gap: 8px; }
.tema .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tema .name { font-weight: 600; min-width: 0; }
.tema .count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); }
.bar .r { background: var(--bad); }

.hist { display: grid; gap: 6px; }
.hist div { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; }
.pill { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.note { font-size: .85rem; color: var(--muted); margin: 0; }

/* Vista de pregunta */
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.progress { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--blaze); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 16px; }
.qtext { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin: 0; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt { width: 100%; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left;
  background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px; transition: border-color .15s, background .15s; }
.opt .k { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.15rem; background: var(--surface); border: 1px solid var(--line); text-transform: uppercase; }
.opt .t { padding-top: 5px; min-width: 0; }
.opt.sel { border-color: var(--blaze); background: var(--blaze-soft); }
.opt.sel .k { background: var(--blaze); color: #1a0d05; border-color: var(--blaze); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt:disabled { cursor: default; color: var(--ink); }
.qimg { margin: 0; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.qimg img { display: block; width: 100%; max-height: 52vh; object-fit: contain; cursor: zoom-in; }
.spinfo { font-size: .88rem; color: var(--muted); line-height: 1.35; }
figcaption.spinfo { padding: 8px 10px; }
figcaption.spinfo b, .zoom p b { color: var(--ink); }
.zoom { position: fixed; inset: 0; z-index: 30; background: rgba(5, 7, 4, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 72vh; object-fit: contain; border-radius: 8px; }
.zoom p { margin: 0; max-width: 640px; color: #d9dece; font-size: .95rem; line-height: 1.4; }
.zoom p b { color: #fff; }
.zoom .btn { flex: none; padding: 10px 22px; }
.feedback { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.timer { font-family: var(--display); font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Cuadrícula de navegación del examen */
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.grid button { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: .8rem; font-weight: 600; padding: 0; font-variant-numeric: tabular-nums; }
.grid button.done { background: var(--forest); color: var(--forest-ink); border-color: var(--forest); }
.grid button.cur { outline: 2px solid var(--blaze); outline-offset: 1px; }
.grid button.g { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.grid button.r { background: var(--bad); color: var(--surface); border-color: var(--bad); }

/* Barra inferior */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { display: flex; gap: 10px; padding-block: 12px; }
.btn { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 1rem; background: var(--forest); color: var(--forest-ink); }
.btn.alt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; }
.btn.blaze { background: var(--blaze); color: #1a0d05; }
.btn:disabled { opacity: .45; cursor: default; }

/* Resultado */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 10px; text-align: center; }
.result .big { font-family: var(--display); font-size: 4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.result .verdict { font-family: var(--display); font-size: 1.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.result .verdict.ok { color: var(--ok); }
.result .verdict.bad { color: var(--bad); }
.review { display: grid; gap: 10px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; font-size: .95rem; }
.rv .q { font-weight: 600; }
.rv .y { color: var(--bad); }
.rv .c { color: var(--ok); font-weight: 700; }
.rv .o { color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--forest); color: var(--forest-ink); border-color: var(--forest); }
.search { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery figcaption { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; align-items: flex-start; }
.gallery img { max-height: 160px; object-fit: cover; aspect-ratio: 4 / 3; }
.gallery .spinfo { display: block; }

/* Diálogo de confirmación propio */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 8, .5); display: grid; align-items: end; }
.sheet .panel { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-width: 640px; width: 100%; margin: 0 auto; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 1.5rem; text-transform: uppercase; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .btns { display: flex; gap: 10px; }

@media (max-width: 380px) { .grid { grid-template-columns: repeat(6, 1fr); } .stat .v { font-size: 1.6rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const DATA = {"M":{"name":"Comunidad de Madrid","short":"Madrid","src":"Cuaderno oficial de preguntas (FMC, ed. 2018)","temas":["Legislación cinegética y normativa ambiental","Regulación de la caza","Riqueza faunística","Ordenación cinegética","Ética y seguridad en la caza"],"q":[[0,1,"El ámbito de aplicación de la directiva aves y la directiva hábitats se haya circunscrito a los países de:",["Europa.","La Unión Europea.","La Unión Europea y EEUU."],1],[0,2,"La legislación que en cuanto a la práctica de la caza es de aplicación a la Comunidad de Madrid es:",["Exclusivamente normativa estatal.","Exclusivamente normativa autonómica.","Normativa internacional, estatal y autonómica."],2],[0,3,"La Directiva «Aves» (Directiva 2009/147/CE del Parlamento Europeo y del Consejo, de 30 de noviembre de 2009, relativa a la conservación de las aves silvestres) tiene como finalidad la conservación de las todas las especies de aves que viven en estado salvaje en la Unión Europea (UE) y prohíbe en particular:",["La recogida de huevos, aunque estén vacíos.","Disparar sobre hembras de aves.","El autoconsumo sin previo análisis veterinario de aves migratorias."],0],[0,4,"La Directiva «Hábitats» (o Directiva 92/43/CEE del Consejo de 21 de mayo de 1992 relativa a la conservación de los hábitats naturales y de la fauna y la flora silvestres) crea la Red Natura 2000, que incluye:",["Las Zonas de Especial Protección de Aves o ZEPA, designadas en virtud de la Directiva Aves, y los Lugares de Interés Comunitario o LIC, designados en virtud de esta Directiva Hábitats.","Los Parques Naturales y Reservas de la Biosfera.","Todos aquellos lugares de especial protección medioambiental."],0],[0,5,"Se prohíbe la tenencia y el uso de munición que contenga plomo durante el ejercicio de la caza y el tiro deportivo, cuando estas actividades se ejerzan en:",["Zonas de caza controlada o terrenos libres.","Todos los ríos, lagos y otras zonas húmedas de dominio público hidráulico.","Zonas húmedas incluidas en la Lista del Convenio de Ramsar, embalses y humedales catalogados de la Comunidad de Madrid."],2],[0,6,"Actualmente en terrenos acotados al efecto en la Comunidad de Madrid podrán cazarse las especies de caza menor relacionadas en la correspondiente Orden de Vedas los:",["Martes, jueves, sábados, domingos y festivos nacionales y autonómicos en la Comunidad de Madrid, desde los días 8 de octubre hasta el 31 de enero del siguiente año, ambos incluidos.","Jueves, sábados, domingos y festivos, desde los días 8 de octubre hasta el 31 de enero del siguiente año, ambos incluidos.","Jueves, sábados, domingos y festivos nacionales y autonómicos en la Comunidad de Madrid, desde los días 8 de octubre hasta el 31 de enero del siguiente año, ambos incluidos."],2],[0,7,"En un coto situado en la Comunidad de Madrid podrán cazarse en media veda las especies que dicta la correspondiente Orden Anual de Vedas los jueves, sábados, domingos y festivos nacionales y autonómicos en dicha comunidad autónoma comprendidos entre los días 15 de agosto y 15 de septiembre, en aquellos cotos de caza con superficie:",["Igual o superior a 250 hectáreas.","Igual o superior a 50 hectáreas.","Igual o superior a 500 hectáreas."],0],[0,8,"Una área ZEPA es una zona de especial protección para:",["Los anfibios.","Las águilas.","Las aves."],2],[0,9,"Cualquier persona que ejerza el ejercicio de la caza en un coto situado en la Comunidad de Madrid no podrá exceder en media veda el cupo de:",["10 ejemplares de tórtola común y 10 de paloma bravía por cazador y día.","10 ejemplares de tórtola común y 10 de codorniz por cazador y día.","10 ejemplares de tórtola común y 20 de codorniz por cazador y día."],1],[0,10,"En caso de ser aconsejable reducir la densidad de conejo en un determinado coto de caza para disminuir la propagación de la mixomatosis o de la neumonía hemorrágico vírica, podrá autorizarse la caza entre los días 15 de junio y 25 de julio en las modalidades:",["Con escopeta permitiéndose el uso de perros o con aves de cetrería.","Con escopeta no permitiéndose el uso de perros o con aves de cetrería.","Con escopeta no permitiéndose el uso de perros."],1],[0,11,"En la caza de la liebre con galgo queda prohibido:",["El empleo de armas de fuego y cualquier otra raza de perros que no sea el galgo.","El empleo de armas de fuego y formar manos de más de cinco cazadores.","El empleo de cualquier otra raza de perros que no sea el galgo y formar manos de más de cinco cazadores."],0],[0,12,"Durante la práctica de la caza con galgo:",["No se podrán soltar o correr más de dos galgos por carrera a cada liebre, excepto cuando uno de ellos tenga edad igual o inferior a doce meses, en cuyo caso se soltarán como máximo tres galgos.","No se podrán soltar o correr más de tres galgos por carrera a cada liebre, excepto cuando uno de ellos tenga edad igual o inferior a once meses, en cuyo caso se soltarán como máximo cuatro galgos.","No se podrán soltar o correr más de dos galgos por carrera a cada liebre, excepto cuando uno de ellos tenga edad igual o inferior a once meses, en cuyo caso se soltarán como máximo tres galgos."],2],[0,13,"Sobre el control de predadores cinegéticos de caza menor:",["La Consejería competente en materia de medio ambiente podrá autorizar el control con escopeta o aves de cetrería de las poblaciones de grajilla, urraca, corneja y zorro.","Se llevará a cabo de lunes a viernes no festivos, entre el 1 y el 28 de febrero, ambos incluidos e improrrogables bajo ningún concepto.","Ambas afirmaciones son correctas."],0],[0,14,"Para llevar a cabo el control de predadores cinegéticos de caza menor mediante el uso de métodos selectivos y no masivos:",["La Consejería competente en materia de medio ambiente podrá autorizar el desarrollo de esta actividad a cualquiera de los titulares de un coto privado de caza, sin necesidad de una petición previa ni acreditación de estos.","La Consejería competente en materia de medio ambiente podrá autorizarlo sin armas de fuego y siempre que estos métodos cumplan con los criterios de bienestar y selectividad de los acuerdos internacionales.","Las dos anteriores son falsas."],1],[0,15,"Durante el ejercicio de la caza de palomas migratorias en pasos tradicionales de la Comunidad de Madrid:",["Queda prohibido la caza en una franja de seguridad de 500 metros en torno a la línea de tiro, el tránsito fuera de los puestos con las armas desenfundadas y la tenencia o uso de balas durante la práctica de la misma.","Está permitido el uso de las escopetas volantes y la caza de otras especies que no sean palomas torcaces.","Está prohibido el ejercicio de la caza en una franja de seguridad de 250 metros en torno a la línea de tiro."],0],[0,16,"En la caza de la becada se establece un cupo máximo de 3 ejemplares por cazador y día y esta podrá practicarse únicamente en las modalidades de:",["“Al salto o a rabo” y “en mano”.","“Al paso” y “en mano”.","“En mano” y en “ojeo”."],0],[0,17,"Los cupos de captura de corzo en la Comunidad de Madrid se realizarán conforme a:",["Lo que la Junta Directiva del coto de caza en cuestión estime oportuno.","Los que hayan sido indicados en la Resolución Aprobatoria de su Plan de Aprovechamiento Cinegético.","Los que la Federación de Caza estime oportunos para cada comarca o región."],1],[0,18,"En la modalidad de rececho el cazador deberá portar en todo momento el precinto que le autoriza a realizar dicha caza. Y que habrá de colocar inmediatamente, una vez cobrada la pieza:",["En la cuerna en caso de que se trate de cabra montés y en la oreja cuando se trate de corzo.","En la cuerna en caso de que se trate de machos de corzo o cabra montés y en la oreja cuando se trate de hembras de corzo.","En la cuerna en caso de que se trate de machos de corzo y en la oreja cuando se trate de cabra montés."],2],[0,19,"Todos los titulares de cotos privados de caza deberán comunicar a la Consejería competente en materia de Medio Ambiente, los resultados cinegéticos totales obtenidos durante la presente temporada:",["Antes del 31 de marzo.","Antes del 31 de abril.","Antes del último día hábil de cada temporada general de caza."],0],[0,20,"Queda prohibido, con carácter general, el uso y tenencia de:",["Armas automáticas, así como las semiautomáticas cuyo cargador pueda contener más de dos cartuchos y uno en la recámara.","Escopetas yuxtapuestas de más de 40 años de antigüedad.","Armas cortas."],0],[0,21,"Se denominan “postas” y está prohibido su empleo en la caza, a aquellos proyectiles introducidos en cartuchos en número de dos o más y cuyo peso unitario es igual o superior a:",["3,5 gramos (diámetro mayor de 7,5 milímetros).","2,5 gramos (diámetro mayor de 6,5 milímetros).","2,5 gramos (diámetro mayor de 7,5 milímetros)."],2],[0,22,"Con carácter general en cuanto a los comúnmente conocidos como terrenos libres:",["Se prohíbe la práctica de cualquier actividad cinegética en la Comunidad de Madrid.","Puedo cazar en cualquier terreno que no cuente con un guarda de caza.","Si no está debidamente señalizado se considera terreno libre y puedo cazar en él."],0],[0,23,"La distancia entre puestos en el caso de la caza de palomas y zorzales en cotos de la Comunidad de Madrid debe ser de:",["Al menos 75 metros tal como indica la orden general de vedas.","Al menos 50 metros tal como indica la orden general de vedas y 250 de la linde del coto limítrofe.","No hay una indicación específica en la actual orden de vedas, si no que será el sentido común el que llevará a los cazadores a situarse de manera correcta."],1],[0,24,"Los cazadores que ocupen un puesto en las monterías, ganchos y batidas de caza mayor, y los que practiquen la modalidad de caza de jabalí al salto, deberán llevar alguna prenda (gorra, cinta, brazalete o chaleco):",["De color amarillo, verde o naranja, de tonalidad llamativa y reflectante, de forma que cualquier cazador de los puestos contiguos identifique claramente su posición.","En el que aparezca impreso y sean claramente visibles los números identificativos de licencia de caza y socio del coto en cuestión.","De camuflaje homologado para que las piezas de caza no les detecten con facilidad."],0],[0,25,"En el ejercicio de la caza menor al salto o en mano en la Comunidad de Madrid:",["El cazador podrá estar acompañado por un máximo de tres perros.","El cazador podrá estar acompañado por un máximo de cinco perros.","No existe limitación al respecto."],0],[0,26,"En cuanto a especies exóticas invasoras, se permite la captura y muerte, en la Comunidad de Madrid durante la práctica de cualquier actividad cinegética autorizada, de cualquier ejemplar de:",["Cotorra argentina, cotorra de kramer y tórtola turca.","Cotorra argentina y tórtola turca.","Cotorra argentina, cotorra de kramer y mapache."],2],[0,27,"Todos los municipios de la Comunidad de Madrid podrán establecer mecanismos de control para las especies exóticas invasoras, incluyendo aquellos métodos de control no selectivos:",["Verdadero.","Verdadero pero con autorización previa.","Falso."],2],[0,28,"En aquellas zonas en que sea frecuente en el período hábil de caza la presencia de nieve cubriendo el suelo de forma continua, y al objeto de poder practicar la caza de especies de caza mayor, se autoriza la caza exclusivamente de estas especies en las modalidades de montería, gancho y batida cuando la capa de nieve no sea superior a:",["10 centímetros.","20 centímetros.","15 centímetros."],2],[0,29,"Las Órdenes de Vedas deben publicarse:",["En el Boletín Oficial del Estado.","En los Boletines Oficiales de las comunidades autónomas.","Tanto en el Boletín Oficial del Estado como en los de las comunidades autónomas."],1],[0,30,"La competencia para expedir licencias de caza corresponde:",["A la Comunidad Económica Europea.","Al Gobierno de España.","A las comunidades autónomas."],2],[0,31,"Los convenios internacionales suscritos por España en materia de conservación y protección del medio ambiente:",["Son de obligado cumplimiento.","España no tiene suscrito ningún convenio internacional de este tipo, pues la competencia sobre esta materia está reservada a la Unión Europea.","Pueden ser incumplidos siempre que así lo contemple la legislación nacional."],0],[0,32,"El Reglamento (CEE) nº 3254/91 relativo al uso de cepos, la introducción de pieles y otros en la Unión Europea:",["Incluye las especies protegidas que no pueden capturarse por estos métodos en toda la Unión Europea.","Prohíbe el uso de cepos y la introducción en la Unión Europea de pieles y productos manufacturados de determinadas especies de animales salvajes originarias de países que utilizan para su captura cepos o métodos no conformes a las normas internacionales de captura no cruel.","Regula las modalidades cinegéticas que única y exclusivamente pueden practicarse en los países miembros de la Unión Europea."],1],[0,33,"El régimen jurídico básico de la conservación, uso sostenible, mejora y restauración del patrimonio natural y de la biodiversidad española es regulado por:",["La Ley 42/2007, de 13 de diciembre, del Patrimonio Natural y la Biodiversidad.","Las Órdenes de Veda de cada una de las comunidades autónomas.","El Real Decreto 630/2013, de 2 de agosto, por el que se regula el Catálogo Español de Especies Exóticas Invasoras."],0],[0,34,"El Real Decreto 139/2011, de 4 de febrero, para el desarrollo del Listado de Especies Silvestres en Régimen de Protección Especial y del Catálogo Español de Especies Amenazadas:",["Únicamente incluye las especies de fauna que se encuentran amenazadas.","Enumera tanto las de flora como las de fauna con cualquier régimen de protección especial, incluyendo algunas de ellas en el catálogo de especies amenazadas.","Solo contempla las especies de flora y fauna que se encuentran en peligro de extinción."],1],[0,35,"El derecho a cazar puede ejercerse a partir de la edad de:",["7 años.","14 años.","18 años."],1],[0,36,"Los periodos hábiles de caza se publican:",["En la Ley de Caza anual.","En la Constitución Española.","En las Órdenes conocidas como Órdenes Generales de Vedas."],2],[0,37,"¿Cuándo se hace pública la Orden conocida como Orden General de Vedas?",["Una vez cada 5 años.","Cuando se modifica la Ley de Caza.","Cada año, al inicio de la temporada de caza."],2],[0,38,"La relación de especies «cazables» se contempla en:",["La Ley de Caza.","La Orden conocida como Orden General de Vedas.","Los Reglamentos de Caza autonómicos."],1],[0,39,"La propiedad de las piezas de caza menor corresponde:",["A quien las dispara primero.","A quien las abate.","A quien las encuentra."],1],[0,40,"Cazar o transportar especies protegidas:",["Está prohibido.","Está permitido durante el ejercicio de la caza.","Sólo está permitido a los cazadores con licencia de caza."],0],[0,41,"Los vainas de los cartuchos se deben depositar:",["En sitios determinados en el campo.","Deben ser recogidas y depositadas en un contenedor de residuos.","En ningún sitio, pues no es obligación del cazador recogerlas."],1],[0,42,"El uso de armas de fuego a los batidores, secretarios o perreros:",["Está prohibido.","Está permitido durante el ejercicio de la caza.","Sólo les está permitido si poseen licencia de caza."],0],[0,43,"Las vías y caminos de uso público son:",["Zonas de seguridad.","Zonas de caza controlada.","Refugios de caza."],0],[0,44,"¿Qué especies pueden ser objeto de caza?",["Sólo las definidas como piezas de caza.","Todas, excepto las protegidas.","Todas las presentes en un acotado."],0],[0,45,"El empleo de la armas de fuego está permanentemente prohibido en:",["Todos los terrenos sometidos a Régimen Cinegético Especial.","Vías y caminos de uso público, incluidas las vías pecuarias y sus zonas de seguridad.","Reservas regionales de caza."],1],[0,46,"La manipulación de crías o huevos de aves silvestres:",["De manera general está prohibida.","Solo está permitido por los guardas de los cotos de caza.","Sólo está permitido a los cazadores con licencia de caza."],0],[0,47,"En las zonas habitadas debe respetarse un margen de seguridad para el uso de armas de fuego de:",["50 metros.","100 metros.","150 metros."],1],[0,48,"El órgano de representación de todos los cazadores federados madrileños es:",["El Ministerio de Agricultura, Alimentación y Medio Ambiente (MAGRAMA).","La Federación Española de Tiro.","La Federación Madrileña de Caza."],2],[0,49,"En materia cinegética, se consideran agentes de la autoridad.",["Exclusivamente los agentes forestales y de medio ambiente.","Únicamente la Guardia Civil y la Policía Nacional.","Los agentes forestales y de medio ambiente, la Guardia Civil, la Guardería Forestal del Estado, entre otros."],2],[0,50,"La ley reconoce que la caza controlada y su aprovechamiento racional son compatibles con la conservación del medio ambiente y de las especies:",["Falso.","Verdadero.","Sólo en algunos supuestos."],1],[0,51,"La Ley 1/1970, de 4 de abril, de Caza:",["Es de aplicación en la Comunidad de Madrid, ya que no ha desarrollado su propia Ley de Caza autonómica.","No es de aplicación en la Comunidad de Madrid, pues sí cuenta con su propia Ley de Caza autonómica.","Es preconstitucional, por lo que en ningún caso puede aplicarse."],0],[0,52,"Para que pueda constituirse un coto de caza es necesario:",["Que exista continuidad entre los terrenos rústicos que lo configuran.","Que sea declarado como tal por la Consejería de Medio Ambiente a favor de su titular.","Ambas respuestas son correctas."],2],[0,53,"El subarriendo del aprovechamiento cinegético:",["Siempre está permitido.","Puede autorizarse excepcionalmente.","Está prohibido."],2],[1,54,"Para cazar en un coto privado es necesario:",["Estar en posesión de la licencia de caza.","Contar con la autorización del titular del aprovechamiento cinegético.","Sendas respuestas anteriores son correctas."],2],[1,55,"No podré practicar el deporte de la caza con armas en un determinado coto:",["Si no dispongo de la autorización del titular de los derechos cinegéticos.","Si no poseo el seguro de responsabilidad civil del cazador y la correspondiente licencia de caza.","Sendas respuestas anteriores son correctas."],2],[1,56,"Para el ejercicio de la caza con armas de fuego es necesario estar en posesión y portar:",["Licencia de caza y licencia de armas.","Licencia de caza, licencia de armas, guía de pertenencia de cada arma, seguro obligatorio del cazador, autorización del titular del terreno cinegético y acreditar la identidad personal.","Licencia de caza, licencia de armas, DNI, seguro del cazador y autorización del titular del terreno cinegético, no siendo obligatorio portar la guía de pertenencia de cada arma."],1],[1,57,"El cazador caza legalmente cuando:",["Caza en periodos hábiles autorizados, sobre terrenos de aprovechamiento cinegético y por medio de procedimientos autorizados.","Caza en periodos hábiles y por medio de procedimientos autorizados, con independencia del carácter cinegético o no del terreno sobre el que lo hace.","Caza en periodos hábiles autorizados, sobre terrenos de aprovechamiento cinegético, por medio de procedimientos autorizados y observando, además, las disposiciones administrativas y legales vigentes."],2],[1,58,"Si me dispongo a presentar una solicitud en la Consejería de Medio Ambiente de la Comunidad de Madrid con el fin de practicar la captura de aves fringílidas debo contra con:",["La licencia de caza expedida por la Comunidad de Madrid, así como de una autorización del titular del coto en que se efectuarán las capturas en caso de que éstas se celebren en terrenos sometidos a régimen cinegético especial.","Seguro de responsabilidad civil y permiso de armas.","Seguro, licencia y guía de pertenencia."],0],[1,59,"Se considera la acción de cazar como:",["Aquella ejercida por el hombre mediante el uso de artes, armas o medios apropiados para buscar, atraer, perseguir o acosar a las piezas de caza.","El momento en el que se abate o captura la pieza de caza, sin que pueda considerarse como tal la acción previa de atraerla, buscarla, perseguir o acosarla.","Únicamente la acción perseguir a la pieza de caza, sin que pueda considerarse como tal la de atraerla, buscarla o acosarla."],0],[1,60,"Las especies cinegéticas son:",["Todas las especies excepto las que están en peligro de extinción.","Todas las especies excepto las rapaces nocturnas y diurnas.","Las así declaradas por la normativa cinegética."],2],[1,61,"¿Cuál de las siguientes especies renueva su cuerna cada año?",["El muflón.","El corzo.","La cabra montés."],1],[1,62,"¿Cuál de las siguientes especies renueva su cuerna cada año?",["El muflón.","El gamo.","La cabra montés."],1],[1,63,"¿Cuál de las siguientes especies renueva su cuerna cada año?",["El muflón.","El rebeco.","El ciervo."],2],[1,64,"Las hembras de corzo suelen alumbrar:",["Una cría siempre.","Dos crías.","Una o dos crías y excepcionalmente tres."],2],[1,65,"En estado adulto el corzo tiene una altura en la cruz de unos 75 centímetros como máximo y un peso de entre:",["15 y 20 kilogramos.","20 y 30 kilogramos.","30 y 40 kilogramos."],1],[1,66,"Una jabalina puede parir:",["Cuatro veces al año.","Trimestralmente.","Una vez al año."],2],[1,67,"La codorniz es un ave:",["Sedentaria.","Migradora e invernante.","Migradora y estival."],2],[1,68,"¿Cuál de las siguientes especies es sedentaria en la Comunidad de Madrid?",["La tórtola común.","La paloma bravía.","El zorzal."],1],[1,69,"¿Cuál de las siguientes especies es migratoria?",["La paloma bravía.","La paloma zurita.","La perdiz roja."],1],[1,70,"El zorro es un:",["Cánido.","Mustélido.","Félido."],0],[1,71,"El celo del zorro tiene lugar:",["De diciembre a febrero.","En primavera, normalmente en el mes de mayo.","A finales de verano, cuando comienzan las primeras lluvias de septiembre."],0],[1,72,"De los siguientes córvidos, ¿cuál no es cinegético en la Comunidad de Madrid?",["Urraca.","Cuervo.","Grajilla."],1],[1,73,"¿Qué especie se caza fundamentalmente sobre ejemplares de granja?",["La paloma torcaz.","El corzo.","El faisán."],2],[1,74,"La perdiz roja es:",["Migradora.","Sedentaria cambiando el plumaje durante el celo.","Un ave cuyos perdigones, tras eclosionar los huevos, abandonan el nido y siguen a sus progenitores."],2],[1,75,"La perdiz roja es una ave de hábitos:",["Sedentarios.","Nómadas.","Extraños, suele apeonar de un lado a otro continuamente."],0],[1,76,"Por lo general, las nidadas de las perdices están formadas por una cantidad de huevos que oscila entre:",["2 y 6.","12 y 18.","Siempre más de 20."],1],[1,77,"Las palomas y tórtolas son:",["Galliformes.","Limícolas.","Columbiformes."],2],[1,78,"La codorniz es un ave migratoria que suele cazarse en media veda con perros:",["De muestra.","De rastro.","Con galgo."],0],[1,79,"¿Cuál de las siguientes palomas tiene el obispillo blanco?",["La paloma bravía.","La paloma torcaz.","La paloma zurita."],0],[1,80,"A la hora de cazar el zorro lo incluiríamos como:",["Especie de caza mayor.","Especie de caza menor.","Dependiendo de la autorización correspondiente."],1],[1,81,"¿Cuál de las siguientes especies es de caza mayor?",["El ganso.","El zorro.","El corzo."],2],[1,82,"La relación de especies cazables de cada temporada viene expresada en:",["La Ley de Caza Estatal.","El reglamento oportuno.","La Orden Anual de Vedas."],2],[1,83,"Urraca, grajilla y corneja son:",["Tres aves protegidas.","Tres aves de caza menor.","Las dos anteriores son falsas."],1],[1,84,"El zorro cría al año:",["Dos camadas.","Tres camadas.","Una camada."],2],[1,85,"El corzo, el muflón, la cabra montés, el gamo, el venado y el jabalí son especies:",["De caza menor.","De caza mayor.","Si son machos se consideran de caza mayor, hembras y ejemplares del año son de caza menor."],1],[1,86,"El zorro, la liebre y el faisán son:",["Piezas de caza menor.","Piezas de caza mayor.","La liebre y el faisán piezas de caza menor y el zorro de caza mayor."],0],[1,87,"Las cuatro especies de zorzal cuya caza está autorizada en la Comunidad de Madrid son:",["Alirrojo, real, común y bravío.","Alirrojo, bravío, común y charlo.","Charlo, real, común y alirrojo."],2],[1,88,"¿Qué tipo de estornino está considerado especie cinegética en la Comunidad de Madrid?",["Estornino pinto.","Estornino negro y estornino pinto.","Ninguno de los anteriores."],0],[1,89,"En la caza menor se considera propietario de la pieza de caza:",["Al cazador que ha disparado antes.","A quien la abate.","A quien ha hecho sangre primero."],1],[1,90,"En la caza mayor se considera propietario de la pieza de caza:",["Al cazador que ha disparado antes.","A quien la abate.","A quien ha hecho sangre primero."],2],[1,91,"Durante una batida de jabalíes disparo a una hembra pero continúa herida. Finalmente consigue abatirla el puesto de al lado. ¿Tengo derecho a reclamar la propiedad de dicho jabalí?:",["No. Es más, se estaría cometiendo una infracción porque la caza de hembras de jabalí no está permitida.","Sí porque la propiedad de las piezas de caza mayor es de aquel que primero ‘hace sangre’.","Sí, pero su carne será repartida entre ambos cazadores tal como indica la actual Ley de Caza."],1],[1,92,"Disparamos a una perdiz y sale malherida del coto, aunque vemos como finalmente cae dentro del coto colindante:",["Si el terreno es abierto tengo derecho a recuperar la pieza y puedo ir a por ella.","Sea abierto o cerrado puedo entrar porque estoy en mi derecho.","Renunciamos a recuperarla puesto que nuestro derecho al cobro no existe."],0],[1,93,"Si queremos cobrar una pieza que ha caído en coto ajeno y además es visible desde el nuestro, debo ir:",["Con el perro atado y el arma enfundada.","Solo, sin armas ni perros.","Sin arma, pero puede ayudarse del perro para cobrarla."],1],[1,94,"Se considera especie vedada:",["Aquella que no puede ser objeto de caza.","Aquella incluida en el catálogo de especies amenazadas.","Aquella que es cinegética."],0],[1,95,"Se entiende por cupo:",["La limitación en cuanto a número de ejemplares que pueden ser cazados de una determinada especie por cazador y día.","La cantidad de munición que puedo portar un cazador en el ejercicio de la caza.","La limitación de días hábiles de caza."],0],[1,96,"Me dispongo a cazar la codorniz en media veda en un coto de la Comunidad de Madrid y a media mañana ya he capturado 10 ejemplares, ¿qué hago?",["Marcho para casa pues ya he obtenido el cupo establecido.","Marcho para casa, dejo los ejemplares y por la tarde vuelvo a intentar cazar otros 10 como dicta la Ley.","Sigo cazando pues aun existiendo un cupo de 10 ejemplares, puedo ayudar a cazar los que resten a otros compañeros."],0],[1,97,"Los correspondientes cupos de captura en un acotado serán los indicados en:",["La Ley estatal de caza.","El Plan de Aprovechamiento Cinegético y en la Orden General de Vedas.","La página web del Ministerio de Agricultura."],1],[1,98,"Podrá cazarse durante la media veda:",["Aquellos días de la época estival que indique la Orden Anual de Vedas.","Los martes, jueves, sábados, domingos y festivos nacionales.","Las dos anteriores son falsas."],0],[1,99,"Practicaré el descaste de conejo en mi coto de caza siempre y cuando:",["Posea la autorización específica o esté incluido en las comarcas forestales 6, 7, 8 y 9 , dadas las altas densidades de conejo presente y los daños que estos producen a los cultivos agrícolas recogidas en la Orden Anual de Vedas.","El coto esté declarado de caza menor y mayor.","Las dos respuestas anteriores son falsas."],0],[1,100,"El conejo, la perdiz y la liebre, son algunas de las especies de caza menor que pueden cazarse:",["Durante la media veda.","Durante la temporada general de caza.","Durante el periodo conocido como descaste."],1],[1,101,"El ciervo, el gamo, el muflón y el jabalí podrán cazarse en montería, gancho o batida:",["Desde el día 8 de octubre hasta el día 21 de febrero del siguiente año, ambos incluidos.","Desde el día 8 de diciembre hasta el día 21 de febrero del siguiente año, ambos incluidos.","Desde el día 8 de octubre hasta el día 21 de enero del siguiente año, ambos incluidos."],0],[1,102,"¿Cuál de las siguientes aves acuáticas pueden cazarse en la Comunidad Madrid?",["Ánade real y focha.","Ánade real y cerceta común.","Está prohibida la caza de acuáticas."],2],[1,103,"El periodo de caza de machos de cabra montés en Madrid es:",["Desde el día 1 de abril al 30 de junio, del 15 de septiembre al 15 de diciembre y del 1 al 31 de marzo del año siguiente.","Del 15 de septiembre al 15 de diciembre.","Del 15 de septiembre al 15 de diciembre y del 1 al 31 de marzo del año siguiente."],0],[1,104,"El periodo hábil para la caza del corzo en Madrid es:",["Desde el día 1 de abril hasta el día 30 de junio ambos sexos.","Desde el día 1 de abril hasta el día 30 de junio para machos de corzo y desde el día 1 al 30 de septiembre, ambos incluidos, para machos y hembras.","Desde el día 1 de abril hasta el día 30 de junio para machos de corzo y desde el día 1 al 30 de septiembre, ambos incluidos, para hembras de corzo."],1],[1,105,"El milano real:",["Tiene una cola con dos puntas y un entrante en forma angular.","Tiene la cola redondeada.","Las dos anteriores son falsas."],0],[1,106,"La avutarda es:",["El ave voladora de mayor peso de Europa, llegando los machos a pesar hasta 18 kilogramos.","Una anátida muy similar al ganso.","Un ave esteparia sin capacidad de vuelo."],0],[1,107,"Las rapaces cumplen un valor ecológico importante ya que contribuyen a la selección natural de los mejor dotados y evitan la propagación de enfermedades:",["Verdadero.","Verdadero pero suelen provocar la extinción de algunas especies cinegéticas.","Falso."],0],[1,108,"El cuervo es una especie cuya caza está prohibida y que puede confundirse debido a su color y otras similitudes con:",["La grajilla y la corneja.","La perdiz y el faisán.","La tórtola común y la paloma torcaz."],0],[1,109,"El cernícalo vulgar es una pequeña rapaz que cuando caza suele permanecer:",["Apostado en un árbol.","Realizando círculos en zonas húmedas, que es donde mejor se le da cazar.","En vuelo estacionario, casi inmóvil, entre 10 y 20 m de altura sobre el terreno."],2],[1,110,"Las abubillas se identifican fácilmente por poseer:",["Las patas muy largas.","Un plumaje azulado metálico.","Una cresta eréctil."],2],[1,111,"Comadreja, garduña y turón son mustélidos que se caracterizan por tener el cuerpo:",["Redondo.","Largo con patas largas.","Largo, estrecho y flexible."],2],[1,112,"La tórtola común:",["Es más pequeña y de color más oscuro que la tórtola turca.","Es una especie plaga en Madrid que se caza por daños.","Es una paloma que pone nidadas de unos cinco huevos."],0],[1,113,"La becada es:",["Una limícola forestal que tiene el pico muy largo.","Una granívora con un pico romo para comer cereal.","Una gallinácea que suele vivir en pinares o hayedos."],0],[1,114,"Los zorzales son:",["Aves paseriformes migradoras de tamaño similar a un mirlo que suelen ser cazadas desde puesto fijo o en mano.","Aves paseriformes migradoras de aspecto similar a una codorniz que suelen ser cazados a la espera.","Aves migradoras de plumaje llamativo que vuelan en bandos."],0],[1,115,"Cuando se constituye un coto de caza:",["Estoy obligado a cazar todas las especies cinegéticas que incluya.","Se reserva el derecho de caza de todas las especies cinegéticas del mismo.","Debo elegir entre cazar las especies de caza menor o las de mayor."],1],[1,116,"La gestión de la Reserva de Caza de Sonsaz es realizada por:",["La administración competente en materia de medio ambiente de la Comunidad de Madrid.","Los ayuntamientos de los municipios cuyos terrenos o parte de ellos forman parte de la Reserva.","La Federación Madrileña de Caza."],0],[1,117,"Una de las especies cinegéticas más características de la Reserva de Caza de Sonsaz es:",["El corzo.","El ciervo.","La cabra montés."],0],[1,118,"En la Comunidad de Madrid existen 11 pasos tradicionales de palomas migratorias que incluyen una serie de puestos fijos en los que sólo se permite la caza de la paloma torcaz y el zorzal. Esta modalidad de caza se ajustará, en todo caso, a lo establecido en:",["La Orden Anual de Vedas, la normativa específica que la regula y la especifica de espacios protegidos.","La Orden Anual de Vedas exclusivamente, no existe normativa específica al respecto.","La Orden Anual de Vedas y la Ley de Caza de la Comunidad de Madrid."],0],[1,119,"La superficie mínima para un coto de caza de mayor en la Comunidad de Madrid es:",["20 hectáreas.","250 hectáreas.","500 hectáreas."],2],[1,120,"En los cotos de caza menor de pelo inferiores a 250 hectáreas, se puede cazar:",["Conejo, liebre, zorro y el jabalí en mano si lo tiene contemplado en el Plan de Aprovechamiento Cinegético.","Corzo, conejo y liebre.","Solo conejo, liebre y paloma."],0],[1,121,"Si no poseo licencia de caza o esta ha caducado no podré practicar el deporte de la caza:",["En aquellos terrenos sometidos a régimen cinegético especial.","En aquellos terrenos sometidos a régimen cinegético especial, pero sí en aquellos denominados ‘libres’.","En ningún caso."],2],[1,122,"La caza en la Reserva Regional de Caza de Sonsaz:",["Está prohibida como en todas las Reservas.","Está prohibida para aquellos vecinos cazadores empadronados en alguno de los pueblos cuyos términos municipales o parte de ellos están incluidos dentro de la reserva.","Las dos respuestas anteriores son falsas."],2],[1,123,"Si estoy interesado en cazar jabalíes en la Reserva de Caza de Sonsaz, puedo hacerlo aunque no resida en los pueblos cuyos terrenos forman parte de la Reserva:",["Por sorteo, presentando en el registro de la Consejería competente en materia de Medio Ambiente la solicitud correspondiente.","Pagando la correspondiente cuota federativa y solicitando en esta la intención de participar en alguna de sus monterías o batidas.","En dicha Reserva, el aprovechamiento cinegético del jabalí, entre otros, está reservado exclusivamente para las Sociedades de Cazadores locales."],0],[1,124,"Los pasos tradicionales de palomas migratorias de la Comunidad de Madrid están situados en la divisoria de aguas de las zonas montañosas más elevadas, la mayor parte en:",["La Sierra de Guadarrama y Reserva de Caza de Sonsaz.","La Sierra de Guadarrama exclusivamente.","La Reserva de Sonsaz y la Sierra del Alto Rey."],0],[1,125,"Los Refugios de Caza se definen como aquellas áreas donde:",["La caza está permitida de manera temporal, estableciéndose cuarteles de aprovechamiento cinegético rotativo durante un corto periodo de tiempo.","La caza en general está prohibida, sólo permitiéndose por daños agrícolas o forestales o cuando los accidentes de tráfico producidos por especies cinegéticas hayan aumentado en el último año en más de un 30%.","La caza está prohibida, sólo se permite la caza por razones biológicas, científicas o educativas para asegurar la conservación de especies cinegéticas."],2],[1,126,"Con carácter general, en la Comunidad de Madrid está prohibida la práctica de cualquier actividad cinegética en:",["Terrenos acotados que no hayan enviado antes del 31 de marzo a la Consejería competente en materia de medio ambiente el correspondiente informe de resultados.","Todos los terrenos de aprovechamiento cinegético común, más conocidos como terrenos libres.","Terrenos forestales propiedad del Estado."],1],[1,127,"La caza en las vías pecuarias:",["Está prohibida salvo que se cuente con la autorización expresa.","Está totalmente prohibida, sin excepciones.","Siempre se realizará sin el empleo de armas de fuego."],0],[1,128,"Según el Reglamento para la ejecución de la Ley de Caza de 4 de abril de 1970, son terrenos sometidos a régimen cinegético especial:",["Los Parques Nacionales, los Refugios de Caza, las Reservas Regionales de Caza, las Zonas de Seguridad, los Cotos de Caza, los adscritos al régimen de Caza Controlada y los Cercados.","Los Parques Nacionales, los Refugios de Caza, las Reservas Regionales de Caza, las Zonas de Seguridad, los Cotos de Caza, los adscritos al régimen de Caza Controlada y los Cercados, en los cuales se haga patente, con toda claridad, la prohibición de entrar en ellos mediante carteles o señales en sus accesos practicables.","Los Parques Nacionales, los Refugios de Caza, las Reservas Regionales de Caza, las Zonas de Seguridad, los Cotos de Caza privados y libres, los adscritos al régimen de Caza Controlada y los Cercados."],1],[1,129,"Las zonas de caza controlada en la Comunidad de Madrid son:",["Terrenos de aprovechamiento común que por razones de protección, fomento, conservación y ordenado aprovechamiento de la riqueza cinegética, el control y regulación de la caza, está encomendada a la Administración competente o a una sociedad de cazadores colaboradora.","Reservas de caza donde se toma especial atención a la vigilancia de los terrenos y las especies cinegéticas que habitan en él.","Aquellos cotos de caza que cuentan con guardería privada."],0],[1,130,"En terrenos acotados, para poder desempeñar la actividad cinegética, este debe de disponer de:",["Plan de mejoras.","Plan de Aprovechamiento Cinegético.","Plan de Explotación de los Recursos Naturales."],1],[1,131,"La Reserva de Caza de Sonsaz de Madrid abarca terrenos de los términos municipales de:",["Montejo de la Sierra, La Hiruela, Puebla de la Sierra y El Atazar.","San Martín de Valdeiglesias, Cadalso de los Vidrios y Cenicientos.","Getafe, Leganés y Fuenlabrada."],0],[1,132,"Son zonas de seguridad aquellas en las cuales deben adoptarse medidas precautorias especiales encaminadas a garantizar la adecuada protección de las personas y de sus bienes. Se considerarán zonas de seguridad, entre otras:",["Las vías pecuarias, las vías férreas y los canales navegables.","Las vías y caminos de uso público exclusivamente.","Los caminos, carreteras y trochas."],0],[1,133,"Hacia las zonas de seguridad:",["No se puede disparar.","Sí se puede disparar porque en ellas se está seguro.","Se puede disparar solo cuando el cazador se encuentre separado de ellas por una distancia mayor de la que pueda alcanzar el proyectil."],2],[1,134,"En carreteras nacionales, comarcales y locales se prohíbe el uso de armas de fuego o accionadas por aire u otros gases, dentro de la Zona de Seguridad y en una franja menor de:",["50 metros de anchura que flanquee por derecha e izquierda a los terrenos incluidos en ella.","75 metros de anchura que flanquee por derecha e izquierda a los terrenos incluidos en ella.","100 metros de anchura que flanquee por derecha e izquierda a los terrenos incluidos en ella."],0],[1,135,"En caminos de uso público, vías férreas y canales navegables se prohíbe el uso de armas de caza dentro de la Zona de Seguridad y en una franja de:",["20 metros de anchura que flanquee por derecha e izquierda a los terrenos incluidos en ella.","25 metros de anchura que flanquee por derecha e izquierda a los terrenos incluidos en ella.","30 metros de anchura que flanquee por derecha e izquierda a los terrenos incluidos en ella."],1],[1,136,"En núcleos urbanos y rurales y las zonas habitadas y sus proximidades los límites de la Zona de Seguridad serán los que alcancen las últimas edificaciones o instalaciones habitables, ampliados en una franja de:",["100 metros en todas las direcciones, siempre y cuando disparemos en sentido contrario a dichas edificaciones no pudiendo alcanzarlas bajo ningún concepto con nuestra munición.","150 metros en todas las direcciones, siempre y cuando disparemos en sentido contrario a dichas edificaciones no pudiendo alcanzarlas bajo ningún concepto con nuestra munición.","250 metros en todas las direcciones siempre y cuando disparemos en sentido contrario a dichas edificaciones no pudiendo alcanzarlas bajo ningún concepto con nuestra munición."],0],[1,137,"Salvo autorización, el uso de armas está prohibido a menos:",["De 200 metros a partir del límite de núcleo urbano.","De 100 metros de las carreteras nacionales.","De 25 metros de los caminos de uso público."],2],[1,138,"Salvo autorización, el uso de armas está prohibido a menos de:",["200 metros a partir del límite de núcleo urbano.","50 metros de las carreteras nacionales.","50 metros de los caminos de uso público."],1],[1,139,"En los cotos privados de caza que cuenten con una superficie igual o superior a 250 hectáreas y no tengan contemplada la caza a través de sueltas en la Resolución por la que se aprueba el Plan de Aprovechamiento Cinegético, podrá realizarse de forma excepcional y previa autorización de la Consejería competente en materia de Medio Ambiente, una cacería de suelta por cada 250 hectáreas, con:",["8 cazadores.","14 cazadores.","16 cazadores."],1],[1,140,"En los cotos comerciales de caza podrán llevar a cabo las cacerías con animales procedentes de suelta un máximo de:",["8 cazadores.","14 cazadores.","16 cazadores."],2],[1,141,"Quiero organizar cacerías de suelta en mi coto de caza de 2.000 hectáreas y no viene contemplada esta actividad en la Resolución por la que se aprueba el Plan de Aprovechamiento Cinegético. Me podrán autorizar como máximo:",["2 cacerías con la suelta de 1.200 ejemplares como máximo.","4 cacerías con la suelta de 1.200 ejemplares como máximo.","6 cacerías con la suelta de 600 ejemplares como máximo."],1],[1,142,"Si voy a organizar una suelta autorizada de codorniz en mi coto con el fin de cazarlas con perro de muestra podré hacerlo con:",["Codorniz común (Coturnix coturnix) o codorniz japonesa (Coturnix japonica).","Exclusivamente con codorniz común (Coturnix coturnix).","Con cualquier codorniz siempre que me den la guía de traslado correspondiente en la granja que las compre."],1],[1,143,"En los cotos en los que se recoja la modalidad de caza mediante suelta en la Resolución por la que se aprueba su Plan de Aprovechamiento Cinegético solo será necesario comunicar a la Consejería competente en materia de Medio Ambiente la realización de esta actividad, que se llevará a cabo de acuerdo con lo establecido en dicho Plan:",["Con al menos 15 días hábiles de antelación.","Con al menos un mes de antelación.","Con al menos 10 días hábiles de antelación."],2],[1,144,"El período en que se podrán realizar las cacerías con animales procedentes de suelta en cotos comerciales de caza será el comprendido entre:",["El día 15 de septiembre y el día 15 de marzo del siguiente año, ambos incluidos.","El día 15 de septiembre y el día 15 de abril del siguiente año, ambos incluidos.","El día 15 de octubre y el día 15 de marzo del siguiente año, ambos incluidos."],0],[1,145,"¿Cualquier batida, montería o gancho que quiera realizarse debe comunicarse a la Consejería competente en materia de medio ambiente?",["No, no es obligatorio.","Sí, con al menos 10 días hábiles de antelación.","Si, con al menos 10 días hábiles de antelación y quedando a la espera de la autorización por parte de la Administración."],1],[1,146,"La separación a la que deben quedar situadas las tablillas será de:",["600 m para las de primer orden, y las de segundo orden se colocaran entre las de primero con una separación que no puede ser superior a 100 metros.","500 m para las de primer orden, y las de segundo orden se colocaran entre las de primero con una separación que no puede ser superior a 100 metros.","600 m para las de primer orden, y las de segundo orden se colocaran entre las de primero con una separación que no puede ser superior a 150 metros."],0],[1,147,"Cazando por los límites del acotado nos encontramos una señal rectangular de dimensión aproximada 33 x 50 centímetros, donde se puede leer una inscripción en letras negras sobre fondo blanco que dice “coto privado de caza” y que además presenta una chapa de metal identificadora de la matrícula del coto. Se trata de una señal:",["De primer orden.","De segundo orden.","De tercer orden."],0],[1,148,"Las señales cuyo diseño es una diagonal con la parte superior derecha en blanco y la parte inferior izquierda en negro, y con unas medidas aproximadas de 20 x 30 centímetros, son señales:",["De primer orden.","De segundo orden.","De tercer orden."],1],[1,149,"Tanto las señales de primer orden como los distintivos normalizados de segundo orden, deben estar situados a una altura entre:",["1 y 2,50 metros desde el suelo.","1,5 y 3 metros desde el suelo.","1,5 y 2,50 metros desde el suelo."],2],[1,150,"En los Cotos Comerciales de Caza Menor deberá colocarse un cartel con la leyenda \"Coto Comercial de Caza\", fabricados estos en materiales que garanticen una adecuada durabilidad. Sus dimensiones serán de 33 por 50 centímetros, con un margen de tolerancia del 10 por 100 y serán colocados junto a cada señal:",["De primer orden.","De segundo orden.","De tercer orden."],0],[1,151,"Previamente al desarrollo de cualquier montería, gancho, batida, ojeo o tirada colectiva en zonas atravesadas por vías, caminos de uso público y/o vías pecuarias, deben colocarse señales para avisar de la celebración de la cacería. ¿De quién es esta obligación?",["De los titulares cinegéticos u organizadores de la cacería.","Del propietario o propietarios del terreno sobre el que se desarrollará la cacería.","No es obligatorio avisar."],0],[1,152,"Si cerramos un determinado área de nuestro coto con puestos fijos y utilizamos perros para mover y desalojar las piezas de caza mayor del interior, estamos cazando en la modalidad de:",["Montería.","Rececho.","En mano."],0],[1,153,"Si me dispongo a cazar perdices junto a dos amigos ayudados por seis perros de muestra y/o cobro, batiendo una cantidad limitada de terreno formando una línea y avanzando de manera perpendicular a ella estoy practicando la modalidad de caza:",["Al paso.","En mano.","En montería."],1],[1,154,"El aprovechamiento cinegético del corzo y la cabra montés en la Comunidad de Madrid solo se podrá en la modalidad de:",["Batida.","Espera.","Rececho."],2],[1,155,"En la modalidad de rececho, exceptuando la caza del jabalí, el cazador deberá portar en todo momento:",["El arma descargada.","El correspondiente precinto.","La documentación relativa las armas de su propiedad."],1],[1,156,"Me encuentro en un coto de caza mayor al amanecer para practicar la caza del ciervo. Me aproximo lo suficiente para cazar ese macho que he localizado hace días. Es posible que me lleve varias horas. Estoy cazando en la modalidad de:",["Rececho.","Montería.","En mano."],0],[1,157,"Si nos autorizan, por daños de jabalí a unas siembras de cereal, una cacería en puesto fijo. Esta modalidad se denomina:",["Rececho.","Montería o batida.","Aguardo o espera."],2],[1,158,"La modalidad de caza de jabalíes al anochecer en que el cazador permanece apostado en un lugar determinado y querencioso esperando al animal se denomina:",["Batida.","Al paso.","Espera."],2],[1,159,"Cuando un cazador busca piezas de caza menor en solitario con la ayuda de un perro, se dice que está cazando en la modalidad de:",["Al salto.","En mano.","En rececho."],0],[1,160,"Si cuatro cazadores avanzan con sus perros cazando en línea abarcando mayor terreno y reduciendo las posibilidades de huída de la piezas, se dice que están cazando en la modalidad de:",["Al salto.","En mano.","En rececho."],1],[1,161,"Un cazador apostado esperando en una zona querenciosa para la caza de la paloma torcaz en media veda se dice que está cazando en la modalidad de:",["Puesto fijo.","En mano.","Al salto."],0],[1,162,"Cuando es el cazador quien busca y levanta la pieza y no interviene más en el lance, sino que es el perro el que la captura, estamos hablando de la modalidad de:",["Caza en espera.","Caza de liebre con perros de rastro.","Caza de liebre con galgo."],2],[1,163,"La caza con arco se caracteriza por:",["Ser una modalidad con la que se capturan las piezas de caza mayor de manera sencilla.","Ser una modalidad en la que debemos acercarnos mucho más a las piezas si queremos realizar un disparo acertado.","Es una modalidad de caza prohibida en la Comunidad de Madrid."],1],[1,164,"Para poder cazar con arco en la Comunidad de Madrid es necesario:",["Contar con licencia y seguro de caza.","Contar con la correspondiente tarjeta federativa.","Ambas respuestas son correctas."],2],[1,165,"La caza con aves de cetrería es una modalidad de caza:",["Que sólo es autorizada por daños.","Es una modalidad de caza regulada.","Es una modalidad de caza prohibida."],1],[1,166,"En la caza con aves de cetrería suelen emplearse:",["Armas semiautomáticas.","Escopetas de un solo cañón.","No se emplean armas."],2],[1,167,"Las modalidades de caza se agrupan en:",["Caza menor y mayor.","Caza menor, mayor y caza por daños.","Caza individual, colectiva, mayor y menor."],0],[1,168,"La caza menor a rabo:",["Es aquella en la que se utilizan animales.","Se le denomina a la caza de zorros con perros de madriguera.","Es la que se practica con perro."],2],[1,169,"En la modalidad de ojeo:",["Los cazadores que portan las armas se encuentran batiendo el terreno formando una mano.","Los cazadores que portan las armas se encuentran situados en puestos fijos.","Pueden portar armas tanto cazadores situados en puestos fijos como batidores, siempre y cuando disparen en sentido contrario cuando se encuentren a una distancia de menos de 200 metros."],1],[1,170,"El ojeo de perdiz:",["Es aquella modalidad de caza en que los batidores u ojeadores empujan las perdices hacia puestos fijos donde son abatidas con escopeta.","Es una modalidad de caza mayor.","Es aquella modalidad de caza en que los batidores u ojeadores empujan las perdices hacia puestos fijos donde son abatidas con escopeta o rifle."],0],[1,171,"Si los titulares de un coto de caza prevén la celebración de ojeos de perdiz deben saber que:",["Solo se les podrá conceder un máximo de 2 días de ojeo por cada 250 hectáreas.","Solo se podrán realizar entre el 1 y el 15 del mes de octubre.","No se les podrá conceder más de 1 día de ojeo por cada 250 hectáreas."],2],[1,172,"La caza con hurón a toro suelto:",["Es una modalidad exclusiva de caza de conejos.","Es una modalidad de caza de conejos y zorros.","Es una modalidad exclusiva de caza de zorros."],0],[1,173,"Si tengo intención de practicar la modalidad de caza de conejos con hurón y escopeta en de zorzales y palomas. Están practicando la caza:",["En mano.","Al salto.","Al paso."],2],[1,180,"La caza en mano es similar a la caza al salto pero:",["Con varios cazadores que se desplazan en línea.","Utilizando armas de fuego.","Con diferentes objetivos en cuanto a especies se refiere."],0],[1,181,"El habitáculo construido con ramas u otros materiales donde el cazador se oculta para esperar a la pieza se denomina:",["Cimbel.","Trocha.","Puesto."],2],[1,182,"Desde un puesto fijo, podemos abatir en la Comunidad de Madrid:",["Patos.","Chorlitos.","Las dos anteriores son falsas."],2],[1,183,"¿Sobre qué especies suele realizarse la modalidad denominada ojeo?",["Perdiz.","Paloma.","Tórtola."],0],[1,184,"Durante la caza de liebre con galgo, los cazadores:",["Pueden llevar armas.","No pueden llevar armas.","Pueden llevar armas siempre y cuando pretendan correr a cada liebre solo un galgo."],1],[1,185,"La mancha de monte a cazar durante una montería se bate con grupos de perros denominados:",["Manchas.","Traviesas.","Rehalas."],2],[1,186,"¿Cuál de las siguientes especies puede ser cazada en la Comunidad de Madrid en aguardo o espera?",["El corzo.","La cabra montés.","El jabalí."],2],[1,187,"Durante los recechos:",["Suelen utilizarse entre 5 y 8 perros.","Se suele cazar en solitario.","Los cazadores esperan a que los batidores espanten las piezas."],1],[1,188,"El aguardo nocturno se puede practicar, previa autorización administrativa, para abatir:",["Ciervos.","Muflones.","Jabalíes."],2],[1,189,"De entre las siguientes, la modalidad de caza permitida para abatir machos monteses es:",["La ronda nocturna.","El vaqueo.","El rececho."],2],[1,190,"La caza con arco se practica para especies:",["De caza tanto menor como mayor.","Exclusivamente de caza mayor.","Las dos anteriores son falsas."],0],[1,191,"Se podrá ejercer la caza con arco:",["Solamente en espera o aguardo de jabalí.","Solamente desde un puesto fijo.","Ambas respuestas son falsas."],2],[1,192,"Según la legislación actual, las esperas nocturnas de jabalí en la Comunidad de Madrid son una modalidad de caza:",["Prohibida.","Permitida con autorización administrativa.","Permitida siempre y cuando se realice con arma larga rayada."],1],[1,193,"En la caza de la liebre con galgo queda prohibido:",["El empleo de armas de fuego.","El empleo de más de dos galgos por carrera y liebre.","El empleo de la modalidad de caza en mano."],0],[1,194,"En las modalidades de caza colectiva (montería, gancho y batida) los precintos serán colocados en las piezas:",["Nada más ser abatidas.","En la junta de carnes y antes de abandonar el acotado.","No es necesario colocar precintos para este tipo de caza colectiva."],1],[1,195,"La modalidad de caza al paso es típica para cazar:",["Zorros y conejos.","Palomas y zorzales.","Jabalíes."],1],[1,196,"En los ganchos de conejos, los batidores:",["Suelen tocar la caracola para reunir a los perros.","Suelen disparar con cartuchos que cierran mucho el tiro, dada la densa vegetación de las zonas donde suele practicarse este tipo de caza.","Pueden portar escopetas."],2],[1,197,"La caza de la codorniz es normalmente practicada:",["En media veda y al salto o en mano.","En media veda y en mano o a la espera.","En media veda y al salto o en batida."],0],[1,198,"El control de urraca, grajilla, corneja y zorro puede autorizarse en la Comunidad de Madrid de manera extraordinaria:",["Entre el 1 y el 28 de febrero, ambos incluidos, pudiendo prolongarse de manera extraordinaria hasta el 31 de marzo.","Hasta el último día hábil de la temporada general de caza.","No existe limitación."],0],[1,199,"El ciervo suele cazarse en las modalidades de:",["Rececho y en mano.","Rececho y batida o montería.","Batida o montería y al salto."],1],[1,200,"Con carácter general, los ganchos podrán realizarse:",["En una superficie mínima de 250 hectáreas con 1 puesto máximo por cada 10 hectáreas.","En una superficie mínima de 200 hectáreas con 1 puesto máximo por cada 10 hectáreas.","En una superficie mínima de 250 hectáreas con 1 puesto máximo por cada hectárea."],0],[1,201,"Si deseo capturar conejos en vivo para su vacunación e introducción en el mismo o en otros cotos debo:",["Comunicarlo a la Consejería competente en materia de Medio Ambiente con, al menos, un mes de antelación, indicando los parajes del acotado donde se realizará la captura y el destino de los animales que se capturen.","Comunicarlo a la Consejería competente en materia de Medio Ambiente con, al menos, un mes de antelación, indicando las personas que participarán durante la captura y el destino de los animales que se capturen.","Solicitando autorización a la Consejería competente en materia de Medio Ambiente con, al menos, diez días hábiles de antelación, indicando los parajes del acotado donde se realizará la captura y el destino de los animales que se capturen."],2],[1,202,"Si deseo llevar a cabo capturas de animales en vivo en mi coto de podré utilizar para ello:",["Postas.","Armas provistas de silenciador o de visor para el tiro nocturno.","Capturaderos."],2],[1,203,"Si deseo capturar conejos en vivo con hurón para su vacunación e introducción en el mismo o en otros cotos:",["Será preceptiva la autorización previa y expresa de la Consejería competente en materia de Medio Ambiente.","Debo contar con al menos diez capillos y dos jaulas de transporte para asegurar el correcto desarrollo de la actividad.","Las dos anteriores son falsas."],0],[1,204,"Cuando la captura de conejos en vivo con hurón se realice fuera del periodo hábil de caza menor:",["Se llevará a cabo los días no festivos, de lunes a viernes, entre el 1 de febrero y el 31 de abril.","Se llevará a cabo los días no festivos, de lunes a jueves, entre el 1 de febrero y el 31 de marzo.","Se llevará a cabo los días no festivos, de lunes a viernes, entre el 1 de febrero y el 31 de marzo."],2],[1,205,"Una vez finalizado el periodo de captura de conejos con hurón en un determinado coto de caza, deberé enviar a la Consejería de Medio Ambiente:",["Algunos de los ejemplares cazados para su análisis veterinario.","El informe de resultados indicando los animales enfermos que hemos cazado.","No debo enviar nada una vez acabe el permiso, es antes, para solicitarlo."],1],[1,206,"Si obtengo un permiso de captura de conejos en vivo con hurón y al finalizar este no remito a la Consejería competente en materia Medio Ambiente un parte de resultados con el número de piezas cobradas y el estado sanitario de ellas:",["La Consejería competente en materia de Medio Ambiente no otorgará autorización alguna para realizar esta práctica cinegética, sin perjuicio de las sanciones que pudieran proceder por las infracciones cometidas.","La Consejería competente en materia de Medio Ambiente no otorgará autorización alguna para realizar esta práctica cinegética, pero no podrá sancionarnos por las infracciones cometidas.","La Consejería competente en materia de Medio Ambiente no otorgará autorización alguna para realizar esta práctica cinegética y sancionará con el cierre temporal del coto de caza en cuestión hasta que emitamos el correspondiente informe."],0],[1,207,"Las especies que podrán ser autorizadas para su captura en vivo en cuanto a silvestrismo y sólo en ejemplares machos, son las siguientes:",["Verderón común (Carduelis chloris), jilguero (Carduelis carduelis) y pardillo (Acanthis cannabina).","Verderón común (Carduelis chloris), jilguero (Carduelis carduelis) y lúgano (Spinus spinus).","Lúgano (Spinus spinus), jilguero (Carduelis carduelis) y pardillo (Acanthis cannabina)."],0],[1,208,"El cupo máximo por cazador y día en cuanto a la práctica del silvestrismo en la Comunidad de Madrid se establece en:",["Un máximo de nueve aves por cazador y día, no pudiendo superarse en ningún caso los seis ejemplares de una misma especie, debiendo liberarse, en el mismo acto de la captura, todas las aves de especie distinta a las autorizadas.","Nueve aves por cazador y día quedando totalmente prohibida la captura de hembras de cualquier especie, que deberán liberarse inmediatamente.","Las dos respuestas anteriores son correctas."],2],[1,209,"Un amigo nos comenta de la necesidad de realizar un examen para obtener la licencia de armas de rifle y/o escopeta:",["Falso, para rifles si, para escopetas no.","Verdadero, es necesario.","Es verdadero porque la licencia de caza es lo mismo que la licencia de armas."],1],[1,210,"Un arma de fuego larga rayada es:",["Una escopeta.","Un rifle.","Un revólver."],1],[1,211,"¿Podemos cazar con escopeta durante una batida o montería?",["No porque está prohibido el uso de perdigón de plomo para la caza mayor.","No porque está prohibido cazar especies de caza mayor con escopeta.","Si, ya que existen cartuchos de bala para escopeta."],2],[1,212,"Para abatir piezas de caza menor utilizaremos:",["Un rifle porque llega más lejos.","Un rifle cargado con cartuchos de perdigón.","Un escopeta cargada con cartuchos de perdigón."],2],[1,213,"Me dispongo a practicar la caza del corzo en rececho, ¿qué arma de las siguientes podría utilizar?",["Una escopeta de calibre 12.","Un arco.","Un rifle automático."],1],[1,214,"¿Cuál de las siguientes armas de caza tiene dos cañones colocados uno sobre el otro?:",["La escopeta yuxtapuesta.","La escopeta superpuesta.","La escopeta semiautomática."],1],[1,215,"¿Cuál de las siguientes armas de caza tiene un único cañón?:",["La escopeta yuxtapuesta.","La escopeta superpuesta.","La escopeta semiautomática."],2],[1,216,"¿Cuál de las siguientes armas es conocida como repetidora?",["La escopeta yuxtapuesta.","La escopeta superpuesta.","La escopeta semiautomática."],2],[1,217,"¿Cuál es el número máximo de cartuchos que legalmente puede contener una escopeta semiautomática?",["2.","3.","5."],1],[1,218,"¿Cuál de las siguientes armas no están permitida para la caza?:",["El rifle semiautomático.","El rifle automático.","El rifle de palanca."],1],[1,219,"¿Qué numero de perdigón utilizado para la caza menor es más grueso?",["0.","6.","9."],0], "Armas prohibidas.","Armas reglamentadas.","Armas excepcionalmente permitidas."],0],[1,242,"Los labradores son popularmente conocidos como perros:",["Cobradores.","De muestra.","De rastro."],0],[1,243,"Los perros de muestra son aquellos:",["Que siguen a la pieza por el rastro que dejar al pasar durante horas.","Son adecuados para cazar liebre a la carrera.","Son los que cuando detectan la presencia de una pieza se inmovilizan para indicar su situación al cazador."],2],[1,244,"Se considera rehala:",["Una agrupación de más de 10 perros que participan en una determinada modalidad de caza.","Un agrupación de entre 16 y 40 perros que van conducidos por un rehalero.","El conjunto de perros que participan en una montería, independientemente del número."],1],[1,245,"A la hora de organizar una montería, debe tenerse en cuenta que, con carácter general:",["Se autorizará un máximo de 1 rehala por cada 40 hectáreas de terreno a batir.","Se autorizará un máximo de 1 rehala por cada 50 hectáreas de terreno a batir.","No existe limitación al respecto."],0],[1,246,"El galgo es una raza que se utiliza para:",["La caza de conejos a muestra.","La caza de liebre en espera.","La caza de liebres en mano."],2],[1,247,"Los perros de rastro son aquellos que:",["Siguen a la pieza por el olor que esta desprende normalmente utilizados para la caza en batida o el cobro de piezas de caza mayor tras el disparo, también denominado pisteo.","Son adecuados para cazar liebre a la carrera.","Son los que cuando detectan la presencia de una pieza se inmovilizan para indicar su situación al cazador."],0],[1,248,"Los podencos suelen ser perros muy apreciados para la caza de:",["Becadas.","Conejos.","Acuáticas."],1],[1,249,"Cazar especies amenazadas contraviniendo las leyes o disposiciones de carácter general protectoras de fauna silvestre es:",["Una infracción administrativa.","Una conducta autorizable.","Un delito."],2],[1,250,"El que sin estar legalmente autorizado emplee para cazar veneno, medios explosivos u otros instrumentos o artes de similar eficacia destructiva o no selectiva para la fauna comete:",["Una infracción administrativa.","Un delito.","Un acto no sancionable."],1],[1,251,"¿Cuál de las siguientes conductas es un delito?",["Cazar sin portar la licencia de caza.","Arrancar alguna especie o subespecie de flora amenazada causando un grave perjuicio para el medio ambiente.","Cazar en un camino público."],1],[1,252,"¿Cuál de las siguientes conductas es un delito?",["Cazar sin la licencia o el seguro de responsabilidad civil.","Cazar una especie protegida.","Las dos anteriores son delito."],1],[1,253,"Liberar especies de flora no autóctona contraviniendo las leyes y perjudicando el equilibrio biológico es:",["Un delito.","Una infracción administrativa.","Una conducta autorizable."],0],[1,254,"Cazar en línea de retranca:",["Está totalmente prohibido.","Está permitido en la caza mayor.","Está permitido en la caza menor."],0],[1,255,"¿Cuál de las siguientes conductas es un delito?",["Liberar especies de flora no autóctona.","Cazar una especie protegida.","Las dos anteriores son delito."],2],[1,256,"Maltratar con ensañamiento e injustificadamente a animales domésticos causándoles la muerte o provocándoles lesiones es:",["Un delito tipificado en el Código Penal.","Una infracción administrativa sin relevancia penal.","Una conducta no sancionable."],0],[1,257,"Aquellas prácticas dirigidas a sobresaltar o alarmar a la caza existente en terrenos ajenos con vistas a predisponerla a la huida o alterar sus querencias naturales, se conoce con el término de:",["Espantar.","Ojear.","Chantear."],2],[1,258,"Según el Reglamento para la ejecución de la Ley de Caza de 4 de abril de 1970, cualquier práctica que tienda a chantear tiene la consideración de:",["Infracción grave.","Infracción menos grave.","Infracción leve."],1],[1,259,"El uso para cazar de armas automáticas y de semiautomáticas cuyo cargador admita más de dos cartuchos es:",["Un delito.","Una conducta prohibida
