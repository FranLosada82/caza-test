","Verdadero, siendo obligatorio deshacernos de las piezas en el mismo lugar donde han sido abatidas."],1],[1,302,"La Comisión de Homologación de Trofeos de Caza Mayor de la Comunidad de Madrid está compuesta por:",["Cazadores, personal federativo y expertos en la materia.","Expertos en la materia.","Personal de la Federación Madrileña de Caza."],1],[1,303,"Son funciones de la Comisión de Homologación de Trofeos de Caza Mayor de la Comunidad de Madrid:",["La homologación de los cotos con mejores trofeos.","Homologar trofeos, realizar mediciones y expedir certificados.","La homologación, medición y taxidermia de los mejores trofeos cazados en la Comunidad de Madrid."],1],[1,304,"En la Comunidad de Madrid pueden homologarse:",["Los trofeos de caza mayor cazados en España.","Los trofeos de caza mayor y menor.","Solo los trofeos de caza mayor de especies autóctonas."],0],[1,305,"No se consideran trofeos homologables:",["Los desmogues y cuernas encontrados en el campo.","Los colmillos de jabalíes.","Los de los gamos, al ser una especie alóctona."],0],[1,306,"No serán objeto de homologación:",["Los trofeos anormales, aquellos en los que se haya modificado artificialmente alguna parte objeto de medición o los que cuya procedencia, en caso de ser solicitada, no pueda acreditarse.","Los trofeos anormales y aquellos en los que se haya modificado artificialmente alguna parte objeto de medición.","Los trofeos anormales, aquellos en los que se haya modificado artificialmente alguna parte objeto de medición o los que cuya procedencia sea otra comunidad autónoma diferente a la madrileña."],0],[1,307,"A la hora de homologar un trofeo de jabalí por parte de la Comisión de Homologación de Trofeos de Caza Mayor de la Comunidad de Madrid se tendrá en cuenta:",["La longitud y grosor de los colmillos y el grosor de las amoladeras.","La longitud y grosor de las amoladeras y el grosor de los colmillos.","La longitud y grosor de colmillos y amoladeras."],0],[1,308,"A la hora de homologar un trofeo de ciervo por parte de la Comisión de Homologación de Trofeos de Caza Mayor de la Comunidad de Madrid se tendrá en cuenta:",["La longitud y perímetro de diferentes partes de la cuerna entre otros.","La longitud y perímetro de diferentes parte de la cuerna, el volumen de esta y el peso del animal.","La longitud y perímetro de diferentes parte de la cuerna, el volumen de esta y el peso del trofeo."],0],[2,309,"¿Cuál de las siguientes afirmaciones es correcta?",["Algunas especies catalogadas como amenazadas pueden cazarse.","El número de especies no cinegéticas es mucho mayor al de especies cinegéticas.","Tan solo unas pocas especies son protegidas. El resto pueden cazarse."],1],[2,310,"¿Cuál de las siguientes afirmaciones es correcta?",["Algunas especies cinegéticas están protegidas.","Algunas especies protegidas están catalogadas como vulnerables.","Las dos respuestas anteriores son correctas."],1],[2,311,"¿En qué categoría se incluyen las especies que corren más peligro en desaparecer?",["Especie vulnerable.","Especie cinegética.","Especie en peligro de extinción."],2],[2,312,"Una especie vulnerable es aquella que:",["Puede cazarse.","Corre el peligro de pasar a una categoría de mayor protección.","Aquella que no posee riesgo de conservación."],1],[2,313,"Una de las siguientes aves está catalogada en peligro de extinción según el Catálogo Regional de Especies Amenazadas de la Comunidad de Madrid, ¿cuál?:",["Cigüeña negra.","Cigüeñuela.","Chotacabras pardo."],0],[2,314,"Estos dos mamíferos están en peligro de extinción según el Catálogo Regional de Especies Amenazadas de la Comunidad de Madrid:",["El tejón y la garduña.","La marta y la garduña.","La nutria y el lince ibérico."],2],[2,315,"El águila imperial ibérica es:",["Una rapaz nocturna.","Una rapaz que se distribuye por gran parte de Europa.","Una especie endémica de la península ibérica."],2],[2,316,"El lince ibérico es:",["El felino más amenazado del planeta.","El felino más amenazado de Europa.","Una especie común en la Sierra de Guadarrama."],0],[2,317,"¿En qué lugar sería más común encontrar un lince?",["En una estepa.","En zonas de siembras de cereal alternadas con algunas encinas.","En canchales y berrocales."],2],[2,318,"El buitre negro:",["Es la rapaz más amenazada del mundo.","Es un pequeño buitre claro por su parte superior y oscuro casi negro por la inferior, aquella que puede observarse mientras vuela.","Se alimenta básicamente de carroña."],2],[2,319,"Cuando la supervivencia de una especie es poco probable debido a diferentes causas que siguen haciendo que peligre dicha supervivencia, recibe la categoría de:",["En peligro de extinción.","Vulnerable.","De interés especial."],0],[2,320,"Entre los grupos de aves beneficiosas para controlar insectos en el arbolado destacan:",["Los pájaros carpinteros y los páridos, como el herrerillo y el carbonero.","Las limícolas.","Las rapaces nocturnas."],0],[2,321,"Parte importante de la alimentación de las rapaces nocturnas consiste en:",["Pequeñas aves.","Insectos.","Roedores."],2],[2,322,"¿Cuál de las siguientes aves es especialmente eficaz para controlar la densidad de córvidos de una determinada zona?:",["El ratonero.","El mochuelo.","El búho real."],2],[2,323,"El lobo en la Comunidad de Madrid es una especie:",["Cinegética.","Protegida.","No hay lobo en la Comunidad de Madrid."],1],[2,324,"El lobo es una especie:",["Considerada cinegética en regiones al norte del Duero aunque en la Comunidad de Madrid está protegida.","No cinegética en España.","Las dos respuestas anteriores son falsas."],0],[2,325,"El gato montés es:",["Una especie cinegética.","Una especie no cinegética.","Un gato doméstico asilvestrado."],1],[2,326,"El lince ibérico es:",["Una especie catalogada como protegida.","Una especie cinegética en el caso de producir daños.","Un gato asilvestrado."],0],[2,327,"El lince ibérico está actualmente catalogado como:",["Especie cinegética.","Especie vulnerable.","Especie en peligro de extinción."],2],[2,328,"La detección en campo es esencial para saber si nos encontramos ante un gato montés o un ejemplar asilvestrado. El primero presenta, como características morfológicas principales:",["Orejas en general mayores con respecto al tamaño total de la cabeza, hocico ligeramente más largo, patas largas y estilizadas.","Bigotes cortos y delgados, trufa de tono oscuro.","Orejas pequeñas con respecto al tamaño total de la cabeza, línea dorsal oscura desde el final de la nuca hasta el principio de la cola, siendo esta gruesa y roma y acabada en una maza oscura."],2],[2,329,"Cuando hablamos de ecosistema nos referimos a:",["El sistema biológico formado por una comunidad de seres vivos y el medio natural en el que viven.","La comunidad de seres vivos de un determinado lugar y su relieve.","La comunidad de seres vivos de un determinado lugar y su clima."],0],[2,330,"¿Cuál de los siguientes ecosistemas está presente en la Comunidad de Madrid?:",["Melojar.","Abetar.","Las dos anteriores son falsas."],0],[2,331,"Barbechos y secanos, son aquellos ecosistemas en que:",["No está permitido cazar.","El hombre tiene un gran protagonismo.","El arbolado es muy frecuente."],1],[2,332,"Zonas palustres, sotos y riberas, son ecosistemas:",["Ligados al agua.","En los cuales tan solo está permitido cazar aves acuáticas.","Que no se encuentran en la Comunidad de Madrid."],0],[2,333,"¿Cuál de los siguientes es un ecosistema forestal?:",["Lindes y ribazos.","Cuestas y cortados yesíferos.","Matorral de altura."],2],[2,334,"Los ecosistemas naturales de la Comunidad de Madrid cumplen múltiples funciones, algunas de las cuales contribuyen de un modo especial a la calidad de vida de los ciudadanos, como por ejemplo:",["Moderar los rigores climáticos, mejorar la calidad del aire, impedir los procesos erosivos, ayudar a regular el ciclo del agua y proporcionar productos de indudable valor económico (madera, leña, pastos, etc.).","Moderar los rigores climáticos, mejorar la calidad del aire, fomentar los procesos erosivos, ayudar a regular el ciclo del agua y proporcionar productos de indudable valor económico (madera, leña, pastos, etc.).","Moderar los rigores climáticos, mejorar la calidad del aire, impedir los procesos erosivos, mitigar el ciclo del agua y proporcionar productos de indudable valor económico (madera, leña, pastos, etc.)."],0],[3,335,"Para poder cazar en un coto de caza es preciso:",["Tener aprobado un Plan de Aprovechamiento Cinegético.","Practicar la caza conforme al Plan de Aprovechamiento Cinegético.","Sendas respuestas anteriores son correctas."],2],[3,336,"En cuanto a la resolución aprobatoria de un Plan de Aprovechamiento Cinegético:",["Podrá suspenderse la actividad cinegética, previa incoación del oportuno expediente y audiencia a los interesados, por incumplimiento de las condiciones de dicha resolución.","En ningún caso podrá suspenderse la actividad cinegética, sino que únicamente habrá que renovarlos cada cuatro años.","Únicamente podrá suspenderse si así lo solicita el titular del aprovechamiento cinegético con independencia de que se hayan incumplido las condiciones de la resolución aprobatoria del mismo."],0],[3,337,"¿Qué organismo debe aprobar los planes de aprovechamiento cinegético?",["La Federación Madrileña de Caza.","La Consejería competente en materia de Medio Ambiente.","El Ministerio competente en materia de Medio Ambiente."],1],[3,338,"¿Qué es la memoria anual de actividades cinegéticas?",["Un documento que los titulares de los cotos han de presentar anualmente ante la Consejería competente de Medio Ambiente con los resultados de capturas de la campaña anterior.","Un documento que emite la Consejería competente en materia de Medio Ambiente en el que indica a los titulares de los aprovechamientos cinegéticos el número de piezas de cada especie que puede cazarse en él anualmente.","Un documento emitido por la Federación Madrileña de Caza en el que se plasma cómo debe realizarse la gestión anual de cada uno de los acotados."],0],[3,339,"El número de individuos de una especie que se pueden cazar en un coto se fija:",["Por el veterinario municipal.","Por la Orden General de Vedas.","Por el Plan de Aprovechamiento Cinegético."],2],[3,340,"En un coto privado de caza, el ejercicio de la caza le corresponde a:",["Las personas autorizadas por su titular para cada acción cinegética.","Todos los habitantes del municipio sobre el que se asienta, previa autorización de la Guardia Civil.","Cualquier persona que esté en posesión de una licencia de caza y que no tenga ánimo de lucro."],0],[3,341,"Podré practicar el deporte de la caza en un coto privado de caza, siempre y cuando:",["Cuente con la autorización del titular.","Posea la licencia de caza y el seguro de responsabilidad civil en vigor.","Sendas respuestas anteriores son verdaderas."],2],[3,342,"El derecho a practicar la actividad cinegética en un determinado coto privado:",["Le corresponde única y exclusivamente al titular del aprovechamiento, sin que pueda autorizar para ejercerlo a otras personas.","Puede ser ejercido por terceras personas autorizadas por el titular del aprovechamiento.","Le corresponde a los cazadores que estén en posesión de una licencia de caza."],1],[3,343,"En los cotos cuyos titulares no hayan presentado el Plan de Aprovechamiento Cinegético:",["Está suspendida la actividad cinegética.","Puede cazarse solamente durante un año.","La caza está totalmente permitida."],0],[3,344,"La matrícula de cotos de caza e inspección de terrenos, tanto a efectos de constitución como de ampliación de los mismos, así como la renovación anual de la matrícula:",["Está sujeta a una tasa que deberá ser satisfecha por el titular del aprovechamiento cinegético.","No está sujeta a ningún tipo de tasa.","Únicamente está sujeta a una tasa la matrícula de cotos de caza en su constitución, pero en ningún caso su renovación anual."],0],[3,345,"La tramitación y resolución sobre las peticiones relativas a la creación o reconocimiento de cotos comerciales de caza menor corresponde a:",["Los Ayuntamientos sobre los que se asientan.","La Consejería competente en materia de Medio Ambiente.","La Federación Madrileña de Caza previo informe de la Consejería competente en materia de Medio Ambiente."],1],[3,346,"Los propietarios de los terrenos sobre los que se asienta un coto privado de caza:",["Son siempre los titulares de su aprovechamiento cinegético.","Pueden ser los titulares de su aprovechamiento cinegético, aunque no necesariamente.","Nunca pueden ser los titulares de su aprovechamiento cinegético."],1],[3,347,"Las personas físicas o jurídicas podrán constituir cotos:",["Únicamente sobre terrenos de su propiedad y siempre que cumplan los requisitos legalmente establecidos para la constitución de un coto de caza.","Solamente sobre terrenos cuyos propietarios así lo autoricen.","Tanto en terrenos de su propiedad como en los de propietarios que así lo autoricen y siempre que cumplan los requisitos legalmente establecidos para la constitución de un coto de caza."],2],[3,348,"Para la constitución de un coto de caza:",["Es necesaria la autorización de todos los propietarios de los terrenos sobre los que se asentará el mismo, además del cumplimiento de otros requisitos establecidos legalmente.","No es necesaria la autorización de todos los propietarios de los terrenos sobre los que se asentará el mismo, bastando para ello con la del 70% de los propietarios y al margen de otros requisitos establecidos legalmente.","Bastará con el certificado de titularidad del secretario del Ayuntamiento del municipio donde se encuentren emplazados los terrenos sobre los que se asentará el mismo."],0],[3,349,"Se entiende por titular de un terreno cinegético:",["Toda persona física o jurídica que sea declarada como tal por la administración en el proceso de constitución del mismo por ser propietaria, arrendataria, cesionaria u ostentar la titularidad de otros derechos reales o personales que lleven consigo el uso y disfrute de los aprovechamientos de caza.","Toda persona física que, pese a no ser declarada como tal por la administración en el proceso de constitución del mismo, pueda acreditar que es propietaria, arrendataria, cesionaria u ostentar la titularidad de más del 75% de las fincas sobre las que se asiente el mencionado terreno cinegético.","Toda persona física o jurídica que haya solicitado ante la administración la constitución del mismo con independencia de que haya sido declarada como tal por el órgano competente."],0],[3,350,"La falsedad en la documentación aportada para la constitución de un coto de caza:",["Conllevará un ilícito penal pero en ningún caso la anulación del coto.","Conllevará la anulación del coto, sin perjuicio de las posibles responsabilidades penales o administrativas que pudieran derivarse.","Conllevará un ilícito administrativo y únicamente la suspensión del coto de caza hasta la resolución del conflicto."],1],[3,351,"La anulación de un coto de caza se producirá por:",["Muerte o extinción de la personalidad jurídica del titular o por su renuncia.","Resoluciones administrativa o judicial firmes.","Sendas respuestas anteriores son correctas."],2],[3,352,"Cuando se produzca la anulación o extinción de un coto de caza:",["Los terrenos que lo integran pasarán automáticamente a tener la consideración de zonas de aprovechamiento cinegético común.","Los terrenos que lo integran conservarán su consideración de zonas cinegéticas y podrá cazarse en ellos.","Los terrenos que lo integran pasarán automáticamente a tener la consideración de zonas de especial protección, no pudiéndose cazar nunca más en ellas."],0],[3,353,"La declaración de coto de caza:",["Lleva inherente la reserva del derecho de caza de todas las especies cinegéticas del coto, no siendo necesario ningún otro requisito para su aprovechamiento.","Lleva inherente la reserva del derecho de caza de todas las especies cinegéticas del coto, si bien su aprovechamiento deberá aprobarse en el correspondiente Plan de Aprovechamiento Cinegético.","Lleva inherente la reserva del derecho de caza de todas las especies del coto, con independencia de que sean declaradas como cinegéticas o no en la legislación vigente."],1],[3,354,"Es obligación del titular del terreno cinegético, entre otras:",["Firmar y entregar el Plan de Aprovechamiento Cinegético ante el órgano administrativo competente.","Velar por la correcta gestión del acotado.","Sendas respuestas anteriores son correctas."],2],[3,355,"Serán responsables del cumplimiento del Plan de Aprovechamiento Cinegético aprobado:",["Los titulares de los terrenos cinegéticos.","Los propietarios sobre los que se asienta el acotado.","El alcalde del municipio en el que se emplaza el acotado."],0],[3,356,"¿Pueden cazar con armas de fuego los menores de edad?",["No, en ningún caso.","Sí, siempre que sean mayores de 14 años, estén en posesión de la autorización especial para ello y vayan acompañados por un cazador mayor de edad que controle su acción de caza.","Sí, siempre que sean mayores de 12 años, estén en posesión de la autorización especial para ello y vayan acompañados por un cazador mayor de edad que controle su acción de caza."],1],[3,357,"La licencia de caza:",["Es obligatoria para el ejercicio de la caza y puede ser transferida a un tercero.","Es nominal, intransferible y obligatoria para el ejercicio de la caza.","No es obligatoria, de manera general, permitiéndose cazar sin ella en los terrenos de aprovechamiento cinegético común."],1],[3,358,"Los dueños de perros, aves de cetrería y hurones utilizados para el ejercicio de la caza:",["Quedan obligados a cumplir la normativa vigente sobre tenencia e identificación, sanidad, bienestar, transporte y desinfección de los vehículos que les afecten.","Están exentos de cumplir la normativa vigente sobre tenencia e identificación, sanidad, bienestar, transporte y desinfección de los vehículos si única y exclusivamente se destinan estos animales al ejercicio de la actividad cinegética.","Solamente deben cumplir la normativa vigente sobre tenencia e identificación, sanidad, bienestar, transporte y desinfección de los vehículos si los animales habitan en una ciudad, pero no los que lo hagan en caseríos u otros complejos rústicos de análoga naturaleza."],0],[3,359,"La autorización del titular de los derechos cinegéticos o también llamada tarjeta de socio o permiso de caza:",["Permite cazar según las condiciones fijadas en la misma.","Autoriza a su portador, con independencia de quien sea su titular, al ejercicio de la actividad cinegética en las condiciones fijadas en el mismo.","Autoriza a su titular para el ejercicio de cualquier actividad que ostente la condición de “tradicional” y sea respetuosa con el medio ambiente."],0],[3,360,"¿Cuál de los siguientes requisitos no son necesarios para obtener la licencia de caza?",["No hallarse inhabilitado para el ejercicio de la caza por sentencia judicial firme o resolución administrativa sancionadora ejecutiva.","Ostentar la aptitud y el conocimiento necesarios para la práctica de la caza.","Contar con la licencia de armas tipo “E”."],2],[3,361,"¿Cuál de los siguientes requisitos son necesarios para obtener la licencia de caza?",["Edad mínima de 16 años.","Estar inhabilitado para el ejercicio de la caza por sentencia judicial firme o resolución administrativa sancionadora ejecutiva","Haber superado las pruebas de aptitud y conocimientos necesarios para la práctica de la caza."],2],[3,362,"Tendrán la consideración de nuevo cazador:",["Quienes pretendan solicitar por primera vez la licencia de caza expedida por la Comunidad de Madrid y no acrediten haber poseído, antes de la entrada en vigor del Decreto 23/2015 de 23 de abril, la licencia de caza en otra Comunidad Autónoma o documento acreditativo de la habilitación para el ejercicio de la caza emitido en otro país.","Quienes pretendan solicitar por primera vez la licencia de caza expedida por la Comunidad de Madrid, independientemente de que acrediten haber poseído, en cualquier momento anterior a la entrada en vigor del Decreto 23/2015, de 23 de abril, la licencia de caza en otra Comunidad Autónoma o documento acreditativo de la habilitación para el ejercicio de la caza emitido en otro país.","Cualquier cazador que solicite la licencia de caza expedida por la Comunidad de Madrid, con independencia de que la haya poseído o no con anterioridad."],0],[3,363,"La licencia autonómica de caza de la Comunidad de Madrid tiene una vigencia de:",["1 a 5 años, computables desde la fecha de su expedición, siendo indefinida para los mayores de 65 años.","1 a 5 años, computables desde la fecha de su expedición, independientemente de la edad del cazador.","Siempre de 5 años."],0],[3,364,"Están exentos del pago de la tasa necesaria para obtener la licencia autonómica de caza de la Comunidad de Madrid:",["Los mayores de 65 años y las personas con discapacidad de grado igual o superior al 33%.","Los mayores de 60 años beneficiarios del sistema público de pensiones en situación de inactividad profesional.","Sendas respuestas anteriores son correctas."],2],[3,365,"Atendiendo al ámbito territorial de la licencia de caza, se establece:",["Una licencia de carácter autonómico válida únicamente en el ámbito territorial de la Comunidad de Madrid, en la que se especifica su finalidad concreta y la especialidad (con o sin arma).","La licencia de carácter autonómico anteriormente descrita y, además, una licencia interautonómica que permite el ejercicio de la caza en varias comunidades autónomas firmantes de un acuerdo.","Varias licencias de carácter municipal válidas únicamente en el ámbito territorial de la localidad en la que se practique la actividad cinegética y en la que se especificará su finalidad concreta y la especialidad (con o sin arma)."],1],[3,366,"La licencia interautonómica de caza tiene una vigencia:",["De 1 a 5 años, computables desde la fecha de su expedición.","De 1 año, computable desde la fecha de su expedición.","De 3 años, computable desde la fecha de su expedición."],1],[3,367,"Como norma general la caza en los Parques Nacionales:",["Está prohibida.","Puede cazar cualquier persona, bastando para ello únicamente estar en posesión de la correspondiente licencia de caza.","La caza está regulada por la normativa local."],0],[3,368,"Los Refugios de Caza son:",["Áreas donde la caza está prohibida, autorizándose únicamente por razones biológicas, científicas o educativas para asegurar la conservación de especies cinegéticas.","Áreas donde únicamente puede practicarse la actividad cinegética, estando totalmente prohibida la práctica de cualquier otra.","Áreas donde está permitida la actividad cinegética únicamente a los cazadores que la practiquen sin ánimo de lucro."],0],[3,369,"Las Reservas Nacionales de Caza son:",["Zonas donde la actividad cinegética está totalmente prohibida, autorizándose únicamente por razones biológicas, científicas o educativas.","Zonas con excepcionales posibilidades cinegéticas creadas por ley para conservar y fomentar determinadas especies.","Zonas en las que la actividad cinegética es autorizable pero única y exclusivamente a los cazadores que la practiquen sin ánimo de lucro."],1],[3,370,"La captura en vivo de ejemplares de aves fringílidas silvestres en la Comunidad de Madrid:",["Está prohibida.","Requiere de autorización administrativa y siempre tiene carácter excepcional con la finalidad exclusiva de la cría en cautividad y su educación en el canto.","Está totalmente permitida, sin que se requiera autorización administrativa previa para su ejercicio."],1],[3,371,"En cuanto a la captura en vivo de ejemplares de aves fringílidas silvestres en la Comunidad de Madrid:",["Está permitida, sin excepciones.","Está permitida en cualquier terreno libre, siempre que se cuente con el consentimiento de los propietarios de estos terrenos.","Está permitida en aquellos terrenos libres que no sean espacios naturales con algún grado de protección, incluidos los pertenecientes a la Red Natura 2000 y siempre contando con el consentimiento de los propietarios de dichos terrenos."],2],[3,372,"El control y la regulación de la actividad cinegética en las Zonas de Caza Controlada está reservada a:",["La Administración competente directamente o con el auxilio de las sociedades de cazadores colaboradoras.","A los cazadores menos pudientes sin ningún ánimo de lucro.","A los Consistorios municipales sobre los que se asiente, pudiendo cazar en ellas únicamente los cazadores locales."],0],[3,373,"En las Zonas de Especial Protección para las Aves (ZEPA):",["Está totalmente prohibido cazar.","Puede cazarse siempre que no lo prohíba la Administración competente.","Puede cazarse en cualquier caso y sin limitación alguna para ello."],1],[3,374,"En la actualidad, en la Comunidad de Madrid:",["Existen 17 Zonas de Caza Controlada bajo gestión directa de la Consejería de Medio Ambiente y Ordenación del Territorio.","No existen ninguna Zona de Caza Controlada.","Existen 2 Zonas de Caza Controlada bajo gestión directa y conjunta de los Ayuntamientos sobre los que se asientan."],0],[3,375,"¿Puede un Plan de Aprovechamiento Cinegético proponer actuaciones que difieran de lo dispuesto en la legislación vigente en materia de caza?",["En ningún caso.","Únicamente con la preceptiva justificación técnica de la medida excepcional pretendida y tras su aprobación por parte de la Consejería competente en materia de Medio Ambiente.","Sí, siempre y cuando se cuente con la autorización del titular del aprovechamiento cinegético."],1],[3,376,"Cualquier medida excepcional a tomar en defensa de los aprovechamientos agrícolas, de la flora o de la fauna deberá contar con la autorización de:",["La Consejería competente en materia de Medio Ambiente.","El titular del aprovechamiento cinegético.","El Ministerio competente en materia de Medio Ambiente."],0],[3,377,"Las licencias de armas:",["Son irrevocables.","Pueden ser revocadas si el administrado cuenta con antecedentes penales o de conducta.","Únicamente pueden revocarse si el administrado cuenta con antecedentes penales."],1],[3,378,"El número total de armas amparadas con licencia tipo E no podrá ser superior a:",["3","6","12"],2],[3,379,"La licencia de armas tipo E es concedida por:",["Los Subdelegados del Gobierno y por los Delegados del Gobierno en Ceuta y Melilla.","La Intervención Central de Armas y Explosivos (ICAE) de la Guardia Civil.","La Dirección General de Policía."],0],[3,380,"La licencia de armas tipo D es concedida por:",["Los Directores Generales de la Policía y de la Guardia Civil.","La Intervención de Armas y Explosivos del lugar de residencia del administrado.","La Consejería de Medio Ambiente."],1],[3,381,"¿Cuántas armas de fuego de la categoría 2ª 2 puede amparar la licencia de armas tipo D?",["Solamente 1.","Hasta 3.","Hasta 5."],2],[3,382,"Para mantener la vigencia de las licencias de tipo D, las personas mayores de 60 años necesitarán visarla por la autoridad competente:",["Cada cinco meses.","Cada año.","Cada dos años."],2],[3,383,"Para obtener licencia para la tenencia y uso de las armas largas rayadas para caza mayor o de escopetas es imprescindible:",["Superar una prueba de capacitación teórica.","Superar una prueba de capacitación práctica.","Cumplir sendos requisitos anteriores."],2],[3,384,"El uso de ballestas:",["Está prohibido para la caza.","Está permitido para la caza, amparándose su uso en la licencia de tipo E.","Está permitido para la caza, amparándose su uso en la licencia de tipo D."],0],[3,385,"Las licencias de armas tipo D y E podrán ser expedidas:",["A los españoles y extranjeros con residencia legal en España.","Solamente a los españoles.","A los españoles y a los extranjeros, con residencia legal en la Unión Europea."],0],[3,386,"Las solicitudes de las licencias de armas tipo D y E se presentarán:",["En las Intervenciones de Armas de la Guardia Civil correspondientes al domicilio del interesado.","Siempre en la Intervención Central de Armas de la Guardia Civil.","En la Subdelegación del Gobierno."],0],[3,387,"Para obtener la licencia de caza con armas es un requisito imprescindible:",["Contar con licencia de armas tipo D.","Haber acreditado la previa celebración de un contrato de seguro de responsabilidad civil del cazador, de suscripción obligatoria.","Estar federado."],1],[3,388,"El seguro de suscripción obligatoria del cazador cubre:",["La obligación de todo cazador con armas de indemnizar los daños corporales causados a las personas con ocasión de la acción de cazar.","La obligación de todo cazador con armas de indemnizar únicamente los daños materiales causados a los bienes con ocasión de la acción de cazar.","La obligación de todo cazador con armas de indemnizar los daños causados a las personas con independencia de que se hayan producido con ocasión de la acción de cazar o no."],0],[3,389,"Según la Ley, el ámbito territorial del seguro obligatorio para cazadores debe ser:",["La Unión Europea.","El territorio nacional.","La comunidad autónoma en la que se ubique el coto donde cace el asegurado."],1],[3,390,"El capital asegurado y los daños cubiertos por el seguro obligatorio para cazadores regulado reglamentariamente:",["No pueden ampliarse en ningún caso.","Pueden ampliarse libremente por el asegurado.","Pueden limitarse libremente por el asegurado."],1],[3,391,"En cuanto al seguro de responsabilidad civil del cazador:",["Es un documento más que las compañías de seguros utilizan para sacar dinero pero no sirve de mucho.","Es obligatorio para el cazador con armas.","Ambas respuestas son falsas."],1],[3,392,"En terrenos acotados al efecto podrán cazarse las especies de caza menor relacionadas en la Orden General de Vedas de la Comunidad de Madrid los días:",["Jueves, sábados y domingos.","Jueves, sábados, domingos y festivos nacionales.","Jueves, sábados, domingos y festivos nacionales y autonómicos en la Comunidad de Madrid."],2],[3,393,"El año cinegético o temporada de caza en la Comunidad de Madrid se considera entre las fechas:",["1 de abril y 31 de marzo del año siguiente.","1 de enero y 31 de diciembre.","15 de agosto y 14 de agosto del año siguiente."],0],[3,394,"En todos los cotos privados de caza se podrá ejercer la caza con escopeta de jabalí al salto o en mano, los jueves, sábados, domingos y festivos, durante el período hábil para la caza menor, hasta un máximo de seis cazadores y seis perros:",["Falso, es hasta un máximo de seis cazadores y diez perros.","Falso, no está permitida esta modalidad de caza en la Comunidad de Madrid.","Verdadero, deberán tenerlo contemplado en su Plan de Aprovechamiento Cinegético, para poder llevarla a cabo."],2],[3,395,"Si estoy interesado en realizar un descaste de corzas en mi coto de caza, tendré que realizarlo en el periodo comprendido entre:",["El 1 de abril y el 30 de junio.","Del 1 al 30 de septiembre.","Del 1 de abril al 30 de junio y del 1 al 30 de septiembre."],1],[3,396,"Si me han invitado a cazar en media veda, ¿en cuál de los siguientes meses del año me encuentro?:",["Enero o febrero.","Agosto o septiembre.","Octubre o noviembre."],1],[3,397,"Si me han invitado a cazar zorzales, ¿en cuál de los siguientes meses del año me puedo encontrar?:",["Octubre, noviembre, diciembre o enero.","Agosto o septiembre.","Diciembre o enero."],0],[3,398,"El periodo hábil general de caza menor se extiende entre los meses de:",["Octubre y enero.","Octubre y febrero.","Agosto y septiembre."],0],[3,399,"¿Qué debe ser considerado como ‘la veda’?:",["El periodo de tiempo en el que no se puede cazar.","La temporada general de caza.","El periodo de tiempo en el que se puede cazar."],0],[3,400,"En los cotos privados de caza donde sea aconsejable reducir la densidad de conejo por diversos motivos, podrá solicitarse el descaste el cual podrá autorizarse:",["Entre el 15 y el 25 de julio, ambos incluidos.","Entre el 15 de mayo y el 25 de julio, ambos incluidos.","Entre el 15 de junio y el 25 de julio, ambos incluidos."],2],[3,401,"El periodo hábil de caza para la cabra montés comprende:",["Desde 1 de abril hasta el 30 de junio y del 1 al 31 de marzo, del siguiente año, para machos.","Desde el 15 de septiembre al 15 de diciembre, para machos y hembras.","Las dos respuestas anteriores son verdaderas."],2],[3,402,"Se podrá efectuar la caza en la modalidad de rececho para el ciervo:",["Entre el 1 y el 31 de octubre.","Desde el 1 de septiembre hasta el final del periodo hábil de caza mayor.","Entre el 1 de septiembre y el 31 de octubre."],1],[3,403,"Queda prohibido el ejercicio de cualquier actividad cinegética en aquellos cotos de caza cuyos titulares no hayan presentado:",["El obligado Plan de Aprovechamiento Cinegético (PAC) debidamente cumplimentado.","El correspondiente informe de resultados antes del inicio de la media veda.","Las dos anteriores son falsas."],0],[3,404,"Si un titular de un coto de caza de la Comunidad de Madrid no presenta el obligado Plan de Aprovechamiento Cinegético debidamente cumplimentado, puede quedar prohibido:",["La comercialización de las especies cinegéticas cazadas durante la presente temporada de caza.","El ejercicio de cualquier actividad cinegética.","La solicitud de subvenciones relativas a la conservación de las especies cinegéticas del citado coto de caza."],1],[3,405,"A efectos de facilitar la presentación del Plan de Aprovechamiento Cinegético, deberá elaborarse este cumplimentado por:",["El titular del coto de caza.","La Sociedad de Cazadores arrendataria del coto de caza.","Las dos son verdaderas."],0],[3,406,"La renovación de los Planes de Aprovechamiento Cinegético deberán presentarse por norma general antes de:",["El 31 de marzo del año en que finaliza su periodo de vigencia.","La apertura de la media veda del año en que finaliza su periodo de vigencia.","La apertura de la veda general del año en que finaliza su periodo de vigencia."],0],[3,407,"Deberemos realizar un nuevo Plan de Aprovechamiento Cinegético siempre y cuando:",["Se modifique la superficie de un acotado por agregación o segregación en más de un 30%, haya un cambio de aprovechamiento, se cree un nuevo coto de caza o cumpla el periodo de vigencia del que rija actualmente en un determinado coto de caza.","Hay que presentar el Plan de Aprovechamiento Cinegético obligatoriamente cada año.","Hay que presentar el Plan de Aprovechamiento Cinegético obligatoriamente cada dos años."],0],[3,408,"Deberemos realizar un nuevo Plan de Aprovechamiento Cinegético si:",["Modificamos la superficie de un acotado, sea cual sea esta.","Hay un cambio de aprovechamiento.","Las dos respuestas anteriores son verdaderas."],1],[3,409,"Como norma general el periodo de vigencia de un Plan de Aprovechamiento Cinegético será de:",["Una temporada.","Dos temporadas.","Cinco temporadas."],2],[3,410,"El Plan de Aprovechamiento Cinegético de mi coto de caza se aprobó hace tres años, ¿cuánto deberé volver a renovarlo?:",["El año que viene.","Dentro de dos años.","Ya ha caducado, debí renovarlo el año pasado."],1],[3,411,"En el apartado del estado natural del Plan de Aprovechamiento Cinegético de un coto de caza se incluirán, entre otros, datos relativos a:",["La climatología, la topografía, la hidrografía, la vegetación y los usos y aprovechamientos del coto.","La climatología, la topografía y la zoología.","La climatología, la topografía y el inventario de especies cinegéticas."],0],[3,412,"En el apartado del estado faunístico del Plan de Aprovechamiento Cinegético de un coto de caza se incluirán, entre otros, datos relativos a:",["La estimación de existencias de fauna y flora.","La estimación de existencias de las principales especies cinegéticas.","Datos relativos a los usos y aprovechamientos ganaderos del coto."],1],[3,413,"El Plan de Aprovechamiento Cinegético de un coto de caza debe incluir el plan de capturas que regirá durante la vigencia del plan, en el que se indicará:",["El número máximo de capturas por temporada, especie cinegética y modalidad.","El número máximo de capturas por temporada, especie cinegética, modalidad y cuartel.","El número máximo de capturas por temporada y especie cinegética."],0],[3,414,"Un Plan de Aprovechamiento Cinegético es un instrumento de gestión justificativo de la cuantía y modalidades de las capturas a realizar de acuerdo con el potencial biológico de las especies existentes en un coto de caza, con el fin de:",["Obtener un rendimiento económico para la administración.","Obtener datos con fines exclusivamente técnicos y científicos.","Proteger y fomentar la riqueza cinegética."],2],[3,415,"El Plan de Aprovechamiento Cinegético de un coto de caza tiene que:",["Ser presentado, debidamente cumplimentado, por el titular del coto y ser aprobado, mediante Resolución de la Consejería competente en materia de Medio Ambiente.","Ser presentado, debidamente cumplimentado, por el titular o el guarda del coto y ser aprobado, mediante Resolución de la Consejería competente en materia de Medio Ambiente.","Las dos respuestas anteriores son falsas."],0],[3,416,"La actividad cinegética se considerará compatible en el ámbito del PORN, Plan de Ordenación de los Recursos Naturales, quedando sujeta a:",["Los periodos y condiciones establecidos en este Plan.","Los periodos de caza que establece la Orden Anual de Vedas.","Las dos anteriores son falsas."],0],[3,417,"La ordenación cinegética en el ámbito del PORN, Plan de Ordenación de los Recursos Naturales, tiene por finalidad:",["Fomentar el aprovechamiento comercial de la caza.","El mantenimiento del equilibrio biológico de las diferentes especies animales.","Obtener mayores ingresos económicos con la venta de jornadas de caza."],1],[3,418,"La Consejería competente en materia de medio ambiente podrá determinar en el ámbito del PORN, si así lo requiere:",["Los días hábiles de caza y el cupo.","El estado de los recursos cinegéticos, limitaciones específicas en las especies abatibles y períodos hábiles.","El periodo hábil exclusivamente."],1],[3,419,"Los PRUG, Planes Rectores de Uso y Gestión, es el instrumento básico de planificación para Parques Regionales y Parques Naturales, y entre otros aspectos contienen normas concretas para regular aquellas actividades, tanto de carácter económico, como de carácter recreativo, que se desarrollen dentro del espacio, entre las cuales se encuentra:",["La caza.","No se encuentra la caza porque es una afición sin ánimo de lucro.","Las dos anteriores son falsas."],0],[3,420,"El Catálogo Nacional de Especies Amenazadas (CNEA) es aquel que incluye:",["Las especies, subespecies o poblaciones específicas que no pueden cazarse.","Las especies, subespecies o poblaciones cuya protección efectiva exija medidas específicas de conservación por parte de las Administraciones Públicas.","Las especies, subespecies o poblaciones cuya protección efectiva exija la prohibición de su caza y/o cría en cautividad."],1],[3,421,"¿Cuál de las siguientes aves está catalogada en peligro de extinción?",["El águila calzada.","El milano negro.","El águila imperial ibérica."],2],[3,422,"¿Cuál de las siguientes aves está catalogada como vulnerable según el Catálogo Regional de Especies Amenazadas de la Comunidad de Madrid?",["La cigüeña común.","El milano real.","Las dos especies anteriores están catalogadas como vulnerables."],2],[3,423,"La nutria, el lince ibérico y el desmán de los pirineos son los tres únicos mamíferos catalogados como especies en peligro de extinción por el Catálogo Regional de Especies Amenazadas de la Comunidad de Madrid:",["Verdadero.","Falso, la nutria y el lince ibérico sí, pero el desmán de los pirineos no.","Falso, el topillo de cabrera también está catalogado como especie en peligro de extinción."],0],[3,424,"Cuál de las siguientes especies está catalogada como en peligro de extinción en la Comunidad de Madrid:",["La nutria.","El visón americano.","El zorzal real."],0],[3,425,"¿Debemos disparar a una hembra de jabalí seguida de sus crías?",["Solamente si los jabatos son más de dos.","Únicamente si entre la hembra y los rayones hay una distancia de más de 20 metros.","Bajo ningún concepto. De hecho, es una conducta ilícita y por tanto sancionable."],2],[3,426,"La captura de especies no calificadas como cinegéticas en la Comunidad de Madrid:",["Está terminantemente prohibida.","Está permitida, siempre y cuando no se traten de especies protegidas.","Puede autorizarse por motivos de sanidad pública, de seguridad, de control de daños, etc."],2],[3,427,"Si cazo una especie no catalogada como cinegética en mi coto de caza:",["Debo comunicarlo a la Consejería competente en materia de Medio Ambiente, para evitar ser sancionado.","Solicitaré el correspondiente precinto.","Estoy cometiendo una acción sancionable."],2],[3,428,"El Consejo de Medio Ambiente es:",["Un órgano consultivo y asesor creado para permitir la participación de la sociedad civil en las políticas medioambientales de la Comunidad de Madrid.","Una institución dependiente del MAGRAMA que defiende los intereses medioambientales de España en el seno de la Unión Europeo.","Un área de disciplina de la Dirección General de Medio Ambiente de la Comunidad de Madrid."],0],[3,429,"Entre los vocales del Consejo de Medio Ambiente se encuentran:",["Solamente representantes de organizaciones ecologistas.","Solamente representantes de asociaciones de cazadores.","Tanto representantes de organizaciones ecologistas como de asociaciones de cazadores y pescadores y otros representativos de otros sectores, como el agropecuario, el científico."],2],[3,430,"El órgano consultivo y asesor de la Consejería competente en materia de Medio Ambiente y Ordenación del Territorio de la Comunidad de Madrid que participa activamente en la elaboración de las disposiciones medioambientales en representación de los intereses de la sociedad civil es:",["La Agencia de Medio Ambiente.","El Consejo de Medio Ambiente.","La Dirección General de Medio Ambiente."],1],[3,431,"Como norma general es el titular de un coto de caza quien debe responder por los daños producidos por las especies cinegéticas:",["Verdadero.","Falso.","No si las siembras donde se han realizado los daños también están comidas por otras especies."],0],[3,432,"El propietario de un terreno libre no acotado es responsable de los daños originados por la caza en dichos límites:",["Verdadero.","Falso.","Solo si no las tienen cedidas en arrendamiento."],0],[3,433,"En los supuestos de daños producidos por atropellos de especies cinegéticas en vías públicas, como norma general, el responsable de los mismos será:",["Siempre el titular del aprovechamiento cinegético del que proviene el animal.","El conductor del vehículo, con algunas excepciones recogidas por ley.","Siempre la Administración titular de la vía pública."],1],[3,434,"Cuando un accidente de tráfico producido por una especie cinegética sea consecuencia directa de una acción de caza colectiva o de una especie de caza mayor llevada a cabo el mismo día o que haya concluido 12 horas antes de aquél, el responsable de los daños ocasionados será:",["La Administración titular de la vía pública.","El conductor del vehículo o, en su defecto, el propietario del mismo.","El titular del aprovechamiento cinegético o, en su defecto, el propietario del terreno."],2],[3,435,"¿Respondería el titular de la vía en la que se produzca un atropello de una especie cinegética por los daños que el mismo ocasione?",["En ningún caso.","Siempre que se produzca en carreteras convencionales y nunca si es en autovías o autopistas.","Sí, cuando se produzca como consecuencia de no haber reparado la valla del cerramiento en plazo, en su caso, o por no disponer de la señalización específica de animales sueltos en tramos con alta accidentalidad por colisión de vehículos con los mismos."],2],[3,436,"Si como consecuencia de la celebración de una montería, un corzo es espantado hacia una carretera colindante, causando un accidente de tráfico, ¿sería responsable su titular por los daños provocados por el animal?",["En ningún caso, pues la montería es una acción colectiva de caza.","Sí, pues el accidente se produjo como consecuencia directa de una acción de caza colectiva llevada a cabo el mismo.","No, pues sería responsable el conductor del vehículo o el titular de la carretera."],1],[3,437,"El control con escopeta de las poblaciones de grajilla, urraca, corneja y zorro de la Comunidad de Madrid fuera del periodo hábil general de caza:",["Está totalmente prohibido.","Puede autorizarse por la Consejería de Medio Ambiente y Ordenación del Territorio, previa petición de los titulares de los cotos privados de caza donde sean consideradas como piezas cazables.","Está permitido durante todo el año sin limitación alguna previa petición del interesado."],1],[3,438,"La caza del zorro está autorizada:",["Durante los periodos establecidos en las autorizaciones extraordinarias de control de otras especies cinegéticas.","Incluso en los espacios protegidos donde esta especie no esté declarada como cinegética.","En los terrenos sometidos a régimen cinegético especial pero fuera de sus periodos hábiles de caza."],0],[3,439,"El uso de jaulas trampa con ejemplares vivos de urraca para llevar a cabo el control de estos córvidos:",["Está permitido.","Está prohibido.","Es autorizable, previa solicitud administrativa."],2],[3,440,"Los titulares de los cotos autorizados a efectuar el control de animales asilvestrados:",["Deberán comunicar a la Administración los resultados de las capturas o piezas abatidas a efectos de su identificación, siendo sancionable el incumplimiento de este requisito.","Deberán comunicar a la Administración los resultados de las capturas o piezas abatidas a efectos de su identificación, no siendo sancionable el incumplimiento de este requisito.","No están sujetos a ninguna obligación al respecto."],0],[3,441,"El uso de jaulas trampa para llevar a cabo el control de zorros:",["Está permitido.","Está prohibido.","Es autorizable, previa solicitud administrativa."],1],[3,442,"El uso del chillo electrónico para efectuar el control de zorros con escopeta:",["Está permitido.","Está prohibido.","Es autorizable previa solicitud administrativa."],1],[3,443,"¿Puede autorizarse en la Comunidad de Madrid el control de predadores sin armas de fuego?",["No, en ningún caso.","Sí, si lo tiene contemplado en su Plan de Aprovechamiento Cinegético.","Únicamente previa autorización de la Consejería competente, a petición de los titulares, y siempre que se realice por personal debidamente acreditado y con métodos que estén homologados por el Ministerio o la Comunidad Autónoma."],2],[3,444,"El control de predadores sin armas de fuego:",["Está prohibido.","Deberá realizarse con métodos homologados según las Directrices técnicas para la captura de especies cinegéticas predadoras aprobadas por la Conferencia Sectorial de Medio Ambiente de 13 de julio de 2011.","Únicamente podrá realizarse por el Servicio de Protección de la Naturaleza de la Guardia Civil."],1],[3,445,"Los únicos lazos selectivos y homologados, cuyo uso es autorizable para la captura del zorro son:",["Lazo propulsado tipo Collarum o de similares características mecánicas y funcionamiento, lazo con tope y cierre libre dispuesto en alar y lazo tipo Wisconsin o de similares características mecánicas y funcionamientos, tanto dispuesto en alar como al paso.","Lazo propulsado tipo Collarum o de similares características mecánicas y funcionamiento, lazo con tope y cierre libre dispuesto en alar, lazo tipo Wisconsin o de similares características mecánicas y funcionamientos, tanto dispuesto en alar como al paso y además los cepos almohadillados.","Ninguno, pues en España no existen lazos selectivos homologados."],0],[3,446,"Según la normativa vigente en nuestro país sobre control de predadores, el uso de sustancias y métodos que causen la muerte del animal por asfixia.",["Está prohibido.","Está permitido.","Es autorizable."],0],[3,447,"Si en mi coto de caza, una vez realizado un exhaustivo censo, detecte el aumento de las poblaciones de predadores podré solicitar:",["El correspondiente permiso para su control aun habiendo finalizado la temporada general de caza.","Que venga personal de la administración a cazarlos.","La utilización de métodos de control no selectivos."],0],[3,448,"Todas las personas con autoridad para intervenir en la vigilancia de la caza, deberán ostentar visiblemente:",["Los emblemas y distintivos de su cargo.","La placa del cuerpo en cuestión.","Los distintivos reglamentarios solo debe llevarlos la Guardia Civil."],0],[3,449,"Las autoridades y sus agentes y en particular la Guardia Civil, la Guardería del Servicio, la Guardería Forestal del Estado, la Guardería del Patrimonio Forestal del Estado, los Guardas de las Reservas Regionales de Caza, los Guardas Jurados, los Agentes de Policía Marítima y la Policía Local harán observar las prevenciones de la Ley y Reglamento de Caza:",["Denunciando cuantas infracciones lleguen a su conocimiento.","Denunciando siempre y cuando consigan identificar a la persona en cuestión y hayan presenciado los hechos.","Primero deberán advertir de la infracción y si se repite podrán sancionar."],0],[3,450,"Los Guardas encargados de la vigilancia de Parques Nacionales, Refugios de caza, Reservas Regionales de Caza, cotos de caza y terrenos sometidos a Régimen de Caza Controlada, deberán estar:",["Continuamente en el campo realizando turnos inclusive días festivos para garantizar su protección.","Debidamente uniformados.","Debidamente uniformados en actos de servicio."],2],[3,451,"La Ley de la Comunidad de Madrid establece la superficie mínima dotada de personal de vigilancia que debe haber en los cotos de caza:",["Verdadero, debe haber al menos un guarda con dedicación plena cada 10.000 hectáreas.","Verdadero, debe haber al menos un guarda con dedicación plena cada 15.000 hectáreas.","Falso."],2],[3,452,"La Ley de la Comunidad de Madrid exige:",["Que los guardas jurado vayan en un vehículo dotado al menos de tracción 4x4.","La superficie mínima que debe vigilar al menos un guarda particular de campo.","Las dos respuestas anteriores son falsas."],2],[3,453,"Frente a un delito, el Guarda de Caza están facultado para:",["Denunciar.","Retener y poner inmediatamente a disposición de las Fuerzas y Cuerpos de Seguridad del Estado a los delincuentes.","Ambas respuestas son correctas."],1],[4,454,"En acciones de caza colectiva, como monterías u ojeos, el cazador:",["Sí puede tener cargadas las armas tanto antes de llegar al puesto como después de abandonarlo pero con el seguro activado.","No puede tener cargadas las armas antes de llegar al puesto ni después de abandonarlo.","Sí puede tener cargadas las armas antes de llegar al puesto, con el seguro activado, pero nunca después de abandonarlo."],1],[4,455,"En acciones de caza colectiva, como monterías u ojeos, el cazador de camino al puesto:",["Puede llevar cargadas las armas e, incluso, efectuar un disparo si se le presenta la ocasión.","Puede debe llevar cargadas las armas pero no podrá efectuar disparo alguno.","No podrá disparar, bajo ningún concepto."],2],[4,456,"En acciones de caza colectiva, como monterías u ojeos, el cazador:",["Puede tener cargadas las armas tanto antes de llegar al puesto como después de abandonarlo, pero con el seguro activado.","No abandonará el puesto hasta que no haya finalizado esta.","Procederá a cobrar las piezas cuanto antes, para evitar el sufrimiento de los animales."],1],[4,457,"Durante cualquier acción de caza colectiva, como monterías, batidas u ojeos, que se desarrolle en zonas atravesadas por vías, caminos de uso público y/o vías pecuarias, los titulares cinegéticos o los organizadores de la cacería deberán:",["Poner a la entrada de la vía o del camino de la zona o mancha que vaya a cazarse, señales para avisar de su celebración.","Cortar el tránsito de las vías o de los caminos de la zona o mancha que vaya a cazarse al objeto de salvaguardar la integridad de las personas.","Vigilar el tránsito de las vías o de los caminos comunicando verbalmente a los viandantes sobre la celebración su celebración."],0],[4,458,"Las señales indicadoras de los puestos de las cacerías colectivas que tengan lugar en cotos privados de caza:",["Deberán retirarse dentro de los dos días naturales siguientes a su celebración.","No será obligatorio que se retiren, teniendo los organizadores la facultad para decidir al respecto.","Deberá retirarse dentro del plazo de una hora después de la cacería."],0],[4,459,"Los puestos de aguardos al jabalí autorizados para el control de daños a la agricultura deben ubicarse:",["Solo en las zonas cultivadas susceptibles de sufrir daños.","En las zonas cultivadas susceptibles de sufrir daños o en sus inmediaciones, evitando la cercanía a caminos y sendas, incluso aunque no tengan la condición de zonas de seguridad.","En cualquier área del acotado propicia para ello con independencia de que sean zonas cultivadas o no."],1],[4,460,"En aras de la seguridad en el uso de este arma, se deberán emplear arcos:",["Con la potencia suficiente para abatir la pieza objeto de captura.","Con la potencia necesaria para herir la pieza objeto de captura.","De poleas, con independencia de cuál sea su potencia."],0],[4,461,"Finalizada una montería, el montero:",["Nunca podrán moverse del puesto hasta que sea recogido por el postor.","Podrá abandonar el puesto siempre que los perros ya hayan pasado por él.","Podrá abandonar el puesto cuando el organizador le avise por la emisora de su conclusión."],0],[4,462,"Si dos grupos de cazadores se cruzan:",["Deben saludarse con respeto y evitar enfrentamientos.","Deben preguntarse por las incidencias del terreno que han cazado.","Deben descargar sus armas."],2],[4,463,"En dirección a un rebaño de ganado:",["No puedo disparar nunca.","Puedo disparar siempre que no esté presente persona alguna.","Puedo disparar si está a más de 20 metros de distancia."],0],[4,464,"En las monterías:",["Puede comenzarse a disparar en cualquier en el momento que divise una posible pieza.","Solo puede dispararse cuando se haya dado la señal para ello.","Si es al blanco, puede dispararse en cualquier momento."],1],[4,465,"Hacia las zonas de seguridad:",["No se puede disparar.","Sí se puede disparar porque en ellas se está seguro.","Se puede disparar solo cuando el cazador se encuentre separado de ellas por una distancia mayor de la que pueda alcanzar el proyectil."],2],[4,466,"En los caminos de uso público:",["No puede hacerse uso de las armas de fuego.","Puede hacerse uso de las armas de fuego únicamente cuando no transite nadie por ellos.","Las armas de fuego pueden usarse libremente durante el ejercicio de la caza."],0],[4,467,"En las vías pecuarias:",["No se puede cazar.","Puede hacerse uso de las armas de fuego únicamente cuando no transite ni ganado ni personas por ellas.","Pueden usarse armas de fuego en todo momento durante la celebración de una cacería."],0],[4,468,"En un ojeo de perdices, los puestos o pantallas deben situarse como mínimo:",["A 40 metros unos de otros.","A 50 metros unos de otros.","A 250 metros unos de otros."],0],[4,469,"En acciones de caza colectiva, los puestos deben colocarse:",["En cualquier lugar, siempre que resulten buenos tiraderos.","Cerca de los arroyos.","Siempre desenfilados y protegidos de los disparos de los demás cazadores."],2],[4,470,"¿Es cierto que los cazadores deben explicarle al postor en una montería cuál va a ser su campo de tiro para que éste lo advierta al resto?",["Sí.","No, pues es el postor quien debe explicárselo a los cazadores.","Solamente en algunas ocasiones."],1],[4,471,"Durante la celebración de una montería, pueden cambiarse de puesto:",["Los secretarios.","El capitán de montería.","Nadie, pues ningún cazador puede abandonar su puesto hasta que no sea recogido por el postor."],2],[4,472,"En las zonas en las que se estén celebrando actos públicos:",["Está permitido cazar.","Está prohibido cazar.","Es autorizable cazar."],1],[4,473,"Cuando se toma un arma para su limpieza, desmontaje, almacén…",["Hay que comprobar que no hay cartuchos ni en su recámara ni en su depósito de municiones.","No es necesario comprobar si hay cartuchos en su recámara o en su depósito de municiones.","Hay que comprobar que su seguro está puesto, pero no si hay cartuchos en su recámara o en su depósito de municiones."],0],[4,474,"Al circular en el vehículo, el arma:",["Debe estar descargada.","Debe estar enfundada.","Debe estar descargada y enfundada."],2],[4,475,"Si circulo por mi coto de caza con el arma cargada y enfundada:",["Debo poner atención a que esta lleve el seguro accionado.","Estoy haciendo lo correcto mientras circule dentro del coto del que porto autorización para cazar.","Estoy cometiendo una infracción además de un acto de irresponsabilidad, el arma en el vehículo debe ir descargada y enfundada."],2],[4,476,"Durante la acción de caza, el arma debe portarse:",["Con los cañones dirigidos hacia el suelo o hacia arriba, nunca en horizontal o hacia los lados, incluso cuando se cace en solitario.","Con los cañones en horizontal o hacia los lados, nunca dirigidos hacia el suelo o hacia arriba, incluso cuando se cace en solitario.","Con los cañones dirigidos hacia el suelo o hacia arriba, nunca en horizontal o hacia los lados, pero exclusivamente cuando se cace en compañía."],0],[4,477,"Si no distinguimos perfectamente la pieza o si hay vegetación que nos impide ver qué hay detrás de ella al alcance de nuestro disparo:",["Nunca debemos disparar.","Podemos disparar cuando estemos casi seguros de que es una especie cinegética.","Es importante disparar rápido."],0],[4,478,"Durante un día de caza menor dos manos de cazadores caminan en sentido contrario. ¿A qué distancia deberán abrir sus armas en tanto se mantengan avanzando de frente uno respecto al otro?:",["50 metros.","100 metros.","150 metros."],0],[4,479,"Si nos disponemos a cazar en un coto y detectamos que existe una zona de cultivos que están siendo recolectados:",["Evitaremos esta zona y nos dirigiremos a cazar en otras para no molestar.","Cazaremos igualmente en ella si es nuestro propósito pues pertenece al acotado.","Disparemos al aire en varias ocasiones para advertir nuestra presencia."],0],[4,480,"Las especies cinegéticas son un recurso natural que debe aprovecharse:",["Todo lo que se pueda, asegurando las capturas del 50% de las densidades existentes.","De forma sostenible.","De forma sostenible siempre y cuando no sea económicamente viable."],1],[4,481,"Se dice que un cazador desarrolla unas buenas prácticas cinegéticas cuando por ejemplo:",["Valora más el lance que el número de capturas.","Se preocupa por ser competitivo y ser el que más caza.","Proporciona comida a los animales en cualquier circunstancia."],0],[4,482,"Ayudaremos a que la actividad cinegética en nuestro coto de caza sea sostenible siempre y cuando:",["Vendamos numerosos puestos o jornadas de caza de cuantas se realicen en dicho coto.","Se ejercite está bajo el control técnico que garantice su disfrute para las futuras generaciones.","La caza sostenible solo es obligatoria para aquellas especies catalogadas como vulnerables."],1],[4,483,"Sobre las normas éticas y deportivas en la caza:",["Nunca deberemos disparar sobre una liebre que esté parada o encamada.","Si estoy seguro de hacer blanco, dispararé a cualquier distancia.","Se debe disparar a las aves posadas para asegurar el disparo."],0],[4,484,"Es aconsejable, en cuanto al adiestramiento de nuestro perro y las normas éticas en la práctica de la caza:",["Haberle enseñado adecuadamente para que una vez en el campo no destroce las piezas cobradas.","Los perros de caza tienen que aprender cazando, no necesitan un adiestramiento previo.","Haberle enseñado a coger los conejos en las madrigueras o las liebres en la cama para ahorrar cartuchos."],0],[4,485,"A la hora de disparar a una pieza:",["Se disparará cuanto antes, para evitar que escape.","Se dejará cumplir a la pieza antes de disparar y rematar el lance.","El disparo se realizará siempre hacia la hembra adulta, que suelen ser las que provocan accidentes."],1],[4,486,"Durante la caza de perdiz en ojeo:",["Intentaré abatir cuantas pueda sin preocuparme por el cobro, ya que este se realiza al final.","En el cobro se recogerán como propias las que han sido abatidas desde el puesto.","Se disparará primero a las perdices que entren a peón, ya que son las más fáciles de acertar."],1],[4,487,"Durante la caza de la liebre con galgo:",["Se intentará soltar a estos cuanto antes para que logren visualizarla mejor.","Se intentará dar ventaja a la liebre en el arranque.","Si la liebre se mete en una madriguera, deberemos desalojarla para que la carrera continúe."],1],[4,488,"Si encuentras un corcino solo en el campo, ¿qué debes hacer?:",["Cogerlo inmediatamente y llevarlo a casa antes de que muera.","Cogerlo inmediatamente y llevarlo a un centro de recuperación de fauna.","Dejarlo en ese lugar pues lo más probable es que esté controlado por la madre, que andará cerca."],2],[4,489,"Sobre las normas éticas y deportivas en la caza:",["No dispararemos sobre aquellos ciervos de menos de 6 puntas a no ser que estemos practicando caza selectiva o de control.","Dispararemos sobre todo tipo de ciervos, ya que en determinadas zonas provocan numerosos daños agrícolas y forestales.","Dispararemos sobre todo tipo de ciervos, pero solo a los machos, la caza de hembras de ciervo está prohibida."],0],[4,490,"Sobre las normas éticas y deportivas en la caza. ¿Qué podemos hacer para beneficiar una determinada población de perdices?:",["Restringir zonas, horas e incluso días de caza si la presión cinegética a la que está sometida es excesiva.","Colocar trampas de todo tipo para capturar alimañas, que son las culpables de su disminución.","Hoy día poco puede hacerse. Simplemente disfrutar del poco tiempo que nos queda."],0],[4,491,"Sobre las normas éticas y deportivas en la caza. En caso de abatir un jabalí en una montería de las denominadas ‘matacuelga’, si una vez finalizada esta veo que nos separa un arroyo algo difícil de cruzar, ¿qué hago?:",["No intento cruzar pues no merece la pena poner en peligro mi integridad física por un jabalí cuya carne apenas tiene valor.","Intento cruzar y cobrar la pieza con ahínco ya que el posterior aprovechamiento de la carne de las piezas de caza forma parte de la actividad cinegética.","Ni me asomo. Lo dejo para que se lo coman los buitres y así hago una buena labor por dichos animales."],1],[4,492,"Sobre las normas éticas y deportivas en la caza. Al finalizar una cacería practicada en cuadrilla, como puede ser una batida de caza mayor:",["Colaboro en el cobro de las piezas especialmente aquellas que hubieran quedado heridas si así fuera necesario.","No se considerará finalizada la cacería hasta la puesta del sol, por tanto no me moveré del puesto hasta ese momento.","No colaboro si he estado cazando con arma de fuego. Mi función en ese caso es la de abatir al animal, no buscarlo."],0],[4,493,"Cuando disparemos con un arma de fuego:",["Debemos asegurarnos de que vamos a abatir a la pieza de caza.","El disparo ha de efectuarse de tal forma que desde nuestra posición visualicemos la zona del suelo donde impactaría el proyectil en caso de errar.","No es necesario que el disparo se efectúe de tal forma que desde nuestra posición visualicemos la zona del suelo donde se estrellaría el proyectil en caso de errar."],1],[4,494,"Cuando disparemos con un arma de fuego durante una montería o batida:",["Debemos asegurarnos de que vamos a abatir a la pieza de caza.","El disparo ha de efectuarse de tal forma que desde nuestra posición visualicemos simplemente la zona del cuerpo del animal donde queremos que impacte la bala.","Nunca lo haremos hacia un viso o zona donde no estemos seguros que la bala va a quedar enterrada en caso de errar el disparo."],2],[4,495,"Si durante la realización de un rececho caigo al suelo con el arma cargada debo:",["Comprobar que no se haya obstruido el arma para garantizar la seguridad y el buen desarrollo de la cacería.","Continuar cazando si no me ha pasado nada.","Cargar de nuevo el arma si esta se ha descargado del golpe."],0],[4,496,"¿Cuáles de las siguientes conductas negligentes pueden ser causa de un accidente?",["No mantener los cañones del arma limpios y no obstruidos.","Introducir munición de distinto calibre del correspondiente al arma o en malas condiciones.","Sendas respuestas anteriores son correctas."],2],[4,497,"Las armas deben dejarse:",["Fuera del alcance de los niños.","A la vista en el interior de los vehículos, siempre que los mismos estén cerrados.","Desenfundadas en el interior de los vehículos, siempre que los mismos estén cerrados."],0],[4,498,"Es obligatorio mantener las armas:",["Descargadas y en el maletero del vehículo con el que nos desplacemos desde nuestro domicilio al coto de caza y viceversa.","A la vista en el interior de los vehículos, siempre que los mismos estén cerrados.","Enfundadas en el interior de los vehículos, aunque estas permanezcan con munición en su interior, siempre que tengan activado el seguro."],0],[4,499,"¿Cuál es la tasa de alcohol permitida para cazar?",["En la actualidad no existe una tasa estipulada pero no debemos beber alcohol si vamos a utilizar un arma.","0’0.","Se aplica la misma normativa que a los conductores."],0],[4,500,"La ingesta de alcohol antes de cualquier actividad cinegética está prohibida:",["Sí, pero no durante la práctica de dicha actividad.","No está prohibido pero supone una conducta negligente.","Sí."],1]]},"E":{"name":"Extremadura","short":"Extremadura","src":"Manual del cazador de Extremadura","temas":["Introducción, Naturaleza y Gestión Cinegética","Especies de caza menor","Especies de caza mayor","Fauna no cinegética","Modalidades de caza","Legislación","Ética del cazador","Armas"],"q":[[0,1,"El gusto por la caza en la especie humana es:",["Una consecuencia de la vida moderna.","Un producto de la selección natural.","Una muestra de decadencia de la Sociedad Industrial."],1],[0,2,"La caza y la conservación de la naturaleza:",["Son actividades opuestas.","Son siempre incompatibles.","Son compatibles si existe una buena gestión."],2],[0,3,"El cazador:",["Debe preocuparse de la conservación de la naturaleza.","Debe defenderse frente a las tendencias conservacionistas.","Es completamente ajeno a la conservación de la naturaleza."],0],[0,4,"Un ecosistema es:",["Cualquier conjunto de animales y plantas.","Cualquier parcela del medio natural.","Una parcela del medio natural con cierta autonomía respecto al entorno."],2],[0,5,"El ecosistema incluye:",["Sólo el espacio físico, con independencia de las especies que lo pueblen.","Sólo las especies independientemente del lugar en que se encuentren.","Tanto las especies como el medio físico."],2],[0,6,"La Ecología es:",["Un movimiento político y social.","Una ciencia.","La naturaleza."],1],[0,7,"La Ecología se ocupa de:",["Las interacciones entre el hombre y las especies de caza.","Las interacciones entre los seres vivos y su medio ambiente.","Los procesos industriales de reciclado de residuos."],1],[0,8,"La biocenosis incluye:",["A los seres vivos de un ecosistema.","A los animales de un ecosistema.","Al medio físico de un ecosistema."],0],[0,9,"El biotopo incluye:",["A los seres vivos de un ecosistema.","A las plantas en un ecosistema.","Al medio físico de un ecosistema."],2],[0,10,"Se denomina especie:",["A todos los individuos presentes en un ecosistema.","A todos los individuos que de modo natural pueden reproducirse entre sí.","A los animales que se encuentran juntos en un mismo hábitat."],1],[0,11,"Se denomina subespecie:",["A toda especie de tamaño pequeño.","A los individuos que raramente se reproducen entre sí.","A un conjunto de individuos de la misma especie que habitan en un área determinada y que se diferencian del resto de la especie."],2],[0,12,"Se denomina población:",["A los individuos de la misma especie en un ecosistema.","A los animales de un ecosistema.","A las plantas de un ecosistema."],0],[0,13,"Se denomina comunidad:",["A los individuos de la misma especie en un ecosistema.","A un conjunto de especies en un ecosistema.","A los factores climáticos en un ecosistema."],1],[0,14,"Cuando un terreno se deja a su libre evolución ocurre un proceso denominado:",["Degeneración de la vegetación.","Sucesión ecológica.","Empobrecimiento del ecosistema."],1],[0,15,"Se denomina clímax:",["A la etapa final en la sucesión ecológica.","A las dehesas extremeñas.","A los terrenos de cultivo."],0],[0,16,"En el proceso de sucesión ecológica",["Unas especies son reemplazadas por otras.","El ecosistema tiende a la degeneración.","El terreno se va despoblando de vegetación."],0],[0,17,"La diversidad de especies a lo largo de la sucesión ecológica:",["Aumenta.","Disminuye.","Permanece constante."],0],[0,18,"La formación forestal típica de áreas húmedas superiores a 900 metros es:",["El Alcornocal.","El Robledal.","El Encinar."],1],[0,19,"Cuál de las siguientes formaciones forestales es típica de áreas más secas y bajas:",["El Alcornocal.","El Robledal.","El Encinar."],2],[0,20,"Las áreas de pastizales conocidas como La Serena y Llanos de Cáceres- Trujillo, proceden mayoritariamente de la degradación de:",["Robledales.","Alcornocales.","Encinares."],2],[0,21,"La etapa clímax de los bosques es escasa en Extremadura debido a:",["La acción de las especies cinegéticas.","La acción del hombre.","El clima de la región."],1],[0,22,"La actividad cinegética bien gestionada",["Disminuye la biodiversidad.","Puede contribuir a mantener la biodiversidad.","Reduce el número de especies en en ecosistema."],1],[0,23,"Una especie forma parte real de un ecosistema cuando:",["Se sueltan individuos de ella en el ecosistema.","Ha evolucionado en él.","Puede cazarse en esa zona."],1],[0,24,"La actividad del cazador afecta:",["Sólo a las especies de caza.","Sólo a las especies predadoras.","Indirectamente al ecosistema en su conjunto."],2],[0,25,"¿La actividad del cazador puede afectar a los predadores?",["Sí, porque supone un competidor para ellos.","Sólo cuando los controla directamente.","No les afecta."],0],[0,26,"¿Puede afectar la caza sobre una especie al equilibrio ecológico preexistente?",["Siempre.","Nunca.","Sólo si se caza ilegalmente."],0],[0,27,"Una migración es:",["Cualquier desplazamiento de los animales.","Los desplazamientos estacionales a larga distancia.","Las dispersiones y concentraciones en sus áreas de distribución."],1],[0,28,"Una especie que no realiza migraciones se denomina",["Sedentaria.","Invernante.","Nidificante."],0],[0,29,"Las causas últimas de las migraciones suelen ser",["La temperatura.","El fotoperíodo.","El alimento."],2],[0,30,"De modo ideal, la gestión cinegética sobre las aves migradoras",["No debería hacerse nunca.","Debería hacerse independientemente en cada región.","Debería hacerse conjuntamente por todas las regiones implicadas."],2],[0,31,"A lo largo de los años el impacto de la caza sobre las poblaciones naturales",["Ha aumentado.","Ha disminuido.","Se ha mantenido constante."],0],[0,32,"Gestión cinegética es:",["La tramitación de los permisos y licencias de caza.","La tramitación de los impuestos de los acotados.","El ordenamiento de los factores que afectan a la dinámica de las poblaciones de caza."],2],[0,33,"La gestión cinegética debe perseguir como objetivo:",["El aprovechamiento económico a corto plazo.","El máximo aprovechamiento sostenible aunque se deteriore el ecosistema.","Armonizar el aprovechamiento sostenible con la conservación del ecosistema."],2],[1,34,"Las orejas de la liebre:",["Son más grandes que las de los conejos y con la punta más clara que el resto.","Son similares a las de los conejos y con la punta de color negro.","Son más grandes que las de los conejos y con la punta de color negro."],2],[1,35,"La liebre tiene:",["Las patas anteriores más cortas que las posteriores.","Las cuatro patas iguales.","Las patas anteriores más largas que las posteriores."],0],[1,36,"En España ¿cuántas subespecies de liebre hay?",["Una.","Dos.","Tres."],2],[1,37,"El hábitat de la liebre es:",["Bosque caducifolio.","Zonas abiertas y bosques aclarados.","Lugares cercanos a los ríos."],1],[1,38,"Las liebres:",["Viven en grupos.","Se reúnen en grupos sólo durante el verano.","Son solitarios salvo en la época de celo."],2],[1,39,"Las liebres son de hábitos:",["Nocturnos principalmente.","Sobre todo diurnos.","Se muestran activos a cualquier hora del día."],0],[1,40,"La época de celo de la liebre se inicia en:",["Primavera.","Noviembre-Diciembre.","Agosto-Septiembre."],1],[1,41,"Las liebres pueden tener más de un parto por año",["Verdadero.","Falso.","Nunca antes de cumplir los cinco años."],0],[1,42,"Las orejas del conejo:",["Son largas y con la punta negra.","Son más cortas que las de la liebre.","Son cortas y con punta blanca."],1],[1,43,"El conejo es:",["Una subespecie del conejo doméstico.","Un conejo doméstico asilvestrado.","El antepasado del conejo doméstico."],2],[1,44,"La mixomatosis es una enfermedad que afecta a:",["Conejos.","Liebres.","Jabalíes."],0],[1,45,"La neumonía hemorrágico vírica es una enfermedad que afecta a:",["Liebres.","Jabalíes.","Conejos."],2],[1,46,"Los conejos viven:",["Solitarios.","Separados por sexos.","En grupos de ambos sexos (colonias)."],2],[1,47,"Los conejos alcanzan la madurez sexual:",["Al año.","A los 5-6 meses.","Al año y medio."],1],[1,48,"La alimentación del conejo es:",["Omnívora.","Carnívora.","Herbívora."],2],[1,49,"¿Cuántas crías por parto suelen tener los conejos?",["Una.","Dos.","Tres o más."],2],[1,50,"La gestación de las conejas suele durar",["Dos meses.","Un mes.","Cuatro meses."],1],[1,51,"Los hábitos del conejo son principalmente:",["Diurnos.","Nocturnos.","Durante la noche permanecen en sus madrigueras."],1],[1,52,"Las letrinas comunales son propias de:",["Conejos.","Liebres.","Zorros."],0],[1,53,"El zorro pertenece a la familia de los:",["Félidos.","Vivérridos.","Cánidos."],2],[1,54,"La distribución del zorro es:",["Cosmopolita, abarca toda la península.","Sólo se encuentra en puntos aislados de alta montaña.","Escasa, sólo se encuentra en Extremadura y Andalucía."],0],[1,55,"Con respecto a las áreas ocupadas por los zorros:",["Nunca se acerca a los núcleos urbanos.","Puede vivir en la periferia de núcleos rurales y urbanos.","Se acerca a los núcleos urbanos sólo en época de celo."],1],[1,56,"La alimentación del zorro:",["Es exclusivamente herbívora.","Es exclusivamente carnívora.","Es muy variada, aprovecha el recurso más abundante."],2],[1,57,"Los hábitos del zorro son principalmente:",["Diurnos.","Nocturnos.","Diurnos y crepusculares, permaneciendo encamados durante la noche."],1],[1,58,"Las deyecciones de zorro son fácilmente detectables en el campo, ya que las deposita:",["En una letrina comunal.","En un lugar elevado.","En una oquedad del terreno."],1],[1,59,"El celo del zorro tiene lugar en:",["Primavera.","Invierno.","Otoño."],1],[1,60,"¿Cuantas crías por parto suelen tener los zorros?",["Una.","Dos.","Tres o más."],2],[1,61,"El zorro puede transmitir:",["La rabia.","La trichinellosis.","La neumonía hemorrágica vírica."],0],[1,62,"El zorro es una especie:",["De caza mayor.","De caza menor.","Protegida."],1],[1,63,"Al ánade real se le llama también azulón por:",["Tener el pico azul.","Tener un espejuelo de color azul metálico en el ala.","Tener el cuello de color azul en plumaje nupcial."],1],[1,64,"El plumaje de las hembras de ánade real:",["Es similar al del macho en plumaje nupcial.","Es pardo jaspeado fuera de la época nupcial.","Es pardo jaspeado durante todo el año."],2],[1,65,"Las hembras de ánade real:",["Son de mayor envergadura que los machos.","Son de menor envergadura que los machos.","Son de igual envergadura que los machos."],1],[1,66,"Respecto a la distribución del ánade real podemos decir que ...",["Se encuentra por toda la península y Baleares.","Sólo se encuentra en las zona norte de España.","Es una especie típica de Castilla y Extremadura."],0],[1,67,"Los efectivos de ánades reales españoles en los meses de otoño e invierno:",["Se ven disminuidos por la migración de los patos a Europa.","Se ven aumentados por patos procedentes de Europa.","Su número prácticamente no varía."],1],[1,68,"Los ánades reales se alimentan:",["Fuera del agua casi siempre.","Sumergiendo todo el cuerpo y buceando.","Sumergiendo la parte anterior de su cuerpo."],2],[1,69,"En las grandes masas de agua y en los meses de otoño e invierno suele verse a los ánades reales:",["Solitarios.","En grupos de individuos de su misma especie.","En grupos mixtos con otras especies."],2],[1,70,"El número de huevos más usual que pone la hembra de ánade real es de:",["2-3.","7-12.","Más de 12."],1],[1,71,"Los pollos de ánade real:",["Salen del nido nada más nacer.","Permanecen en el nido dos semanas.","Salen del nido al tercer día de su nacimiento."],0],[1,72,"Las hembras de ánade real depositan sus huevos:",["En una masa de hojas muertas flotante que forma un montículo en mitad del agua.","En una zona húmeda entre la vegetación.","En un hueco del terreno."],1],[1,73,"Las fochas tienen el plumaje:",["Negro entero.","Negro sólo el dorso.","Negro entero salvo bajo la cola que es blanco."],0],[1,74,"Macho y hembra de focha:",["Difieren en el plumaje.","Tienen la misma coloración excepto en la época de cría.","Tienen la misma coloración siempre."],2],[1,75,"El escudo frontal y el pico de la focha son de color:",["Rojo.","Rojo y blanco respectivamente.","Blanco."],2],[1,76,"Los jóvenes de focha:",["Tienen la misma coloración que los adultos, por lo que pueden ser confundidos con ellos.","Son más coloreados que los adultos, por lo que pueden ser confundidos con jóvenes de pato.","Con de color gris pardo, por lo que pueden ser confundidos con jóvenes de somormujo."],2],[1,77,"Las fochas en vuelo pueden identificarse fácilmente:",["Porque dejan las patas estiradas hacia atrás.","Porque tienen una mancha alar azul.","Porque llevan su la
