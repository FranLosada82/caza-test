 aportados por el titular cinegético en las épocas de escasez de agua o alimentos o para evitar la dispersión de las poblaciones cinegéticas sedentarias:",["No se considerará práctica fraudulenta para atraer o espantar la caza, en ninguna situación.","No se considerará práctica fraudulenta para atraer o espantar la caza, siempre y cuando se realice a distancias superiores a 250 metros con respecto a los límites de los cotos colindantes y no afecte a especies migratorias en los lugares de paso.","No se considerará práctica fraudulenta para atraer o espantar la caza, siempre y cuando se realice a distancias superiores a 250 metros con respecto a los límites de los cotos colindantes."],1],[1,269,"Aquellos casos en que las piezas hayan sido atraídas como consecuencia de mejoras realizadas en el hábitat o espantadas mediante procedimientos y medios permitidos para proteger los cultivos u otros bienes:",["Son excluidos como práctica fraudulenta para atraer o espantar la caza.","Son considerados como práctica fraudulenta para atraer o espantar la caza.","Es considerada como práctica fraudulenta el atraer a las piezas, no el espantarlas."],0],[1,270,"La utilización como reclamo de aves cegadas o mutiladas:",["Puede ser autorizada por la Administración.","Está prohibida.","Está permitida de manera excepcional."],1],[1,271,"El uso de cimbeles en la caza de palomas:",["Está prohibido.","Está permitido siempre que éstos sean artificiales o sintéticos o bien los vivos accionados con un balancín pero nunca cegados o mutilados.","Está permitido sólo y exclusivamente en los terrenos libres."],1],[1,272,"La introducción en el medio natural de animales de especies de fauna no autóctona en el territorio de la Comunidad.",["Puede ser autorizada por la Administración.","Está permitida bajos determinadas condiciones.","Está prohibida."],2],[1,273,"La suelta sin autorización de aves para el adiestramiento de perros para la caza:",["Está prohibido.","Está permitido siempre y cuando lo realice en el área delimitada para dicha actividad.","Requiere de una licencia especial expedida por la federación de caza."],0],[1,274,"El titular de un coto de caza, en caso de estar interesado en realizar una suelta de perdiz, deberá poner especial atención:",["En la pureza genética de los ejemplares, ya que está totalmente prohibido realizar sueltas con ejemplares de especies distintas a la perdiz roja.","A la colocación de los puestos, estos deben separarse al menos 20 metros.","A la autorización pertinente que deberá tramitar en la Federación Autonómica."],0],[1,275,"La suelta de perdices criadas en cautividad:",["Está prohibida, a menos que el titular del acotado cuente con la autorización correspondiente.","Está permitido siempre y cuando sean perdices rojas sin previa autorización.","Está permitida en aquellos cotos con más de 500 hectáreas en cualquier caso."],0],[1,276,"Todas las instituciones, talleres y personas que practican actividades de taxidermia en la Comunidad de Madrid:",["Deberán llevar un libro de registro en el que constarán los datos referentes a los ejemplares de la fauna silvestre disecados total o parcialmente.","Únicamente podrán tener un máximo de 100 ejemplares en su taller, estando calificada como infracción administrativa grave la posesión de un número superior.","Están autorizadas a naturalizar cualquier espécimen y llevar un libro de registro en el caso de naturalizar más de 100 especímenes al año."],0],[1,277,"Cualquier práctica que tienda a chantear, atraer o espantar la caza existente en terrenos ajenos:",["Está permitida.","Está totalmente prohibida.","Puede ser autorizada."],1],[1,278,"La caza de perdiz con reclamo en la Comunidad de Madrid:",["Está totalmente prohibida.","Sólo se podrá practicar en época de celo.","Sólo se realizará con perdiz hembra."],0],[1,279,"El uso de reclamos electrónicos para la caza:",["Está prohibido.","Está permitido.","Requiere de una licencia especial."],0],[1,280,"El uso en la caza de dispositivos d
