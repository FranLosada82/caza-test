s machos de perdiz pueden incubar en un nido y la hembra en otro:",["A veces si.","No ocurre nunca.","Ocurre siempre."],0],[1,92,"Las perdices suelen anidar en:",["Árboles.","En el suelo, ocultando bien el nido.","En el suelo, entre la vegetación de las orillas de los ríos."],1],[1,93,"La perdiz roja o común puede hibridarse con :",["Otras especies de perdiz como por ejemplo la griega.","Los casos de hibridación son extremadamente raros.","La codorniz."],1],[1,94,"En la perdiz roja o común los dos sexos:",["Se parecen sólo en la época de celo.","Difieren en cuanto al plumaje.","Poseen la misma coloración."],2],[1,95,"Los pollos de perdiz pueden abandonar el nido:",["A las pocas horas de nacer.","A los dos días de nacer.","A la semana de nacer."],0],[1,96,"En la codorniz los dos sexos:",["Son similares.","Tienen coloraciones muy distintas.","Se parecen sólo en la época de celo."],0],[1,97,"El vuelo de las codornices es:",["Lento y muy alto.","Bajo y con rápido batir de alas.","Alto y con largos planeos."],1],[1,98,"La codorniz pertenece a las:",["Anátidas.","Columbiformes.","Gallináceas."],2],[1,99,"En la mayor parte de la península la codorniz tiene carácter:",["Migrador, está presente en verano.","Migrador, está presente en invierno.","Nunca migra."],0],[1,100,"En cuanto al hábitat la Codorniz prefiere:",["Áreas de matorral.","Áreas abiertas.","Alta montaña."],1],[1,101,"Los pollos de codorniz en los primeros estados de crecimiento son:",["Básicamente herbívoros.","Básicamente granívoros.","Básicamente insectívoros."],2],[1,102,"La codorniz sitúa sus nidos:",["Ocultos entre la hierba en una depresión del terreno.","Ocultos entre las hierba en un montículo del terreno.","En los árboles."],0],[1,103,"La codorniz gusta de los baños de:",["Lodo.","Agua.","Polvo."],2],[1,104,"La codorniz:",["Puede tener dos puestas al año.","Nunca hace una segunda puesta.","Puede tener hasta cinco puestas al año."],0],[1,105,"Los pollos de codorniz pueden abandonar el nido:",["A la semana de nacer.","A los dos días de nacer.","A las pocas horas de nacer."],2],[1,106,"En el faisán los dos sexos:",["Son similares.","Difieren notablemente.","Difieren en la época de celo."],1],[1,107,"Las formaciones carnosas de color rojo llamadas carúnculas de los faisanes son propias:",["Sólo de los machos.","Sólo de las hembras.","De ambos sexos."],0],[1,108,"El faisán es una especie:",["De origen africano introducida en nuestro país.","Propia de la Península Ibérica.","De origen asiático introducida en nuestro país."],2],[1,109,"¿El faisán se encuentra en Extremadura en libertad?:",["Muy frecuentemente.","A veces en los terrenos pseudoesteparios.","Rara vez y sólo en zonas donde ha sido introducido."],2],[1,110,"Los pollos de faisán son cuidados:",["Sólo por la madre.","Sólo por el padre.","Por ambos progenitores."],0],[1,111,"Los pollos de faisán abandonan el nido",["A los 12-14 días de nacer.","Al cabo de una semana.","A las pocas horas de nacer."],2],[1,112,"La cola de los faisanes es:",["Larga y puntiaguda.","Larga y redondeada.","Corta y puntiaguda."],0],[1,113,"¿Cuál de estas especies de paloma se distingue fácilmente por tener dos manchas blancas en el cuello?",["Torcaz.","Bravía.","Zurita."],0],[1,114,"Durante los meses de invierno la población de palomas torcaces en Extremadura:",["Se ve disminuida.","Permanece igual que en verano.","Se ve muy aumentada."],2],[1,115,"Durante el invierno la alimentación de las torcaces en Extremadura es básicamente:",["Bellotas.","Girasoles.","Aceitunas."],0],[1,116,"Los pollos de torcaz son cuidados:",["Sólo por la madre.","Sólo por el padre.","Por ambos progenitores."],2],[1,117,"Los pollos de paloma torcaz:",["Son nidífugos.","Son nidícolas.","Pueden volar a las dos semanas."],1],[1,118,"El número de huevos más usual en las puestas de paloma torcaz es de:",["2.","4.","Más de 4."],0],[1,119,"Fuera de la época de cría las palomas torcaces:",["Forman bandadas muy numerosas.","Son de carácter solitario.","Siempre forman grupos de no más de 10 individuos."],0],[1,120,"En la paloma torcaz los dos sexos:",["Son similares.","Difieren notablemente.","Difieren en la época de celo."],0],[1,121,"Los pollos de paloma torcaz en los primeros días de vida se alimentan principalmente de:",["Una secreción similar a la leche que segregan en el buche los padres.","Hierbas y semillas.","Insectos."],0],[1,122,"El nido de las torcaces:",["Está forrado con barro.","Son apenas algunos palitos entrecruzados.","Es una voluminosa masa de hojas secas y ramas."],1],[1,123,"El puerto de Tornavacas en la provincia de Cáceres es un punto importante para las palomas torcaces porque:",["Es un paso para su entrada en otoño.","Carece de importancia, es similar al resto de Extremadura.","Es un paso por su abundante vegetación."],0],[1,124,"La paloma torcaz suele situar sus nidos en:",["Árboles.","Oquedades.","Rocas."],0],[1,125,"El tamaño de la paloma zurita comparada con la paloma torcaz es:",["Mayor.","Menor.","Igual."],1],[1,126,"En la paloma zurita los dos sexos:",["Son similares.","Difieren notablemente.","Difieren en la época de celo."],0],[1,127,"En la Comunidad Autónoma extremeña las palomas zuritas:",["Están durante todo el año pero su número aumenta en verano.","Sólo están presentes en invierno.","Están durante todo el año pero su número aumenta en otoño e invierno."],2],[1,128,"La paloma zurita a menudo puede mezclarse con:",["Tórtolas.","Bandadas de perdices.","Palomas torcaces."],2],[1,129,"Las palomas zuritas pueden llegar a hacer el nido en madrigueras de conejos:",["Verdadero.","Falso.","Algunas palomas sí pero no la zurita."],0],[1,130,"En la paloma zurita ¿quién se encarga de la incubación?",["El padre.","La madre.","Ambos progenitores."],2],[1,131,"Los pollos de paloma zurita en los primeros días de vida se alimentan principalmente de:",["Hierbas y semillas.","Una secreción similar a la leche que segregan en el buche los padres.","Insectos."],1],[1,132,"¿Cuál de estas especies de palomas es más osc ntrales del día."],1],[3,389,"El lobo en Extremadura es una especie:",["Muy abundante pero difícil de encontrar.","No muy abundante pero se la puede ver con facilidad en terrenos abiertos.","Muy escasa y difícil de encontrar."],2],[3,390,"Comadreja, garduña y turón son mustélidos que se caracterizan por tener el cuerpo:",["Corto y rechoncho.","Largo y patas largas.","Largo, estrecho y flexible y patas cortas."],2],[3,391,"La presencia de nutrias en un río puede detectarse por:",["Sus típicos excrementos.","La forma de sus madrigueras.","Los enormes agujeros que excavan."],0],[3,392,"¿Cuál de estos mustélidos tiene los pies palmeados?",["Nutria.","Tejón.","Garduña."],0],[3,393,"Las dos especies de vivérridos presentes en Extremadura (gineta y meloncillo) son de origen:",["Asiático.","Típicamente españolas.","Africano."],2],[3,394,"El gato montés es:",["Un gato doméstico asilvestrado.","Una especie cinegética.","Una especie protegida."],2],[3,395,"En cuanto al tamaño el lince es:",["Mayor que un gato montés.","Mayor que un gato doméstico y menor que un gato montés.","Similar a un gato doméstico."],0],[3,396,"El lince está actualmente catalogado como una especie:",["De caza mayor.","De caza menor.","En peligro de extinción."],2],[3,397,"El pelaje del lince es:",["Rayado.","Moteado.","Gris uniforme."],1],[4,398,"Para la caza “al salto”:",["Se pueden llevar uno o dos perros.","La ley de caza no permite usar perros.","Hay que llevar 10 perros por cazador."],0],[4,399,"La caza “en mano” es similar a la modalidad de “al salto” pero:",["Sólo participan dos cazadores.","Con varios cazadores que se despliegan en línea.","Los cazadores tienen que rematar las piezas con la mano, es decir, con arma blanca."],1],[4,400,"La modalidad de “mano sobre mano” se llama así porque:",["Los cazadores pueden llevar dos escopetas.","Una vez recorrido el terreno se vuelve a recorrer en sentido opuesto.","Se recorre el terreno en sentido opuesto a las querencias de los animales."],1],[4,401,"La modalidad de “manos encontradas” debe detenerse:",["Cuando los cazadores de un lado vean las cabezas de los otros.","Cuando los perros no levanten piezas.","Cuando la aproximación de los dos grupos sea del orden del alcance de los disparos."],2],[4,402,"El habitáculo construido con ramas u otros materiales y en donde el cazador se oculta para tratar de sorprender a la pieza de caza se llama:",["Cimbel.","Puesto.","Tienda."],1],[4,403,"Desde un puesto fijo se pueden abatir:",["Patos.","Águilas.","Chorlitos."],0],[4,404,"La modalidad de “al paso” es típica para cazar",["Palomas y zorzales.","Zorros y conejos.","Fochas."],0],[4,405,"En las esperas de conejos los cazadores se sitúan:",["Lo más alejados posible de las madrigueras.","Cerca de las madrigueras.","Al lado de los bebederos."],1],[4,406,"Sobre qué especie se suele ejercer la modalidad de caza llamada “Ojeo”:",["Palomas.","Patos.","Perdices."],2],[4,407,"En los ojeos los secretarios son los encargados de:",["Apuntar el número de piezas abatidas.","Memorizar donde caen las piezas y cargar las escopetas.","Guiar a los batidores."],1],[4,408,"En los ganchos de conejos los batidores:",["Deben caminar muy rápido.","Tocan una caracola mientras caminan.","Pueden llevar escopeta."],2],[4,409,"La caza de liebre con galgos se practica más en:",["Navarra.","Levante.","Extremadura."],2],[4,410,"Seguir las persecuciones de los galgos a caballo es algo:",["Que no está permitido.","Que se hace a menudo.","Que no está bien visto por los cazadores."],1],[4,411,"La caza de perdiz con reclamo está:",["Regulada por la Orden General de Vedas.","Prohibida para las personas mayores.","Regulada por la ley 4/89."],0],[4,412,"Cuando el reclamo es pequeño se pueden utilizar cintas magnetofónicas para atraer a las perdices:",["Si.","No, está prohibido.","Sólo con causa justificada."],1],[4,413,"¿Cuál de estas especies puede cazarse en madriguera con ayuda de perros?",["Liebre.","Conejo.","Zorro."],2],[4,414,"En la caza de liebres con galgos:",["Los cazadores llevan armas.","Los cazadores sólo llevan armas si van a caballo.","Los cazadores no llevan armas."],2],[4,415,"La tórtola es un tiro muy apreciado de:",["Media veda.","Caza mayor.","Caza con cimbel."],0],[4,416,"La agachadiza común suele cazarse cerca de ríos y regatos:",["Desde un tonel sumergido.","Al salto.","En manos encontradas."],1],[4,417,"La caza de urracas:",["Está rígidamente regulada.","No está permitida.","Es flexible en cuanto a su normativa."],2],[4,418,"La “montería” es una modalidad de caza mayor:",["Típicamente española.","De origen inglés.","De origen alemán."],0],[4,419,"La mancha de monte a cazar se bate con la ayuda de perros organizados en:",["Rehalas o recovas.","Armadas.","Traviesas."],0],[4,420,"En las “monterías” suelen abatirse:",["Conejos y zorros.","Cabra montés.","Ciervos y Jabalíes."],2],[4,421,"En los “ganchos y batidas” los perreros:",["Pueden usar escopetas.","Pueden usar arma blanca para rematar.","Pueden llevar sólo rifles con mira telescópica."],1],[4,422,"En el “rececho”:",["Se suelen llevar de 4 a 5 perros.","Se suele hacer en solitario.","La línea de cazadores aguarda a que pasen las piezas."],1],[4,423,"El “aguardo nocturno” se suele practicar para abatir:",["Muflones.","Gamos.","Jabalíes."],2],[4,424,"La “ronda” es una modalidad que todavía se practica en:",["Andalucía.","Cataluña.","Extremadura."],2],[4,425,"Para el “vaqueo”",["Se esperan a las piezas desde antes de amanecer.","Se necesitan 4-5 perros.","Hacen falta dos secretarios y un perrero."],0],[4,426,"La “batida” es una modalidad de caza que se usa principalmente para la caza de:",["Jabalíes y zorros.","Gamos.","Arruis."],0],[4,427,"En la “ronda” la especie a cazar es:",["Arrui.","Gamo.","Jabalí."],2],[4,428,"La caza con arco es una modalidad:",["Prohibida en Extremadura.","Sólo permitida para el macho montés.","Decreciente introducción, pero permitida en Extremadura."],2],[4,429,"Los corzos suelen abatirse en la modalidad de:",["Montería.","Rececho.","Ronda nocturna."],1],[4,430,"De entre las siguientes, la modalidad de caza permitida para abatir machos de cabra montés es:",["Montería.","Rececho.","Ronda nocturna."],1],[4,431,"Muflón y arrui son dos especies cuya modalidad de caza más común suele ser:",["Rececho.","Vaqueo.","Montería."],0],[4,432,"Los perros cobradores:",["Se usan, principalmente, para cobrar aves acuáticas.","Se usan, principalmente, para cobrar especies de caza mayor.","Se usan, principalmente, para la caza de la liebre."],0],[4,433,"Los perros que se caracterizan por localizar las piezas escondidas en la vegetación por el olor que éstas desprenden, se denominan:",["Perros cobradores.","Perros de muestra o punta.","Perros de carrera."],1],[4,434,"Los perros que se emplean para la caza del zorro y del conejo, persiguiendo a estas piezas, introduciéndose en el interior de sus madrigueras, se denominan:",["Perros de carrera.","Perros de madriguera.","Perros de rastro."],1],[4,435,"Según la Ley de Caza de Extremadura, una rehala es un grupo de:",["De quince a veinte perros.","De Veinticinco a Treinta perros.","De Veinte a Treinta perros."],2],[4,436,"En Extremadura, a las rehalas de perros se las denominan también:",["Recovas.","Piaras.","Redichas."],0],[4,437,"Una montería puede contar:",["Una sola rehala.","Varias rehalas.","Siempre con cinco rehalas."],1],[5,438,"El derecho a cazar puede ejercerse a partir de la edad de:",["7 años.","14 años.","18 años."],1],[5,439,"¿Qué especies pueden ser objeto de caza?",["Sólo las definidas como piezas de caza.","Todas excepto las protegidas.","Todas las presentes en un acotado."],0],[5,440,"Los períodos hábiles para la caza aparecen",["En la Ley de Caza.","En la Constitución.","En la Orden General de Vedas."],2],[5,441,"¿Quién hace pública la Orden General de Vedas?",["Cada titular de coto.","El ministerio de Medio Ambiente.","La Junta de Extremadura."],2],[5,442,"¿Cuándo se hace pública la Orden General de Vedas?",["Una vez cada 5 años.","Cuando se cambia la Ley de Caza.","Cada año, antes del inicio de la temporada."],2],[5,443,"La relación de especies cazables aparece:",["En la Ley de Caza.","En la Constitución.","En la Orden General de Vedas."],2],[5,444,"El ejercicio de la caza está permanentemente prohibido en:",["Todos los terrenos sometidos a Régimen Cinegético Especial.","Vías y caminos de uso público, incluidas las vías pecuarias.","Terrenos de aprovechamiento cinegético común."],1],[5,445,"Los terrenos dedicados a caza menor sin ánimo de lucro, gestionados por un Club Deportivo de Cazadores se encuadran en:",["Terrenos de aprovechamiento cinegético común.","Cotos Privados de Caza.","Cotos Deportivos de Caza."],2],[5,446,"En los cotos deportivos, la autorización administrativa se otorgará a:",["Una Sociedad de Cazadores.","Un Club Deportivo de Cazadores.","Cualquier persona interesada en ella."],1],[5,447,"Los núcleos de excepcionales posibilidades cinegéticas gestionados por la Administración se encuadran en:",["Refugios de Caza.","Reservas Regionales de Caza.","Cotos Regionales de Caza."],1],[5,448,"Las vías y caminos de uso público son:",["Zonas de seguridad.","Zonas de caza controlada.","Refugios de caza."],0],[5,449,"Las zonas habitadas deben respetarse con un margen de seguridad de",["100 metros.","500 metros.","1000 metros."],1],[5,450,"En los terrenos cercados:",["Sólo puede cazar el propietario.","La caza está prohibida siempre.","La caza está prohibida excepto si está acogido a régimen cinegético especial."],2],[5,451,"La caza es una actividad industrial en",["Los terrenos sometidos a régimen cinegético especial.","Todos los acotados.","Los cotos privados de caza."],2],[5,452,"La propiedad de las piezas de caza menor corresponde",["A quien les dispara primero.","A quien les da muerte.","A quien las encuentra."],1],[5,453,"En caza mayor se entiende que la pieza ha sido abatida por el cazador que",["es autor de la primera sangre.","la remata.","está en el puesto más cercano a donde ha caído muerta la pieza."],0],[5,454,"Cazar en días de nieve",["Está prohibido siempre.","Está prohibido excepto en áreas de alta montaña.","Está permitido siempre y proporciona mayor fortuna al cazador."],1],[5,455,"La caza en terrenos sometidos a régimen cinegético especial",["Está permitida a todo cazador con licencia.","Está prohibida siempre.","Está permitida con la documentación preceptiva y el permiso en modelo oficial correspondiente."],2],[5,456,"El período diario en que se puede practicar la caza comprende",["Desde el amanecer al anochecer.","Desde una hora antes de la salida del sol hasta una hora después de la puesta.","Desde las 6 de la mañana hasta las 6 de la tarde."],1],[5,457,"La manipulación de crías o huevos de aves",["Está prohibida.","Está permitida durante el ejercicio de la caza.","Sólo está permitida a los cazadores con licencia de caza."],0],[5,458,"Cazar o transportar especies protegidas",["Está prohibido.","Está permitido durante el ejercicio de la caza.","Sólo está permitido a los cazadores con licencia de caza."],0],[5,459,"El uso de armas de fuego a los batidores, secretarios o perreros",["Está prohibido.","Está permitido durante el ejercicio de la caza.","Sólo les está permitido si poseen licencia de caza."],0],[5,460,"Los cartuchos vacíos se deben depositar",["En cualquier sitio en el campo.","En un montoncito en el puesto fijo.","En la basura."],2],[5,461,"Si en una mancha se lleva a cabo una montería",["No se debe cazar a menos de 1500 metros de ella.","Se puede cazar alrededor de ella para aprovechar la salida de piezas.","Se puede cazar cerca de ella aprovechando la salida de piezas, pero sólo por uno de los lados."],0],[5,462,"El uso de postas",["Está prohibido.","Está permitido en caza mayor.","Está permitido en caza menor."],0],[5,463,"En cotos colindantes, los ganchos, batidas o monterías deben realizarse separados por un período de al menos",["Dos días.","Cinco días.","Una semana."],1],[5,464,"Cuando un perro de caza ocasiona un daño, la responsabilidad es",["Del propio perro.","Del dueño.","Del dueño sólo en el caso de que carezca de licencia."],1],[5,465,"¿Las canales de caza mayor deben analizarse para detectar la presencia de Trichinella?",["Sí, siempre.","Sólo si lo indica el veterinario.","Sólo las de jabalí."],2],[5,466,"Deben identificarse mediante precintos previo a su transporte",["Todas las piezas de caza.","Todas las piezas de caza mayor.","Algunas piezas de caza mayor, si así lo requiere la guardería o el veterinario."],1],[5,467,"La catalogación de una especie en la categoría de “peligro de extinción” exigirá:",["La redacción de un plan de recuperación.","La redacción de un plan de conservación del hábitat.","La redacción de un plan de manejo."],0],[5,468,"La catalogación de una especie en la categoría de “sensibles a la alteración del hábitat” exigirá:",["La redacción de un plan de manejo.","La redacción de un plan de conservación del hábitat.","La redacción de un plan de conservación."],1],[5,469,"La catalogación de una especie en la categoría de “vulnerable” exigirá:",["La redacción de un plan de recuperación.","La redacción de un plan de conservación del hábitat.","La redacción de un plan de conservación."],2],[5,470,"Se considerarán especies amenazadas en Extremadura:",["Las del catalogo nacional de especies alteradas.","Las del catalogo de especies amenazadas de Extremadura.","Las del catalogo nacional de especies amenazadas y las del catalogo de especies amenazadas de Extremadura."],2],[5,471,"En el catálogo de especies amenazadas se incluyen:",["Especies y subespecies de fauna salvaje.","Especies, subespecies y poblaciones.","Sólo especies."],1],[5,472,"Los corredores ecoculturales son:",["Un plan especial.","Unas normas de conservación.","Un plan de gestión."],0],[5,473,"Los planes de ordenación de los recursos naturales tendrán al menos:",["La identificación de los caminos y vías pecuarias dentro del espacio Natural del que se trate.","La identificación de vías pecuarias dentro del espacio Natural del que se trate.","La identificación de los caminos dentro del espacio Natural del que se trate."],0],[5,474,"Los planes de ordenación de los recursos naturales tendrán al menos:",["Medidas para defender, mejorar y restaurar el medio natural.","Medidas para defender y delimitar el medio natural.","Medidas para mejorar y delimitar el medio natural."],0],[5,475,"La zonificación de un espacio natural contendrá:",["Zonas de uso general.","Zonas de Uso Incompatible.","Zonas de uso no autorizado."],0],[5,476,"¿Que consideración tienen los enclaves?",["Terreno cinegético especial.","Zona de seguridad.","Terreno cinegético común."],2],[5,477,"Los enclaves tendrán una superficie:",["Inferior a 250 hectáreas.","Inferior a 400 hectáreas.","Inferior a 150 hectáreas."],0],[5,478,"En las márgenes de las carreteras, los caminos y vías pecuarias, así como en las vías férreas y en los cauces de los ríos, arroyos y canales que atraviesen o limiten terrenos sometidos a Régimen Cinegético Especial, el ejercicio de la caza...",["Es libre.","Deberá ser autorizado, en cada caso, por la Dirección General con competencias en materia de caza.","Está totalmente prohibido en todos los casos, sin que pueda autorizarse la caza en los mismos."],1],[5,479,"Para obtener la correspondiente autorización administrativa para la constitución de un Coto Privado de Caza Mayor, los terrenos deberán reunir una superficie mínima de:",["500 hectáreas.","400 hectáreas.","600 hectáreas."],0],[5,480,"Para obtener la correspondiente autorización administrativa para la constitución de un Coto Privado de Caza Menor, los terrenos deberán reunir una superficie mínima de:",["500 hectáreas.","400 hectáreas.","600 hectáreas."],1],[5,481,"En los cotos deportivos que no tengan carácter local...",["No podrán realizarse aprovechamientos de caza mayor.","Podrán realizarse aprovechamientos de caza mayor y de caza menor.","No podrán realizarse aprovechamientos de caza menor."],0],[5,482,"Como norma de seguridad en beneficio de los cazadores, en los ojeos de caza menor y en las tiradas de tórtolas, palomas y aves acuáticas, deberán colocarse los puestos guardando entre sí una distancia:",["Mínima de treinta metros.","Mínima de cincuenta metros.","Mínima de cuarenta metros."],1],[5,483,"En todas las acciones cinegéticas organizadas y en las desarrolladas en puesto fijo, salvo en las tiradas de aves acuáticas, los puestos no podrán colocarse:",["A menos de treinta metros de la linde de otros terrenos sometidos a régimen cinegético especial si no existe una autorización previa y escrita de los titulares afectados.","A menos de cien metros de la linde de otros terrenos sometidos a régimen cinegético especial si no existe una autorización previa y escrita de los titulares afectados.","A menos de doscientos cincuenta metros de la linde de otros terrenos sometidos a régimen cinegético especial si no existe una autorización previa y escrita de los titulares afectados."],1],[5,484,"Salvo indicación expresa en contrario, los ojeadores o batidores no deberán acercarse:",["A menos de 100 metros de las posiciones de tiro de los cazadores.","A menos de 25 metros de las posiciones de tiro de los cazadores.","A menos de 50 metros de las posiciones de tiro de los cazadores."],2],[5,485,"En las monterías, batidas y ganchos cuando los puestos no puedan colocarse de modo que queden siempre desenfilados o protegidos de los disparos de los demás cazadores, procurando aprovechar, a tal efecto, los accidentes del terreno:",["Los puestos deberán situarse a más de ciento setenta metros.","Los puestos deberán situarse a más de ciento cincuenta metros.","Los puestos deberán situarse a más de ciento veinte metros."],1],[5,486,"Los Agentes del Medio Ambiente y los Agentes Forestales:",["No tienen la consideración de agentes de la autoridad.","Tienen la consideración de agentes de la autoridad.","Tienen la consideración de miembros de fuerzas de seguridad."],1],[5,487,"Los actos de los Agentes del Medio Ambiente y los Agentes Forestales:",["Gozan de la presunción de veracidad.","Siempre tienen la razón.","Gozan de la presunción de ilegalidad."],0],[5,488,"La multa se reducirá automáticamente cuando el presunto infractor, en cualquier momento del procedimiento antes de la finalización del periodo de alegaciones a la propuesta de resolución, muestre por escrito su conformidad con la sanción y medidas accesorias acordadas, en una cuantía del...",["15 %.","20 %.","10 %."],0],[5,489,"Las infracciones leves contra lo dispuesto en la Ley de Caza de Extremadura, serán sancionadas con multa...",["Comprendida entre 60,10 y 150,26 Euros.","Comprendida entre 30,05 y 300,50 Euros.","Comprendida entre 30,05 y 150,26 Euros."],0],[5,490,"Las infracciones menos graves contra lo dispuesto en la Ley de Caza de Extremadura, serán sancionadas con multa...",["Comprendida entre 60,10 y 300,50 Euros.","Comprendida entre 150,26 y 601,01 Euros.","Comprendida entre 300,26 y 601,01 Euros."],1],[5,491,"Las infracciones graves contra lo dispuesto en la Ley de Caza de Extremadura, serán sancionadas con multa...",["Comprendida entre 300,26 y 601,01 Euros.","Comprendida entre 601,02 y 6.010,11 Euros.","Comprendida entre 300,26 y 6.010,11 Euros."],1],[5,492,"Las infracciones muy graves contra lo dispuesto en la Ley de Caza de Extremadura, serán sancionadas con multa...",["Comprendida entre 300,26 y 6.010,11 Euros.","Comprendida entre 601,02 y 60.010,11 Euros.","Comprendida entre 6.010,13 y 60.101,21 Euros."],2],[5,493,"Abatir o intentar abatir una pieza de caza levantada y perseguida por otro cazador en un terreno de aprovechamiento cinegético común, según la Ley de Caza de Extremadura, constituye una infracción:",["Menos Grave.","Menos Leve.","Leve."],2],[5,494,"Cazar con armas accionadas por aire u otros gases comprimidos, según la Ley de Caza de Extremadura, constituye una infracción:",["Grave.","Menos Grave.","Leve."],2],[5,495,"En el transcurso de una acción de caza, cruzar o deambular por una zona de seguridad cuando se lleven armas desenfundadas y dispuestas para su empleo, pero sin hacer uso de ellas, según la Ley de Caza de Extremadura, constituye una infracción:",["Muy Grave.","Menos Grave.","Leve."],2],[5,496,"Colocar, alterar o suprimir la señalización cinegética de un terreno sin ser titular del mismo o sin estar autorizado por él, según la Ley de Caza de Extremadura, constituye una infracción:",["Leve.","Menos Grave.","Grave."],1],[5,497,"Cazar sin poseer la licencia de caza, según la Ley de Caza de Extremadura, constituye una infracción:",["Grave.","Leve.","Menos Grave."],2],[5,498,"Cazar a pesar de estar inhabilitado para ello por una resolución ejecutiva, ya sea judicial o administrativa, según la Ley de Caza de Extremadura, constituye una infracción:",["Leve.","Menos Grave.","Grave."],1],[5,499,"Falsear los datos en la solicitud de la licencia de caza, según la Ley de Caza de Extremadura, constituye una infracción:",["Leve.","Menos Grave.","Grave."],1],[5,500,"Poseer licencia de caza estando inhabilitado para ello, así como no entregarla a la Administración, tras el requerimiento y el emplazamiento de diez días posterior a la inhabilitación, según la Ley de Caza de Extremadura, constituye una infracción:",["Menos Grave.","Grave.","Muy Grave."],0],[5,501,"Cazar sin autorización fuera del periodo comprendido entre una hora antes de la salida del sol y una hora después de su puesta, según la Ley de Caza de Extremadura puede conllevar una multa:",["Comprendida entre 60,10 y 300,50 Euros.","Comprendida entre 150,26 y 601,01 Euros.","Comprendida entre 300,26 y 601,01 Euros."],1],[5,502,"La tenencia o comercialización de piezas de caza vivas o muertas, en periodo hábil de caza, sin cumplir los requisitos legales o reglamentarios exigibles, según la Ley de Caza de Extremadura puede conllevar una multa:",["Comprendida entre 60,10 y 300,50 Euros.","Comprendida entre 150,26 y 601,01 Euros.","Comprendida entre 300,26 y 601,01 Euros."],1],[5,503,"Cazar sin autorización a menos de mil quinientos metros de distancia de la mancha en la que se esté celebrando una cacería de caza mayor, según la Ley de Caza de Extremadura puede conllevar una multa:",["Comprendida entre 300,26 y 601,01 Euros.","Comprendida entre 60,10 y 300,50 Euros.","Comprendida entre 150,26 y 601,01 Euros."],2],[5,504,"Recoger desmogues en terrenos sometidos a régimen cinegético especial sin la autorización previa y escrita del titular de los aprovechamientos, según la Ley de Caza de Extremadura, constituye una infracción:",["Leve.","Menos Grave.","Grave."],1],[5,505,"Cazar en terrenos sometidos a régimen cinegético especial que no sean parques naturales o refugios de caza sin autorización del titular o sin el permiso necesario, siempre que por los medios utilizados ello no pueda tener una consideración menos grave aprovechamientos, según la Ley de Caza de Extremadura, constituye una infracción:",["Leve.","Muy Grave.","Grave."],2],[5,506,"Cazar en época de veda o fuera de los periodos o días hábiles autorizados administrativamente, según la Ley de Caza de Extremadura, constituye una infracción:",["Menos Grave.","Muy Grave.","Grave."],2],[5,507,"Cazar sin autorización animales no definidos por la Ley como piezas de caza, según la Ley de Caza de Extremadura, constituye una infracción:",["Menos Grave.","Grave.","Muy Grave."],1],[5,508,"Según la Ley de Caza de Extremadura, ¿Qué tipo de infracción administrativa constituye cazar con armas sin tener vigente el contrato de seguro obligatorio de responsabilidad civil del cazador?",["Leve.","Menos Grave.","Grave."],2],[5,509,"La instalación o el empleo en las armas de sistemas de visión pasiva basados en la intensificación de la luz, puede conllevar una sanción con multa:",["Comprendida entre 300,26 y 601,01 Euros.","Comprendida entre 601,02 y 6.010,11 Euros.","Comprendida entre 300,26 y 6.010,11 Euros."],1],[5,510,"Negarse a las inspecciones de los Agentes de la Autoridad para el examen de morrales, cestos, sacos, armas, vehículos u otros útiles o medios, puede ser sancionado con multa:",["Comprendida entre 300,26 y 601,01 Euros.","Comprendida entre 601,02 y 6.010,11 Euros.","Comprendida entre 300,26 y 6.010,11 Euros."],1],[5,511,"Negarse a cumplir el requerimiento de los Agentes de la Autoridad de detener un vehículo automóvil en un camino rural al objeto de ser inspeccionado para vigilar el cumplimiento de la normativa cinegética, constituye una infracción administrativa calificada como:",["Menos Grave.","Grave.","Muy Grave."],1],[5,512,"Cazar en un parque natural sin autorización, constituye una infracción administrativa calificada en la Ley de Caza de Extremadura como:",["Menos Grave.","Grave.","Muy Grave."],2],[5,513,"Celebrar una acción cinegética que requiera autorización sin contar con ella, constituye una infracción administrativa calificada como:",["Menos Grave.","Grave.","Muy Grave."],2],[5,514,"Las infracciones muy graves contra lo dispuesto en la Ley de Caza de Extremadura, prescriben:",["Al año.","A los dos meses.","A los cuatro años."],2],[5,515,"Las infracciones Leves contra lo dispuesto en la Ley de Caza de Extremadura, prescriben:",["A los dos meses.","A los seis meses.","Al año."],0],[5,516,"Las infracciones Menos Graves contra lo dispuesto en la Ley de Caza de Extremadura, prescriben:",["A los dos meses.","A los seis meses.","Al año."],1],[5,517,"Las infracciones Graves contra lo dispuesto en la Ley de Caza de Extremadura, prescriben:",["A los seis meses.","Al año.","A los dos años."],1],[5,518,"Los PORN presentan la siguiente zonificación:",["Uso restringido, Uso limitado, Uso compatible.","Uso limitado, Uso compatible.","Uso restringido, Uso limitado, Uso compatible, Uso general."],2],[5,519,"Los espacios naturales representan:",["9 categorías.","12 categorías.","10 categorías."],2],[5,520,"Se facilitará la entrada de visitantes en:",["Reservas Naturales.","No se facilita la entrada en los espacios naturales.","Parques Naturales."],2],[5,521,"En los Parques Naturales está prohibido con carácter permanente:",["El ejercicio de la caza.","El control de poblaciones.","Pernoctar."],0],[5,522,"En las Reservas Naturales está limitado:",["La explotación de recursos.","La recolección de material biológico.","La recolección de material geológico."],0],[5,523,"Las formaciones de notoria singularidad, rareza o belleza, se cataloga como:",["Parque Natural.","Parque periurbano de Conservación y Ocio.","Monumento Natural."],2],[5,524,"Pueden coexistir varias figuras de protección:",["Siempre.","Nunca.","Sólo si así se determina por el director técnico."],0],[5,525,"La Red de Espacios Protegidos está compuesta por:",["Los Espacios Naturales declarados como tal.","Los Espacios Naturales declarados como tal y los no declarados pero que cuenten con tal reconocimiento a nivel supraregional.","Los de la Directiva hábitat."],1],[5,526,"Contarán con un centro de información",["Los Parques Naturales, Las Reservas Naturales y Paisajes Naturales.","Los Parques periurbanos.","La consejería de Medio Ambiente."],0],[5,527,"Se consideran especies amenazadas en Extremadura",["Las del catálogo nacional de Especies amenazadas.","Las que se incluyan en el catálogo de Especies Amenazadas de Extremadura.","A y b son correctas."],2],[5,528,"La Clasificación de Especies Amenazadas de Extremadura es:",["En Peligro de Extinción, Sensibles al cambio del medio, Vulnerables, de interés especial y extinguidas.","En Peligro de Extinción, Sensibles a la alteración del hábitat, Vulnerables, de interés especial y extinguidas.","En Peligro de Extinción, Sensibles al cambio del medio, Vulnerables, de interés único y extinguidas."],1],[5,529,"Se exigirá un plan de Recuperación en las siguientes categorías:",["Peligro de extinción.","De interés único.","Extinguidas."],0],[5,530,"Se exigirá un plan de Conservación de Hábitat:",["De interés único.","Extinguidas.","Ninguna es verdadera."],2],[5,531,"Se exigirá un plan de Protección y mejora en las siguientes categorías:",["De interés único.","Extinguidas.","Vulnerables."],2],[5,532,"Se exigirá un plan de Manejo en las siguientes categorías:",["Peligro de extinción.","De interés especial.","Extinguidas."],1],[5,533,"La multa grave en infracciones contra lo dispuesto en la Ley 8/1998, de 26 de junio, de Conservación de la Naturaleza y Espacios Naturales de Extremadura, es de:",["Multa de 60.101’22 a 300.506’05 Euros.","Multa de 6.010’13 a 60.101’21 Euros.","Multa de 60’10 a 6.010’12 Euros."],2],[5,534,"¿Cuál es el instrumento genérico de planificación en el ámbito regional?",["Directrices básicas de ordenación de los recursos naturales.","Plan de ordenación de los recursos naturales.","Plan rector de uso y gestión."],0],[5,535,"A quien corresponde aprobar los planes de ordenación de los recursos naturales PORN:",["Al Consejero de Agricultura y Medio Mmbiente.","Al Consejero de Medio Ambiente, Urbanismo y Turismo.","Al Consejo de Gobierno de la Junta de Extremadura."],2],[5,536,"Cual es el órgano unipersonal de gestión preceptivo en el caso de Parques Naturales y Reservas Naturales",["La Dirección General de Medio Ambiente.","El Consejo Asesor de Medio Ambiente.","El Director Técnico."],2],[6,537,"En el caso de que no sea probable cobrar la pieza, ¿Debe dispararse sobre ella?",["Sí, porque en caso de alcanzarle el disparo se considera como trofeo aunque no se cobre.","Sí, porque es posible que al final se cobre por parte de otro cazador.","No."],2],[6,538,"Si al avistar una pieza consideramos que la munición en nuestra arma es insuficiente para abatirla, debemos",["Disparar siempre por si acaso podemos cobrarla.","Disparar dos tiros en lugar de uno.","No disparar."],2],[6,539,"Si hemos herido una pieza, debemos",["Tratar de cobrarla siempre.","Tratar de cobrarla si la pieza merece la pena.","Dejarla ir por si se recupera."],0],[6,540,"Cuando las condiciones naturales disminuyen gravemente las posibilidades de defensa de los animales, debemos",["Renunciar a cazar.","Aprovechar las circunstancias para cazar.","Cazar el mayor número posible de piezas."],0],[6,541,"El cazador, ante una situación de conflicto entre el ejercicio de la caza y la conservación de las especies, debe optar por",["La caza, ya que es su misión.","La conservación de las especies.","Primero la caza y luego, si es posible, ayudar a la conservación."],1],[6,542,"Si durante una jornada de caza nos encontramos un ejemplar de especie protegida herida debemos",["Rematarlo para evitarle sufrimientos.","No acercarnos a él, para que no se nos acuse de posible falta.","Recogerlo y entregarlo a los agentes de la autoridad."],2],[6,543,"Si encontramos un ave anillada muerta, debemos",["No tocarla, ya que se trata de material científico.","Recogerla y entregar la anilla a los agentes de la autoridad.","Enterrarla sin quitarle la anilla."],1],[6,544,"Cuando el cazador detecta algún problema sanitario en las piezas de caza debe",["No cazar.","Comunicarlo a los agentes de la autoridad.","Silenciar el hecho para no causar alarma."],1],[6,545,"Los vallados cinegéticos",["Sirven para impedir el movimiento de las especies de caza mayor.","Sirven para impedir el movimiento de ciertas especies protegidas.","Sirven para que las piezas de caza mayor no puedan escapar de las monte-rías y ganchos."],0],[6,546,"Si un agente nos interviene el arma y estamos convencidos de que se trata de un error por su parte, debemos",["Discutir hasta convencerle.","Negarnos a entregarle el arma.","Entregarle el arma y después recurrir."],2],[6,547,"Si en la zona existen animales domésticos, el cazador deberá",["Evitar molestarlos.","Exigir al propietario que los retire.","Espantarlos antes de iniciar la caza."],0],[6,548,"Si un guarda de caza nos pide que le mostremos el morral, ¿deberemos acceder a ello?",["No, a menos que hayamos infringido alguna norma.","Sí, siempre.","No, sólo si se trata de un agente de la Guardia Civil o de la Junta de Extremadura."],1],[6,549,"Si un guarda nos pide que le mostremos la munición, ¿debemos acceder a ello?",["No, a menos que hayamos infringido alguna norma.","Sí, siempre.","No, sólo si se trata de un agente de la Guardia Civil."],1],[6,550,"Si un agente nos pide que le mostremos la documentación, ¿Debemos acceder a ello?",["No, a menos que hayamos infringido alguna norma.","Sí, siempre.","Sólo si se trata de un agente de la Guardia Civil."],1],[6,551,"Si un cazador ve acercarse a un agente, deberá",["Evitarle en lo posible.","Seguir cazando en sentido contrario al agente.","Esperarle."],2],[6,552,"Si el cazador descubre a un predador, deberá",["Tratar de dispararle para contribuir a la buena gestión de la caza.","No dispararle, excepto si está autorizado.","Dispararle siempre que no interfiera con la acción de caza que se lleva a cabo."],1],[6,553,"¿Puede practicarse el tiro al blanco en la zona donde se desarrolla una acción cinegética?",["Sí, pero estando de acuerdo todos los participantes.","No, nunca.","Sí, pero sólo una vez finalizada la acción cinegética."],1],[6,554,"¿Puede realizarse el adiestramiento de perros fuera del período hábil para la caza?",["No.","Sí, pero sólo en los acotados para los cuáles tenga permiso el propietario del perro.","Sí, pero sólo en los campos preparados para ese fin."],2],[6,555,"¿Deben arrojarse los cartuchos vacíos al campo?",["Sí, pero bien repartidos.","Sólo en las masas de agua, de modo que no queden a la vista.","No."],2],[6,556,"Para el tiro al blanco deben utilizarse",["Las señales viejas de los acotados.","Los troncos de árbol en las zonas donde se practica la caza.","Sólo los campos preparados a ese fin."],2],[6,557,"Cuando el cazador advierta la presencia de otras personas en la zona deberá",["Seguir cazando sin más si la zona es un acotado en el cual tiene derecho a ello.","Informarles de su actividad y tratar de llegar a un acuerdo.","Informarles de su actividad, pero en caso de desacuerdo el cazador tiene todo el derecho a cazar y las demás personas deberán retirarse."],1],[6,558,"En las zonas muy frecuentadas por visitantes",["Se evitará cazar, a menos que exista un acuerdo que garantice la seguridad y la posibilidad de uso de la zona por parte de los visitantes.","Se cazará igualmente pero advirtiéndoles.","Basta con comenzar la acción antes de la llegada de los visitantes."],0],[7,559,"Las armas permitidas para la caza son:",["Todas las armas de fuego.","Algunas armas de fuego, arcos, ballestas y cuchillos.","Todas las armas de fuego y arcos y ballestas."],1],[7,560,"Las armas de fuego permitidas para la caza son:",["Todas.","Sólo las de largas de ánima lisa.","Las escopetas y los rifles."],2],[7,561,"Se denomina escopetas",["A cualquier arma destinada a la caza.","A las armas largas de ánima lisa fabricadas para la caza.","A las armas largas de ánima rayada fabricadas para la caza."],1],[7,562,"Se conoce como rifle",["A cualquier arma destinada a la caza mayor.","A las armas largas de ánima lisa fabricadas para la caza.","A las armas largas de ánima rayada fabricadas para la caza."],2],[7,563,"Las armas de fuego utilizadas para la caza menor son",["Las escopetas y a veces los rifles.","Sólo las escopetas.","Sólo los rifles."],1],[7,564,"Las armas de fuego utilizadas para la caza mayor son",["Los rifles y a veces las escopetas.","Sólo las escopetas.","Sólo los rifles."],0],[7,565,"Una escopeta en la cual ambos cañones se encuentran uno al lado del otro se denomina",["Yuxtapuesta.","Superpuesta.","Monotiro."],0],[7,566,"Una escopeta en la cual ambos cañones se encuentran uno encima del otro se denomina",["Yuxtapuesta.","Superpuesta.","Monotiro."],1],[7,567,"Una escopeta que produce un disparo sucesivo por cada movimiento del gatillo se denomina",["Automática.","Semiautomática.","Monotiro."],1],[7,568,"El número máximo de disparos sucesivos que puede realizar según la normativa actual una escopeta semiautomática es:",["Tres.","Cinco.","Depende de los tipos y marcas."],0],[7,569,"El bloque central de una escopeta donde se alojan los mecanismos de disparo y cierre se denomina",["Culata.","Báscula.","Guardamanos."],1],[7,570,"¿Qué es el choke?",["La parte posterior de un cartucho de caza.","El estrechamiento del extremo de los cañones.","El elemento de plástico en forma de copa que contiene los perdigones."],1],[7,571,"El calibre de una escopeta es:",["Su peso.","El diámetro del ánima.","El diámetro de los perdigones."],1],[7,572,"¿Cuál de los siguientes calibres es mayor?",["12.","16.","20."],0],[7,573,"¿Cuál de los siguientes calibres es mayor?",["12 mm.","16.","12."],2],[7,574,"¿Cuál de los siguientes calibres es mayor?",["20.","16.","12 mm."],1],[7,575,"¿Qué es el culote?",["La parte posterior de una escopeta.","La parte posterior de un cartucho.","El elemento de plástico en forma de copa que aloja los perdigones."],1],[7,576,"Según la normativa vigente, los cartuchos de escopeta de caza pueden contener como proyectil",["Sólo perdigones.","Perdigones y balas.","Perdigones, balas y postas."],1],[7,577,"¿Cuál de los siguientes perdigones es de menor tamaño?",["4.","5.","cero."],1],[7,578,"¿Cuál de los siguientes perdigones es de menor tamaño?",["6.","doble cero.","cero."],0],[7,579,"¿Cuál de los siguientes perdigones es de mayor tamaño?",["5.","6.","7."],0],[7,580,"¿Cuál de los siguientes tamaños de perdigón es más adecuado para cazar conejos?",["3.","6.","10."],1],[7,581,"¿Cuál de los siguientes tamaños de perdigón es más adecuado para cazar zorzales?",["3.","6.","10."],2],[7,582,"La vaina de los cartuchos de rifle es",["De plástico.","De cartón.","Metálica."],2],[7,583,"Los rifles se emplean",["Para caza mayor.","Para caza menor.","Para caza mayor y menor."],0],[7,584,"La distancia máxima a la que puede hacer blanco un rifle es",["entre 50 y 100 metros.","entre 100 y 200 metros.","unos 300 metros."],2],[7,585,"En un rifle de acción normal o de repetición",["Cada cartucho se introduce basculando como en las escopetas de caza.","Cada cartucho se introduce en la recámara mediante una palanca o ce--rrojo.","Cada cartucho se introduce en la recámara al apretar el gatillo."],1],[7,586,"Un rifle que puede realizar disparos sucesivos al accionar repetidamente el gatillo se denomina",["Automático.","Semiautomático.","De repetición."],1],[7,587,"El número máximo de disparos sucesivos que puede realizar según la normativa actual un rifle es:",["Tres.","Cinco.","Depende de los tipos y marcas."],0],[7,588,"El calibre de los rifles de caza es",["Su peso.","La longitud de la bala.","El diámetro de la bala."],2],[7,589,"Para el ejercicio de la caza con armas de fuego ¿Es necesario portar la guía de pertenencia del arma?",["No.","Si.","En algunos casos."],1],[7,590,"Para el ejercicio de la caza con armas de fuego ¿Es necesario portar el seguro del cazador?",["No.","Si.","En algunos casos."],1],[7,591,"Para el ejercicio de la caza con armas de fuego ¿Es necesario portar el D.N.I.?",["No, basta con la licencia de caza.","Si, siempre.","En algunos casos."],1],[7,592,"El uso y tenencia de escopetas de caza requiere de",["Licencia de armas.","Tarjeta de armas.","Ninguna de las anteriores."],0],[7,593,"El uso y tenencia de rifles de caza requiere de",["Licencia de armas.","Tarjeta de armas.","Ninguna de las anteriores."],0],[7,594,"Una licencia de armas tipo D permite como máximo",["5 rifles.","5 escopetas.","3 rifles."],0],[7,595,"Una licencia de armas tipo E permite como máximo",["6 rifles.","6 escopetas.","3 escopetas."],1],[7,596,"Deben pasar revista ante la Intervención de Armas de la Guardia Civil",["Los rifles.","Las escopetas.","Tanto los rifles como las escopetas."],2],[7,597,"Los rifles deben pasar revista de armas ante la Intervención de la Guardia Civil",["Cada año.","Cada tres años.","Cada cinco años."],1],[7,598,"Las escopetas deben pasar revista de armas ante la Intervención de la Guardia Civil",["Cada año.","Cada tres años.","Cada cinco años."],2],[7,599,"Cuando durante una partida de caza se producen daños y no consta el autor de los mismos, la responsabilidad es",["Del cazador más antiguo de la partida de caza.","De todos los componentes de la partida de caza, solidariamente.","De la Junta de Extremadura, subsidiariamente."],1],[7,600,"Los arcos y ballestas",["Son ilegales para la caza.","Son armas legales para la caza.","Son legales sólo en determinadas zonas de Extremadura."],1],[7,601,"¿Deben documentarse los arcos?",["Sí, mediante guía de pertenencia y licencia de armas expedida por la Guardia Civil.","Sí, mediante una tarjeta de armas expedida por el alcalde del municipio de residencia.","No, no necesitan documentación."],2],[7,602,"¿Deben documentarse las ballestas?",["Sí, mediante guía de pertenencia y licencia de armas.","Sí, mediante una tarjeta de armas expedida por el alcalde del municipio de residencia.","No, no necesitan documentación."],0],[7,603,"¿Deben documentarse las armas blancas?",["Sí, mediante un permiso especial de armas expedido por la Guardia Civil.","Sí, mediante una tarjeta de armas expedida por el alcalde del municipio de residencia.","No, no necesitan documentación."],2],[7,604,"¿Pueden prestarse las armas de fuego?",["No nunca.","Sí, mediante autorización escrita.","Sí, sin necesidad de mediar documentación alguna."],1],[7,605,"¿Pueden prestarse las armas de fuego?",["Sí, durante un máximo de 15 días.","Sí, sin límite de tiempo.","No."],0],[7,606,"¿Pueden prestarse las armas de fuego?",["Sí, a cualquier persona con licencia o permiso para ese tipo de arma.","Sí, pero sólo a parientes.","No."],0],[7,607,"¿Pueden prestarse las armas de fuego?",["Sí, junto con la guía de pertenencia.","Sí, pero sólo el arma, nunca la guía de pertenencia.","No."],0],[7,608,"¿Pueden prestarse los arcos?",["No nunca.","Sí, mediante autorización escrita.","Sí, sin necesidad de mediar documentación alguna."],1],[7,609,"¿Pueden prestarse las ballestas?",["Sí, junto con la guía de pertenencia.","Sí, pero solo el arma, nunca la guía de pertenencia.","No."],0],[7,610,"¿Cuál es el peligro de un disparo horizontal con // Pregunta con foto: [tema, id, texto, opciones, correcta, imagen]. Las opciones se barajan cada vez que se construye la sesión.
function photoQuestions() {
  const out = [];
  for (const [name, imgs, c, g] of SPECIES) {
    const files = imgs.split(','), others = SPECIES.filter(x => x[3] === g && x[0] !== name).map(x => x[0]);
    files.forEach(f => {
      const opts = shuffle([name, ...shuffle(others).slice(0, 2)]);
      out.push([-1, 'F-' + f, '¿Qué especie aparece en la imagen?', opts, opts.indexOf(name), f, name]);
    });
    out.push([-1, 'C-' + files[0], '¿Se puede cazar en la Comunidad de Madrid la especie de la imagen?', CAZA_OPTS, [1, 0, 2][c], files[files.length > 1 ? 1 : 0], name]);
  }
  return out;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('caza:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('caza:' + k, JSON.stringify(v)); } catch (e) {} }
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qid = (r, q) => r + q[1];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const letters = 'abc';

function record(q, correct) {
  const id = qid(region, q);
  const s = stats[id] || [0, 0, 0];
  if (correct) s[0]++; else s[1]++;
  s[2] = correct ? 1 : 0;
  stats[id] = s;
  store.set('stats', stats);
}

function regionSummary(r) {
  const qs = DATA[r].q;
  let seen = 0, ok = 0, failed = 0, totalOk = 0, totalAns = 0;
  for (const q of qs) {
    const s = stats[qid(r, q)];
    if (!s) continue;
    seen++; totalOk += s[0]; totalAns += s[0] + s[1];
    if (s[2]) ok++; else failed++;
  }
  return { seen, ok, failed, total: qs.length, pct: totalAns ? Math.round(totalOk / totalAns * 100) : null };
}

function setDock(html) { const d = $('#dock'); if (!html) { d.hidden = true; $('#dockInner').innerHTML = ''; return; } d.hidden = false; $('#dockInner').innerHTML = html; }

function confirmSheet(title, text, okLabel, onOk) {
  const host = $('#sheetHost');
  host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="panel"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="btns"><button class="btn alt" id="shNo">Seguir</button><button class="btn blaze" id="shOk">${esc(okLabel)}</button></div></div></div>`;
  $('#shNo').onclick = () => host.innerHTML = '';
  $('#shOk').onclick = () => { host.innerHTML = ''; onOk(); };
  host.querySelector('.sheet').addEventListener('click', e => { if (e.target.classList.contains('sheet')) host.innerHTML = ''; });
}

  if ($('#photoBtn')) $('#photoBtn').onclick = () => startStudy('Identificar especies', shuffle(photoQuestions()));
  $('#allBtn').onclick = () => startStudy('Todo en orden', D.q.slice(), store.get('pos:' + region, 0));
  document.querySelectorAll('.tema').forEach(b => b.onclick = () => { const t = +b.dataset.t; startStudy(D.temas[t], D.q.filter(q => q[0] === t)); });
  $('#resetBtn').onclick = () => confirmSheet('Borrar progreso', `Se borrarán tus respuestas y simulacros de ${D.name}.`, 'Borrar', () => {
    for (const q of D.q) delete stats[qid(region, q)];
    history = history.filter(h => h.r !== region);
    store.set('stats', stats); store.set('history', history); store.set('pos:' + region, 0);
    renderHome();
  });
  window.scrollTo(0, 0);
}

/* ---------- Foto ampliada ---------- */
document.addEventListener('click', e => {
  const img = e.target.closest('.qimg img');
  if (!img) return;
  const host = $('#sheetHost');
  host.innerHTML = `<div class="zoom" role="dialog" aria-modal="true" aria-label="Foto ampliada"><img src="${img.getAttribute('src')}" alt="${esc(img.alt)}">${img.dataset.cap ? `<p>${img.dataset.cap}</p>` : ''}<button class="btn alt" aria-label="Cerrar">Cerrar</button></div>`;
  host.querySelector('.zoom').onclick = () => host.innerHTML = '';
});

/* ---------- Temario con respuestas ---------- */
const CAZA_TXT = ['No se puede cazar', 'Cinegética', 'Solo captura en vivo (silvestrismo)'];
function renderBook(tema = 0, query = '') {
  session = { mode: 'book' }; stopTimer();
  $('#homeBtn').hidden = false;
  setDock(null);
  const D = DATA[region], photos = region === 'M', tabs = D.temas.concat(photos ? ['Fotos de especies'] : []);
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const nq = norm(query.trim());
  let body;
  if (photos && tema === D.temas.length) {
    const sp = SPECIES.filter(x => !nq || norm(x[0]).includes(nq));
    body = `<div class="gallery">${sp.map(([name, imgs, c]) => imgs.split(',').map(f => `
      <figure class="qimg"><img src="img/${f}.jpg" alt="${esc(name)}" loading="lazy" data-cap="${esc(spCap(name))}"><figcaption><b>${esc(name)}</b><span class="pill ${c === 1 ? 'ok' : c === 2 ? '' : 'bad'}">${CAZA_TXT[c]}</span><span class="spinfo">${esc(SPECIES_INFO[name] || '')}</span></figcaption></figure>`).join('')).join('')}</div>`;
  } else {
    const qs = D.q.filter(q => nq ? norm(q[2] + ' ' + q[3].join(' ')).includes(nq) : q[0] === tema);
    body = qs.length ? `<div class="review">${qs.map(q => `
      <div class="rv">
        <span class="eyebrow">Pregunta ${q[1]}${nq ? ' · ' + esc(D.temas[q[0]]) : ''}</span>
        <span class="q">${esc(q[2])}</span>
        ${q[3].map((o, i) => `<span class="${i === q[4] ? 'c' : 'o'}">${i === q[4] ? '✓' : '·'} ${letters[i].toUpperCase()}. ${esc(o)}</span>`).join('')}
      </div>`).join('')}</div>` : '<p class="note">No hay preguntas que contengan ese texto.</p>';
  }
  $('#view').innerHTML = `
    <div class="qhead"><span class="eyebrow">Temario con respuestas · ${esc(D.name)}</span></div>
    <input class="search" id="bookQ" type="search" placeholder="Buscar en todas las preguntas…" value="${esc(query)}">
    ${nq ? '' : `<div class="tabs">${tabs.map((t, i) => `<button data-t="${i}" aria-pressed="${i === tema}">${i < D.temas.length ? 'Tema ' + (i + 1) : 'Fotos'}</button>`).join('')}</div>
    <h2>${esc(tabs[tema])}</h2>`}
    ${body}`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { renderBook(+b.dataset.t); window.scrollTo(0, 0); });
  const inp = $('#bookQ');
  inp.oninput = () => { const v = inp.value, pos = inp.selectionStart; renderBook(tema, v); const n = $('#bookQ'); n.focus(); n.setSelectionRange(pos, pos); };
}

/* ---------- Modo estudio ---------- */
function startStudy(title, qs, startAt = 0) {
  if (!qs.length) return;
  session = { mode: 'study', title, qs, i: Math.min(startAt, qs.length - 1), answers: {}, ok: 0, bad: 0, ordered: title === 'Todo en orden' };
  $('#homeBtn').hidden = false;
  renderStudy();
}

const spCap = name => `<b>${esc(name)}</b> ${esc(SPECIES_INFO[name] || '')}`;
const qimg = (q, reveal) => q[5] ? `<figure class="qimg"><img src="img/${q[5]}.jpg" alt="${reveal ? esc(q[6]) : 'Foto de la especie que hay que identificar'}" loading="lazy" data-cap="${reveal ? esc(spCap(q[6])) : ''}">${reveal ? `<figcaption class="spinfo">${spCap(q[6])}</figcaption>` : ''}</figure>` : '';
const qlabel = (q, D) => q[5] ? 'Identificación por foto' : `Pregunta ${q[1]} · ${esc(D.temas[q[0]])}`;

function optHtml(q, i, cls, disabled) {
  return `<button class="opt ${cls}" data-o="${i}" ${disabled ? 'disabled' : ''}><span class="k">${letters[i]}</span><span class="t">${esc(q[3][i])}</span></button>`;
}

function renderStudy() {
  const s = session, q = s.qs[s.i], D = DATA[region], a = s.answers[s.i];
  const answered = a !== undefined;
  if (s.ordered) store.set('pos:' + region, s.i);
  $('#view').innerHTML = `
    <div class="qhead"><span class="eyebrow">${esc(s.title)}</span><span class="eyebrow" style="font-variant-numeric:tabular-nums">${s.i + 1} / ${s.qs.length}</span></div>
    <div class="progress"><i style="width:${(s.i + (answered ? 1 : 0)) / s.qs.length * 100}%"></i></div>
    <article class="qcard">
      <div class="eyebrow">${qlabel(q, D)}</div>
      ${qimg(q, answered)}
      <p class="qtext">${esc(q[2])}</p>
      <div class="opts">${q[3].map((_, i) => optHtml(q, i, answered ? (i === q[4] ? 'right' : i === a ? 'wrong' : '') : '', answered)).join('')}</div>
      ${answered ? `<div class="feedback ${a === q[4] ? 'ok' : 'bad'}">${a === q[4] ? '✓ Correcta' : '✗ Incorrecta · la buena es la ' + letters[q[4]].toUpperCase()}</div>` : ''}
    </article>
    <p class="note" style="text-align:center;font-variant-numeric:tabular-nums">Esta sesión: <b style="color:var(--ok)">${s.ok} bien</b> · <b style="color:var(--bad)">${s.bad} mal</b></p>
  `;
  document.querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => {
    const o = +b.dataset.o, correct = o === q[4];
    s.answers[s.i] = o; if (correct) s.ok++; else s.bad++;
    record(q, correct);
    renderStudy();
  });
  const last = s.i === s.qs.length - 1;
  setDock(`<button class="btn alt" id="prevBtn" ${s.i ? '' : 'disabled'} aria-label="Anterior">‹</button>
    <button class="btn ${answered ? '' : 'alt'}" id="nextBtn" style="flex:1">${last ? 'Terminar' : answered ? 'Siguiente' : 'Saltar'}</button>`);
  $('#prevBtn').onclick = () => { s.i--; renderStudy(); window.scrollTo(0, 0); };
  $('#nextBtn').onclick = () => { if (last) return finishStudy(); s.i++; renderStudy(); window.scrollTo(0, 0); };
}

function finishStudy() {
  const s = session, n = s.ok + s.bad;
  if (s.ordered) store.set('pos:' + region, 0);
  setDock(`<button class="btn" id="backBtn">Volver al inicio</button>`);
  $('#backBtn').onclick = renderHome;
  $('#view').innerHTML = `<div class="result"><span class="eyebrow">${esc(s.title)}</span><div class="big">${n ? Math.round(s.ok / n * 100) : 0}%</div><p class="note">${s.ok} correctas y ${s.bad} falladas de ${n} respondidas.</p></div>`;
  window.scrollTo(0, 0);
}

/* ---------- Simulacro ---------- */
let timerId = null;
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
const mmss = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;

function startExam() {
  const nP = RULES[region].photos || 0;
  const qs = shuffle(DATA[region].q).slice(0, EXAM_N - nP).concat(shuffle(photoQuestions()).slice(0, nP));
  session = { mode: 'exam', qs, i: 0, answers: {}, start: Date.now() };
  $('#homeBtn').hidden = false;
  stopTimer();
  timerId = setInterval(() => { const el = $('#timer'); if (el) el.textContent = mmss(Math.floor((Date.now() - session.start) / 1000)); }, 1000);
  renderExam();
}

function renderExam() {
  const s = session, q = s.qs[s.i], a = s.answers[s.i];
  const done = Object.keys(s.answers).length;
  $('#view').innerHTML = `
    <div class="qhead"><span class="eyebrow">Simulacro ${DATA[region].short} · ${done}/${EXAM_N} respondidas</span><span class="timer" id="timer">${mmss(Math.floor((Date.now() - s.start) / 1000))}</span></div>
    <div class="grid">${s.qs.map((_, i) => `<button data-i="${i}" class="${s.answers[i] !== undefined ? 'done' : ''} ${i === s.i ? 'cur' : ''}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join('')}</div>
    <article class="qcard">
      <div class="eyebrow">Pregunta ${s.i + 1} de ${EXAM_N}</div>
      ${qimg(q)}
      <p class="qtext">${esc(q[2])}</p>
      <div class="opts">${q[3].map((_, i) => optHtml(q, i, i === a ? 'sel' : '', false)).join('')}</div>
    </article>
    <p class="note" style="text-align:center">${esc(RULES[region].label)}. Puedes cambiar respuestas hasta entregar.</p>
  `;
  document.querySelectorAll('.grid button').forEach(b => b.onclick = () => { s.i = +b.dataset.i; renderExam(); });
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = +b.dataset.o;
    if (s.answers[s.i] === o) delete s.answers[s.i]; else s.answers[s.i] = o;
    renderExam();
  });
  const last = s.i === EXAM_N - 1;
  setDock(`<button class="btn alt" id="prevBtn" ${s.i ? '' : 'disabled'} aria-label="Anterior">‹</button>
    <button class="btn alt" id="nextBtn" ${last ? 'disabled' : ''} aria-label="Siguiente">›</button>
    <button class="btn blaze" id="submitBtn">Entregar</button>`);
  $('#prevBtn').onclick = () => { s.i--; renderExam(); };
  $('#nextBtn').onclick = () => { s.i++; renderExam(); };
  $('#submitBtn').onclick = () => {
    const blank = EXAM_N - Object.keys(s.answers).length;
    if (blank) confirmSheet('¿Entregar el examen?', `Te quedan ${blank} preguntas sin responder. Cuentan como no contestadas.`, 'Entregar', gradeExam);
    else gradeExam();
  };
}

function gradeExam() {
  stopTimer();
  const s = session;
  let ok = 0, bad = 0;
  s.qs.forEach((q, i) => { const a = s.answers[i]; if (a === undefined) return; if (a === q[4]) ok++; else bad++; record(q, a === q[4]); });
  const okP = s.qs.filter((q, i) => q[5] && s.answers[i] === q[4]).length;
  const res = { r: region, ok, bad, ...(RULES[region].photos ? { okP } : {}), blank: EXAM_N - ok - bad, t: Math.floor((Date.now() - s.start) / 1000), d: Date.now() };
  history.push(res); history = history.slice(-50); store.set('history', history);
  s.mode = 'result'; s.res = res;
  renderResult();
}

function renderResult() {
  const s = session, res = s.res, R = RULES[region], pass = R.pass(res);
  const wrong = s.qs.map((q, i) => ({ q, i, a: s.answers[i] })).filter(x => x.a !== x.q[4]);
  $('#view').innerHTML = `
    <div class="result">
      <span class="eyebrow">Simulacro ${DATA[region].short} · ${mmss(res.t)} min</span>
      <div class="big">${R.fmt(res)}</div>
      <div class="verdict ${pass ? 'ok' : 'bad'}">${pass ? 'Apto' : 'No apto'}</div>
      <p class="note">${res.ok} correctas · ${res.bad} falladas · ${res.blank} en blanco${res.okP !== undefined ? `<br>Teóricas ${res.ok - res.okP}/20 · Fotos ${res.okP}/10` : ''}<br>${esc(R.label)}</p>
    </div>
    <div class="grid">${s.qs.map((q, i) => `<button data-i="${i}" class="${s.answers[i] === q[4] ? 'g' : 'r'}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join('')}</div>
    ${wrong.length ? `<h2>Para repasar (${wrong.length})</h2>` : '<h2>Sin fallos</h2>'}
    <div class="review">${wrong.map(x => `
      <div class="rv" id="rv${x.i}">
        <span class="eyebrow">${x.i + 1} · ${x.q[5] ? 'Identificación por foto' : `Pregunta ${x.q[1]} del manual`}</span>
        ${qimg(x.q, true)}
        <span class="q">${esc(x.q[2])}</span>
        ${x.a === undefined ? '<span class="y">Sin responder</span>' : `<span class="y">✗ ${letters[x.a].toUpperCase()}. ${esc(x.q[3][x.a])}</span>`}
        <span class="c">✓ ${letters[x.q[4]].toUpperCase()}. ${esc(x.q[3][x.q[4]])}</span>
      </div>`).join('')}</div>
  `;
  document.querySelectorAll('.grid button').forEach(b => b.onclick = () => { const el = document.getElementById('rv' + b.dataset.i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  setDock(`<button class="btn alt" id="backBtn">Inicio</button><button class="btn blaze" id="againBtn">Otro simulacro</button>`);
  $('#backBtn').onclick = renderHome;
  $('#againBtn').onclick = startExam;
  window.scrollTo(0, 0);
}

$('#homeBtn').onclick = () => {
  if (session && session.mode === 'exam') confirmSheet('¿Abandonar el simulacro?', 'Perderás las respuestas de este examen.', 'Abandonar', renderHome);
  else renderHome();
};
renderHome();
</script>

<script>
if ('serviceWorker' in navigator) {
  // Al instalarse una versión nueva del service worker, recarga una vez para mostrarla.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
}
</script>
</body>
</html>
